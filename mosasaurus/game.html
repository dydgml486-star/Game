<title>모사사우루스 바다 모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --deep: #0b2438;
    --panel: #12344f;
    --line: #2c5a7a;
    --ink: #f4f8f2;
    --muted: #a9c6d6;
    --sun: #ffd23f;
    --sun-ink: #3a2a00;
    --coral: #ff7b54;
    --kelp: #5fae6e;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--deep);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding-inline: 16px;
    padding-block: 10px;
    box-sizing: border-box;
    overscroll-behavior: none;
  }
  .wrap { height: 100%; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
  h1 { font-family: "Jua", "Noto Sans KR", sans-serif; font-weight: 400; font-size: 1.5rem; margin: 0; color: var(--sun); letter-spacing: .01em; }
  .tools { display: flex; gap: 8px; }
  button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer;
    touch-action: manipulation;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .stage-area { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .board {
    position: relative;
    width: min(100%, calc((100vh - 96px) * 16 / 9));
    width: min(100%, calc((100dvh - 96px) * 16 / 9));
    max-width: 100%;
    aspect-ratio: 16 / 9;
    border: 3px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: #2a86b8;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    container-type: inline-size;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.2cqw; padding: 16px; text-align: center;
    background: rgba(8, 28, 44, .62);
  }
  .overlay h2 {
    font-family: "Jua", "Noto Sans KR", sans-serif; font-weight: 400;
    font-size: clamp(1.6rem, 7cqw, 4.6rem); line-height: 1.05; margin: 0;
    color: var(--sun); text-wrap: balance;
    text-shadow: 0 .35cqw 0 #0b2438;
  }
  .overlay p { margin: 0; font-size: clamp(.85rem, 2.1cqw, 1.35rem); line-height: 1.5; max-width: 34em; text-wrap: balance; }
  .overlay p.hint { color: var(--muted); font-size: clamp(.72rem, 1.5cqw, 1rem); }
  .big {
    font-family: "Jua", "Noto Sans KR", sans-serif;
    font-size: clamp(1.1rem, 3.6cqw, 2.3rem);
    background: var(--sun); color: var(--sun-ink); border: 0;
    border-radius: 999px; padding: .45em 1.4em;
    box-shadow: 0 .5cqw 0 #c79a00;
  }
  .big:hover { filter: brightness(1.05); }
  .big:active { transform: translateY(.3cqw); box-shadow: 0 .2cqw 0 #c79a00; }
  .bite {
    position: absolute; right: 2.5cqw; bottom: 3cqw;
    width: clamp(64px, 13cqw, 150px); aspect-ratio: 1; border-radius: 50%;
    font-family: "Jua", "Noto Sans KR", sans-serif; font-size: clamp(1.3rem, 4.4cqw, 3rem);
    background: var(--coral); color: #fff; border: .5cqw solid rgba(255,255,255,.85);
    box-shadow: 0 .6cqw 0 #b44a2c; padding: 0; line-height: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .bite small { font-family: "Noto Sans KR", sans-serif; font-size: .38em; opacity: .9; }
  .bite:active { transform: translateY(.3cqw); box-shadow: 0 .2cqw 0 #b44a2c; }
  .bite-below { display: none; }
  .rotate-tip { display: none; color: var(--muted); font-size: .85rem; margin: 0; text-align: center; }
  @media (orientation: portrait) and (max-width: 700px) {
    .board .bite { display: none; }
    .bite-below {
      display: block; width: 100%; max-width: 420px;
      font-family: "Jua", "Noto Sans KR", sans-serif; font-size: 2rem;
      background: var(--coral); color: #fff; border: 0; border-radius: 16px;
      padding: 14px; box-shadow: 0 5px 0 #b44a2c;
    }
    .bite-below:active { transform: translateY(3px); box-shadow: 0 2px 0 #b44a2c; }
    .rotate-tip { display: block; }
  }
  @media (prefers-reduced-motion: reduce) {
    .big:active, .bite:active, .bite-below:active { transform: none; }
  }
</style>

<div class="wrap">
  <header>
    <h1>모사사우루스 바다 모험</h1>
    <div class="tools">
      <button id="btnPause" type="button">멈춤</button>
      <button id="btnSound" type="button" aria-pressed="true">소리 켜짐</button>
    </div>
  </header>

  <div class="stage-area">
    <div class="board" id="board">
      <canvas id="cv" aria-label="모사사우루스가 바다를 헤엄치는 게임 화면"></canvas>
      <button class="bite" id="btnBite" type="button" aria-label="앙! 물기">앙!<small>물기</small></button>

      <div class="overlay" id="ovTitle">
        <h2>모사사우루스 바다 모험</h2>
        <p>바다를 손가락으로 꾹 누른 채 움직이면 모사사우루스가 따라와요.<br>물고기를 냠냠 먹고, 메갈로돈이 달려오면 피하고, 어지러워할 때 콱 물어요!</p>
        <button class="big" id="btnStart" type="button">모험 시작!</button>
        <p class="hint">키보드: 방향키로 이동 · 스페이스 = 앙! · P = 멈춤</p>
      </div>

      <div class="overlay" id="ovClear" hidden>
        <h2 id="clearTitle">1단계 성공!</h2>
        <p id="clearMsg"></p>
        <button class="big" id="btnNext" type="button">다음 바다로!</button>
      </div>

      <div class="overlay" id="ovOops" hidden>
        <h2>앗, 아야!</h2>
        <p>메갈로돈이 아주 세요. 한 번 더 해 볼까요?<br>빨간 줄이 보이면 위나 아래로 쏙 피해요!</p>
        <button class="big" id="btnRetry" type="button">다시 도전!</button>
      </div>

      <div class="overlay" id="ovWin" hidden>
        <h2>바다의 왕 모사사우루스!</h2>
        <p id="winMsg"></p>
        <button class="big" id="btnAgain" type="button">처음부터 다시</button>
      </div>

      <div class="overlay" id="ovPause" hidden>
        <h2>잠깐 쉬는 중</h2>
        <button class="big" id="btnResume" type="button">계속하기</button>
      </div>
    </div>
    <button class="bite-below" id="btnBite2" type="button">앙! 물기</button>
    <p class="rotate-tip">휴대폰을 옆으로 눕히면 바다가 더 커져요</p>
  </div>
</div>

<script>
(() => {
  'use strict';
  const W = 960, H = 540;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FONT = '"Jua", "Noto Sans KR", sans-serif';

  // ---------- 화면 크기 ----------
  let pxScale = 1;
  function resize() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    pxScale = cv.width / W;
  }
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(cv);
  addEventListener('resize', resize);
  resize();

  // ---------- 소리 ----------
  let actx = null, soundOn = true;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(f1, f2, dur, type = 'sine', vol = 0.12, delay = 0) {
    if (!soundOn || !actx) return;
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  const sfx = {
    eat()   { tone(520, 980, 0.12, 'sine', 0.12); },
    gold()  { tone(660, 1320, 0.1, 'triangle', 0.12); tone(990, 1980, 0.14, 'triangle', 0.1, 0.08); },
    chomp() { tone(240, 90, 0.14, 'square', 0.07); },
    boing() { tone(260, 700, 0.3, 'sine', 0.14); },
    hurt()  { tone(420, 110, 0.35, 'sawtooth', 0.08); },
    warn()  { tone(880, 880, 0.11, 'square', 0.05); tone(880, 880, 0.11, 'square', 0.05, 0.2); },
    roar()  { tone(150, 55, 0.6, 'sawtooth', 0.09); },
    hit()   { tone(200, 60, 0.2, 'square', 0.1); tone(900, 1600, 0.16, 'triangle', 0.1, 0.05); },
    heart() { [523, 659, 784].forEach((f, i) => tone(f, f, 0.12, 'triangle', 0.1, i * 0.08)); },
    win()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.01, 0.22, 'triangle', 0.12, i * 0.13)); },
    dash()  { tone(300, 620, 0.15, 'triangle', 0.08); }
  };

  // ---------- 단계 설정 ----------
  const STAGES = [
    { name: '얕은 바다', travel: 30, hp: 3, charges: 1, charge: 520, idle: 2.4, warn: 1.7, tired: 4.2,
      jelly: 7, shark: 6, water: ['#6fd0ee', '#2f93c4', '#1b6592'], far: '#2b7fa6', kelp: '#4fa36a', sand: '#f1d99a', sand2: '#e2c27a', ray: 0.09, coral: false, glow: false },
    { name: '산호초 바다', travel: 34, hp: 4, charges: 2, charge: 580, idle: 2.1, warn: 1.55, tired: 3.8,
      jelly: 5, shark: 4.8, water: ['#48b4d6', '#1f78a8', '#124b77'], far: '#1c6a92', kelp: '#3f9160', sand: '#e7c888', sand2: '#d4ae6a', ray: 0.07, coral: true, glow: false },
    { name: '깊은 바다', travel: 38, hp: 5, charges: 3, charge: 640, idle: 1.9, warn: 1.45, tired: 3.5,
      jelly: 4, shark: 4, water: ['#23679a', '#123f66', '#07192d'], far: '#0d3354', kelp: '#2e6e55', sand: '#9c8a68', sand2: '#857457', ray: 0.04, coral: true, glow: true }
  ];

  // ---------- 상태 ----------
  const G = { mode: 'title', stage: 0, phase: 'travel', t: 0, travelT: 0, worldX: 0, score: 0, fishEaten: 0,
              shake: 0, banner: null, spawn: {}, confetti: 0 };
  const P = { x: 300, y: 280, vx: 0, vy: 0, hearts: 3, inv: 0, bite: 0, dash: 0, cd: 0, dizzy: 0, near: 0 };
  let fish = [], jellies = [], sharks = [], pickups = [], parts = [];
  let M = null;
  let best = 0;
  try { best = +localStorage.getItem('mosa-best') || 0; } catch (e) { best = 0; }

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const hash = k => { const s = Math.sin(k * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  // ---------- 입력 ----------
  const keys = {};
  const ptr = { on: false, x: 0, y: 0, id: null };
  addEventListener('keydown', e => {
    // 버튼에 포커스가 있으면 스페이스·엔터는 브라우저 기본 동작(클릭)에 맡긴다
    if (e.target instanceof HTMLButtonElement && (e.code === 'Space' || e.code === 'Enter')) return;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'Space' && !e.repeat) {
      audio();
      if (G.mode === 'play') bite();
      else { const b = visiblePrimary(); if (b) b.click(); }
    }
    if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) togglePause();
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; ptr.on = false; });

  function toGame(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  cv.addEventListener('pointerdown', e => {
    audio();
    ptr.on = true; ptr.id = e.pointerId;
    const p = toGame(e); ptr.x = p.x; ptr.y = p.y;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  cv.addEventListener('pointermove', e => {
    if (!ptr.on || e.pointerId !== ptr.id) return;
    const p = toGame(e); ptr.x = p.x; ptr.y = p.y;
  });
  const endPtr = e => { if (e.pointerId === ptr.id) ptr.on = false; };
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', endPtr);
  cv.addEventListener('contextmenu', e => e.preventDefault());

  for (const id of ['btnBite', 'btnBite2']) {
    const b = document.getElementById(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); bite(); });
    b.addEventListener('keydown', e => { if (e.code === 'Enter') { audio(); bite(); } });
  }

  // ---------- 오버레이 ----------
  const ov = {
    title: document.getElementById('ovTitle'), clear: document.getElementById('ovClear'),
    oops: document.getElementById('ovOops'), win: document.getElementById('ovWin'), pause: document.getElementById('ovPause')
  };
  function showOverlay(name) {
    for (const k in ov) ov[k].hidden = k !== name;
    const b = name && ov[name] && ov[name].querySelector('.big');
    if (b) setTimeout(() => { try { b.focus({ preventScroll: true }); } catch (_) {} }, 50);
  }
  function visiblePrimary() {
    for (const k in ov) if (!ov[k].hidden) return ov[k].querySelector('.big');
    return null;
  }
  document.getElementById('btnStart').onclick = () => { audio(); startGame(); };
  document.getElementById('btnNext').onclick = () => { if (G.mode !== 'clear') return; audio(); G.stage++; startStage(); };
  document.getElementById('btnRetry').onclick = () => { audio(); retryBoss(); };
  document.getElementById('btnAgain').onclick = () => { audio(); startGame(); };
  document.getElementById('btnResume').onclick = () => { audio(); togglePause(); };
  document.getElementById('btnPause').onclick = e => { e.currentTarget.blur(); togglePause(); };
  const btnSound = document.getElementById('btnSound');
  btnSound.onclick = () => {
    btnSound.blur();
    audio();
    soundOn = !soundOn;
    btnSound.textContent = soundOn ? '소리 켜짐' : '소리 꺼짐';
    btnSound.setAttribute('aria-pressed', String(soundOn));
  };
  function togglePause() {
    if (G.mode === 'play') { G.mode = 'paused'; ptr.on = false; showOverlay('pause'); }
    else if (G.mode === 'paused') { G.mode = 'play'; showOverlay(null); }
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') togglePause(); });

  // ---------- 진행 ----------
  function resetPlayer() {
    Object.assign(P, { x: 220, y: H / 2, vx: 0, vy: 0, hearts: 3, inv: 0, bite: 0, dash: 0, cd: 0, dizzy: 0 });
  }
  function startGame() { G.stage = 0; G.score = 0; startStage(); }
  function startStage() {
    const S = STAGES[G.stage];
    resetPlayer();
    fish = []; jellies = []; sharks = []; pickups = [];
    M = null;
    G.phase = 'travel'; G.travelT = 0; G.fishEaten = 0; G.confetti = 0;
    G.spawn = { fish: 0.4, jelly: S.jelly * 0.6, shark: S.shark * 0.8, heart: 9 };
    G.mode = 'play';
    showOverlay(null);
    banner(`${G.stage + 1}단계 · ${S.name}`, '물고기를 냠냠 먹어요!', 2.6);
  }
  function newMeg() {
    const S = STAGES[G.stage];
    return { x: W + 280, y: H / 2, face: -1, state: 'enter', t: 0, hp: S.hp, max: S.hp, flash: 0,
             charges: 0, lane: H / 2, mouth: 0, off: false, warnedOnce: false };
  }
  function startBoss() {
    G.phase = 'boss';
    M = newMeg();
    G.spawn.fish = 1.2; G.spawn.heart = 6;
    banner('메갈로돈이 나타났다!', '빨간 줄이 보이면 피해요!', 2.6);
    sfx.roar();
  }
  function retryBoss() {
    resetPlayer();
    P.inv = 1.5;
    M = newMeg();
    sharks = []; jellies = [];
    G.mode = 'play';
    showOverlay(null);
    banner('다시 도전!', '할 수 있어요!', 2);
  }
  function stageClear() {
    const S = STAGES[G.stage];
    sfx.win();
    if (G.score > best) { best = G.score; try { localStorage.setItem('mosa-best', String(best)); } catch (e) {} }
    if (G.stage >= STAGES.length - 1) {
      G.mode = 'win'; G.confetti = 6;
      document.getElementById('winMsg').innerHTML =
        `세 바다의 메갈로돈을 모두 물리쳤어요!<br>모은 점수 <b>${G.score}점</b> · 최고 기록 ${best}점`;
      showOverlay('win');
    } else {
      G.mode = 'clear'; G.confetti = 2.5;
      document.getElementById('clearTitle').textContent = `${G.stage + 1}단계 성공!`;
      document.getElementById('clearMsg').innerHTML =
        `${S.name}의 메갈로돈을 물리쳤어요.<br>물고기 <b>${G.fishEaten}마리</b> 냠냠 · 지금 점수 <b>${G.score}점</b>`;
      showOverlay('clear');
    }
  }
  function banner(text, sub, dur) { G.banner = { text, sub, t: 0, dur }; }
  function pop(x, y, text, color) {
    parts.push({ type: 'text', x, y, vx: 0, vy: -50, life: 1.1, max: 1.1, text, color: color || '#fff' });
  }
  function sparks(x, y, n, colors) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(80, 260);
      parts.push({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.8), max: 0.8,
                   size: rand(5, 10), color: colors[i % colors.length], rot: rand(0, 6) });
    }
  }

  function bite() {
    if (G.mode !== 'play' || P.cd > 0) return;
    P.dash = 0.3; P.cd = 0.55; P.bite = 0.3;
    sfx.dash();
    for (let i = 0; i < 6; i++) {
      parts.push({ type: 'bubble', x: P.x - 60 + rand(-10, 10), y: P.y + rand(-15, 15), vx: rand(-80, -30), vy: rand(-40, 10),
                   life: 1.2, max: 1.2, size: rand(3, 7) });
    }
  }

  // ---------- 충돌 ----------
  function playerCircles() {
    return [[P.x + 58, P.y + 2, 20], [P.x + 8, P.y + 4, 22], [P.x - 48, P.y + 2, 14]];
  }
  function megCircles(m, k = 1) {
    const f = m.face;
    return [[m.x + f * 118, m.y + 6, 44 * k], [m.x + f * 30, m.y, 56 * k], [m.x - f * 70, m.y - 3, 40 * k], [m.x - f * 140, m.y, 20 * k]];
  }
  function hitAny(A, B) {
    for (const a of A) for (const b of B) {
      const dx = a[0] - b[0], dy = a[1] - b[1], r = a[2] + b[2];
      if (dx * dx + dy * dy < r * r) return true;
    }
    return false;
  }
  function near(x, y, px, py, r) { const dx = x - px, dy = y - py; return dx * dx + dy * dy < r * r; }

  // ---------- 업데이트 ----------
  function update(dt) {
    G.t += dt;
    const S = STAGES[G.stage];
    const speed = G.mode === 'play' ? (G.phase === 'travel' ? 170 : 55) : 40;
    G.worldX += speed * dt;
    G.shake = Math.max(0, G.shake - dt);

    if (Math.random() < dt * 3) {
      parts.push({ type: 'bubble', x: rand(0, W), y: H + 10, vx: 0, vy: rand(-70, -30), life: 12, max: 12, size: rand(2, 6) });
    }
    if (G.confetti > 0) {
      G.confetti -= dt;
      if (Math.random() < dt * 30) {
        parts.push({ type: 'spark', x: rand(0, W), y: -10, vx: rand(-40, 40), vy: rand(80, 160), life: 4, max: 4,
                     size: rand(6, 11), color: ['#ffd23f', '#ff7b54', '#7ee0c3', '#ff6b9a', '#fff'][Math.floor(rand(0, 5))], rot: rand(0, 6) });
      }
    }
    updateParts(dt);
    if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }

    if (G.mode !== 'play') return;

    updatePlayer(dt);
    if (G.phase === 'travel') {
      G.travelT += dt;
      spawnTravel(dt, S);
      if (G.travelT >= S.travel) startBoss();
    } else if (M) {
      spawnBoss(dt);
      updateMeg(dt, S);
    }
    updateThings(dt, speed);
  }

  function updatePlayer(dt) {
    P.inv = Math.max(0, P.inv - dt);
    P.bite = Math.max(0, P.bite - dt);
    P.dash = Math.max(0, P.dash - dt);
    P.cd = Math.max(0, P.cd - dt);
    P.dizzy = Math.max(0, P.dizzy - dt);
    const max = P.dizzy > 0 ? 150 : 390;
    let tx = 0, ty = 0;
    if (ptr.on) {
      const dx = ptr.x - (P.x + 20), dy = ptr.y - P.y, d = Math.hypot(dx, dy);
      if (d > 6) { const s = Math.min(max, d * 4); tx = dx / d * s; ty = dy / d * s; }
    } else {
      const kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
      const ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
      const l = Math.hypot(kx, ky) || 1;
      tx = kx / l * max; ty = ky / l * max;
    }
    const k = Math.min(1, dt * 7);
    P.vx += (tx - P.vx) * k; P.vy += (ty - P.vy) * k;
    const dashV = P.dash > 0 ? 560 * (P.dash / 0.3) : 0;
    P.x += (P.vx + dashV) * dt; P.y += P.vy * dt;
    const maxX = G.phase === 'travel' ? W * 0.68 : W - 130;
    P.x = clamp(P.x, 150, maxX); P.y = clamp(P.y, 55, H - 50);
  }

  function spawnFish(x, y, gold) {
    fish.push({ x, y, r: gold ? 15 : rand(10, 13), sp: rand(20, 70), ph: rand(0, 6), gold,
                color: ['#ff9f43', '#ffd23f', '#ff6b9a', '#7ee0c3', '#b99cff'][Math.floor(rand(0, 5))] });
  }
  function spawnTravel(dt, S) {
    const sp = G.spawn;
    sp.fish -= dt;
    if (sp.fish <= 0) {
      sp.fish = rand(0.5, 1.05);
      const y = rand(80, H - 90);
      if (Math.random() < 0.28) {
        const n = 4 + Math.floor(rand(0, 3)), arc = Math.random() < 0.5;
        for (let i = 0; i < n; i++) spawnFish(W + 30 + i * 38, y + (arc ? Math.sin(i / (n - 1) * Math.PI) * -50 : 0), false);
      } else spawnFish(W + 30, y, Math.random() < 0.09);
    }
    sp.jelly -= dt;
    if (sp.jelly <= 0) { sp.jelly = S.jelly * rand(0.7, 1.3); jellies.push({ x: W + 40, y: rand(90, H - 120), ph: rand(0, 6), r: 26, cool: 0 }); }
    sp.shark -= dt;
    if (sp.shark <= 0) { sp.shark = S.shark * rand(0.7, 1.3); sharks.push({ x: W + 80, y: rand(90, H - 90), vx: -rand(80, 140), vy: 0, ph: rand(0, 6), hit: false, rot: 0 }); }
    spawnHeart(dt);
  }
  function spawnBoss(dt) {
    G.spawn.fish -= dt;
    if (G.spawn.fish <= 0) { G.spawn.fish = rand(1.1, 1.8); spawnFish(W + 30, rand(80, H - 90), Math.random() < 0.12); }
    spawnHeart(dt);
  }
  function spawnHeart(dt) {
    if (P.hearts >= 3) return;
    G.spawn.heart -= dt;
    if (G.spawn.heart <= 0) { G.spawn.heart = rand(7, 10); pickups.push({ x: W + 30, y: rand(100, H - 110), ph: rand(0, 6) }); }
  }

  function updateThings(dt, speed) {
    const pc = playerCircles();
    const hx = P.x + 60, hy = P.y + 2;
    let nearest = 1e9;

    for (let i = fish.length - 1; i >= 0; i--) {
      const f = fish[i];
      f.x -= (speed + f.sp) * dt;
      f.y += Math.sin(G.t * 3 + f.ph) * 14 * dt;
      const d = Math.hypot(f.x - hx, f.y - hy);
      if (f.x > hx) nearest = Math.min(nearest, d);
      if (d < 30 + f.r) {
        fish.splice(i, 1);
        const v = f.gold ? 5 : 1;
        G.score += v; G.fishEaten++;
        P.bite = Math.max(P.bite, 0.22);
        if (f.gold) { sfx.gold(); sparks(f.x, f.y, 8, ['#ffd23f', '#fff']); pop(f.x, f.y - 20, '+5 반짝!', '#ffd23f'); }
        else { sfx.eat(); pop(f.x, f.y - 20, '+1', '#fff'); }
        continue;
      }
      if (f.x < -40) fish.splice(i, 1);
    }
    P.near = nearest < 110 ? 1 : 0;

    for (let i = jellies.length - 1; i >= 0; i--) {
      const j = jellies[i];
      j.x -= (speed * 0.85 + 15) * dt;
      j.y += Math.sin(G.t * 1.6 + j.ph) * 28 * dt;
      j.cool = Math.max(0, j.cool - dt);
      if (j.cool <= 0 && hitAny(pc, [[j.x, j.y, j.r * 0.9]])) {
        j.cool = 2;
        if (P.dizzy <= 0 && P.inv <= 0) {
          P.dizzy = 1.1; P.vx = -320; P.vy = (P.y < j.y ? -1 : 1) * 200;
          sfx.boing(); pop(P.x + 20, P.y - 50, '어질어질~', '#ffc2e6');
        }
      }
      if (j.x < -60) jellies.splice(i, 1);
    }

    for (let i = sharks.length - 1; i >= 0; i--) {
      const s = sharks[i];
      if (!s.hit) {
        s.x += (s.vx - speed) * dt;
        s.y += Math.sin(G.t * 2 + s.ph) * 20 * dt;
        if (hitAny(pc, [[s.x - 20, s.y, 22], [s.x + 20, s.y, 16]])) {
          s.hit = true; s.vy = -260; s.vx = 60;
          G.score += 3; P.bite = 0.3;
          sfx.chomp(); sparks(s.x, s.y, 6, ['#fff', '#ffd23f']); pop(s.x, s.y - 30, '콱! +3', '#ffd23f');
        }
      } else {
        s.x += (s.vx - speed) * dt; s.y += s.vy * dt; s.vy -= 80 * dt; s.rot += dt * 9;
      }
      if (s.x < -140 || s.y < -120) sharks.splice(i, 1);
    }

    for (let i = pickups.length - 1; i >= 0; i--) {
      const h = pickups[i];
      h.x -= (speed + 30) * dt;
      h.y += Math.sin(G.t * 2 + h.ph) * 20 * dt;
      if (hitAny(pc, [[h.x, h.y, 22]])) {
        pickups.splice(i, 1);
        P.hearts = Math.min(3, P.hearts + 1);
        sfx.heart(); sparks(h.x, h.y, 8, ['#ff5d73', '#fff']); pop(h.x, h.y - 30, '하트 +1', '#ff8fa0');
        continue;
      }
      if (h.x < -40) pickups.splice(i, 1);
    }
  }

  function setMeg(state) { M.state = state; M.t = 0; }
  function updateMeg(dt, S) {
    const m = M;
    m.t += dt;
    m.flash = Math.max(0, m.flash - dt);
    const homeX = W - 190;
    const pc = playerCircles();

    switch (m.state) {
      case 'enter':
        m.x += (homeX - m.x) * Math.min(1, dt * 1.6);
        m.y += (H / 2 - m.y) * dt;
        m.mouth = 0.25;
        if (m.t > 2.3) setMeg('idle');
        break;
      case 'idle':
        m.x += (homeX - m.x) * Math.min(1, dt * 2);
        m.y += clamp(P.y - m.y, -110 * dt, 110 * dt);
        m.y = clamp(m.y, 95, H - 95);
        m.mouth = 0.1;
        if (m.t > S.idle) { m.lane = m.y; m.off = false; setMeg('warn'); sfx.warn(); }
        break;
      case 'warn':
        if (!m.off) {
          m.y += (m.lane - m.y) * Math.min(1, dt * 6);
          m.x = homeX + 26 * Math.min(1, m.t / S.warn);
        }
        m.mouth = Math.min(1, m.t / S.warn);
        if (m.t > S.warn) { setMeg('charge'); sfx.roar(); G.shake = 0.3; }
        break;
      case 'charge': {
        m.x += m.face * S.charge * dt;
        m.mouth = 1;
        if (P.inv <= 0 && hitAny(pc, megCircles(m, 0.82))) hurtPlayer();
        const out = m.face < 0 ? m.x < -290 : m.x > W + 290;
        if (out) {
          m.charges++;
          if (m.charges < S.charges) {
            m.face = -m.face;
            m.lane = clamp(P.y, 90, H - 90); m.y = m.lane; m.off = true;
            setMeg('warn'); sfx.warn();
          } else {
            m.charges = 0; m.face = -1; m.x = W + 280; m.y = clamp(P.y, 130, H - 130);
            setMeg('return');
          }
        }
        break;
      }
      case 'return':
        m.x += (homeX - m.x) * Math.min(1, dt * 2.4);
        m.y += (clamp(m.y, 130, H - 130) - m.y) * dt;
        m.mouth = 0.1;
        if (m.t > 1.3) { setMeg('tired'); banner('지금이야! 콱 물어!', '메갈로돈이 어지러워해요', 1.8); }
        break;
      case 'tired':
        m.x = homeX + Math.sin(G.t * 1.3) * 14;
        m.y += Math.sin(G.t * 1.1) * 18 * dt;
        m.y = clamp(m.y, 110, H - 110);
        m.mouth = 0.35;
        if (hitAny(pc, megCircles(m, 1.05))) hitMeg();
        else if (m.t > S.tired) setMeg('idle');
        break;
      case 'hurt':
        m.x += (W - 130 - m.x) * Math.min(1, dt * 3);
        m.mouth = 0.6;
        if (m.t > 0.9) { if (m.hp <= 0) { m.face = 1; setMeg('defeat'); } else setMeg('idle'); }
        break;
      case 'defeat':
        m.x += 380 * dt; m.y -= 25 * dt; m.mouth = 0.2;
        if (m.x > W + 320) { M = null; stageClear(); }
        return;
    }
    if (m.state !== 'charge' && m.state !== 'tired' && hitAny(pc, megCircles(m))) {
      P.vx = -380; P.x -= 4;
    }
  }

  function hitMeg() {
    const m = M;
    m.hp--; m.flash = 0.45;
    G.score += 10; G.shake = 0.25;
    P.bite = 0.35; P.vx = -320;
    sfx.hit();
    sparks(m.x - 110, m.y, 14, ['#ffd23f', '#fff', '#ff7b54']);
    pop(m.x - 110, m.y - 70, '콱! +10', '#ffd23f');
    setMeg('hurt');
    if (m.hp <= 0) banner('메갈로돈이 도망가요!', '모사사우루스 최고!', 2.2);
  }
  function hurtPlayer() {
    P.hearts--; P.inv = 2.2; G.shake = 0.4;
    P.vx = -260; P.vy = (P.y < M.y ? -1 : 1) * 320;
    sfx.hurt();
    pop(P.x, P.y - 50, '아야!', '#ff8fa0');
    if (P.hearts <= 0) { G.mode = 'oops'; ptr.on = false; setTimeout(() => showOverlay('oops'), 450); }
  }

  function updateParts(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'bubble') p.x += Math.sin(G.t * 3 + p.y * 0.05) * 12 * dt;
      if (p.type === 'spark') { p.vx *= 0.97; p.rot += dt * 5; if (p.max > 1) p.vy = Math.min(p.vy, 160); }
      if (p.life <= 0 || p.y < -20 || p.y > H + 30) parts.splice(i, 1);
    }
    if (parts.length > 400) parts.splice(0, parts.length - 400);
  }

  // ---------- 그리기: 배경 ----------
  function hills(off, base, amp, color, freq) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-30, H + 30);
    for (let x = -30; x <= W + 30; x += 16) {
      const wx = x + off;
      ctx.lineTo(x, base + Math.sin(wx * freq) * amp + Math.sin(wx * freq * 2.7 + 1.3) * amp * 0.5);
    }
    ctx.lineTo(W + 30, H + 30);
    ctx.closePath();
    ctx.fill();
  }
  function drawBackground(S) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, S.water[0]); g.addColorStop(0.55, S.water[1]); g.addColorStop(1, S.water[2]);
    ctx.fillStyle = g;
    ctx.fillRect(-30, -30, W + 60, H + 60);

    // 햇빛 줄기
    ctx.fillStyle = `rgba(255,255,255,${S.ray})`;
    for (let i = 0; i < 5; i++) {
      const x0 = ((i * 240 - G.worldX * 0.08) % 1200 + 1200) % 1200 - 120;
      const sw = Math.sin(G.t * 0.6 + i) * 40;
      ctx.beginPath();
      ctx.moveTo(x0, -10); ctx.lineTo(x0 + 70, -10);
      ctx.lineTo(x0 + 190 + sw, H); ctx.lineTo(x0 + 60 + sw, H);
      ctx.closePath(); ctx.fill();
    }

    hills(G.worldX * 0.25, H - 125, 28, S.far, 0.006);

    // 해초
    const off = G.worldX * 0.6, sp = 130;
    const k0 = Math.floor(off / sp) - 1;
    for (let k = k0; k < k0 + W / sp + 3; k++) {
      const x = k * sp - off + hash(k) * 70;
      const h = 70 + hash(k + 7) * 110;
      const base = H - 55;
      ctx.strokeStyle = S.kelp; ctx.lineWidth = 9; ctx.lineCap = 'round';
      for (let s = 0; s < 2; s++) {
        ctx.beginPath();
        ctx.moveTo(x + s * 14, base);
        const sway = Math.sin(G.t * 1.4 + k + s) * 18;
        ctx.bezierCurveTo(x + s * 14 + sway, base - h * 0.35, x + s * 14 - sway, base - h * 0.7, x + s * 14 + sway * 1.3, base - h * (1 - s * 0.25));
        ctx.stroke();
      }
    }

    // 모래
    hills(G.worldX, H - 42, 9, S.sand, 0.011);
    hills(G.worldX * 1.0 + 300, H - 18, 5, S.sand2, 0.017);

    // 산호와 불가사리
    const off2 = G.worldX, sp2 = 210;
    const j0 = Math.floor(off2 / sp2) - 1;
    for (let k = j0; k < j0 + W / sp2 + 3; k++) {
      const x = k * sp2 - off2 + hash(k * 3) * 90;
      const r = hash(k * 5);
      if (S.coral && r < 0.55) drawCoral(x, H - 38, k);
      else if (r > 0.7) drawStarfish(x, H - 22, 11, hash(k) * 6, '#ff9a62');
      else if (r > 0.55) drawShell(x, H - 26);
    }

    if (S.glow) {
      for (let i = 0; i < 26; i++) {
        const x = ((hash(i) * 1400 - G.worldX * (0.15 + hash(i + 3) * 0.3)) % 1100 + 1100) % 1100 - 70;
        const y = 40 + hash(i + 9) * (H - 160);
        const a = 0.35 + 0.35 * Math.sin(G.t * 2 + i);
        ctx.fillStyle = `rgba(150,255,230,${a})`;
        ctx.beginPath(); ctx.arc(x, y, 2 + hash(i + 2) * 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  function drawCoral(x, y, k) {
    const col = ['#ff7b8a', '#ff9f5a', '#c97bff', '#ffcf5a'][Math.floor(hash(k * 11) * 4)];
    ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = 8;
    const h = 40 + hash(k * 13) * 40;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x, y - h);
    ctx.moveTo(x, y - h * 0.4); ctx.quadraticCurveTo(x - 22, y - h * 0.5, x - 24, y - h * 0.9);
    ctx.moveTo(x, y - h * 0.55); ctx.quadraticCurveTo(x + 22, y - h * 0.6, x + 22, y - h * 1.05);
    ctx.stroke();
    ctx.fillStyle = col;
    for (const [dx, dy] of [[0, -h], [-24, -h * 0.9], [22, -h * 1.05]]) { ctx.beginPath(); ctx.arc(x + dx, y + dy, 7, 0, Math.PI * 2); ctx.fill(); }
  }
  function starPath(x, y, r, rot, pts = 5, inner = 0.45) {
    ctx.beginPath();
    for (let i = 0; i < pts * 2; i++) {
      const a = rot + i * Math.PI / pts - Math.PI / 2;
      const rr = i % 2 ? r * inner : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }
  function drawStarfish(x, y, r, rot, color) {
    starPath(x, y, r, rot, 5, 0.5);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 2; ctx.stroke();
  }
  function drawShell(x, y) {
    ctx.fillStyle = '#fff1dc'; ctx.strokeStyle = '#d9b48a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 10, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    for (let i = -2; i <= 2; i++) { ctx.moveTo(x, y); ctx.lineTo(x + i * 4.5, y - 9 + Math.abs(i)); }
    ctx.stroke();
  }

  // ---------- 그리기: 모사사우루스 ----------
  const MOSA = { body: '#3f9a78', dark: '#2b6f57', belly: '#dff2c8', line: '#18463a', mouth: '#7a2330' };
  function drawMosa(x, y, t, mouth, tilt, blink, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(0.72, 0.72);
    ctx.lineJoin = 'round'; ctx.lineWidth = 3.5; ctx.strokeStyle = MOSA.line;

    const prof = [[0, 18], [0.15, 25], [0.35, 28], [0.6, 20], [0.85, 9], [1, 4]];
    const thick = u => {
      for (let i = 1; i < prof.length; i++) if (u <= prof[i][0]) {
        const a = prof[i - 1], b = prof[i], f = (u - a[0]) / (b[0] - a[0]);
        return a[1] + (b[1] - a[1]) * f;
      }
      return 4;
    };
    const N = 18, x0 = 55, x1 = -150;
    const top = [], bot = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N, sx = x0 + (x1 - x0) * u;
      const sy = Math.sin(t * 7 - u * 4) * u * u * 16;
      const th = thick(u);
      top.push([sx, sy - th]); bot.push([sx, sy + th * 0.92]);
    }
    const E = [x1, Math.sin(t * 7 - 4) * 16];

    // 뒤쪽 지느러미
    flipper(-62, 14 + (bot[11][1] - 20), 0.9 + Math.sin(t * 5 + 1) * 0.3, 0.75, MOSA.dark);

    // 꼬리지느러미 (아래로 처진 모양)
    ctx.fillStyle = MOSA.dark;
    ctx.beginPath();
    ctx.moveTo(E[0] + 14, E[1] - 4);
    ctx.quadraticCurveTo(E[0] - 12, E[1] - 20, E[0] - 30, E[1] - 26);
    ctx.quadraticCurveTo(E[0] - 16, E[1] - 6, E[0] - 10, E[1]);
    ctx.quadraticCurveTo(E[0] - 30, E[1] + 24, E[0] - 48, E[1] + 44);
    ctx.quadraticCurveTo(E[0] - 8, E[1] + 32, E[0] + 14, E[1] + 5);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // 몸통
    const bodyPath = () => {
      ctx.beginPath();
      ctx.moveTo(top[0][0], top[0][1]);
      for (let i = 1; i <= N; i++) ctx.lineTo(top[i][0], top[i][1]);
      for (let i = N; i >= 0; i--) ctx.lineTo(bot[i][0], bot[i][1]);
      ctx.closePath();
    };
    bodyPath(); ctx.fillStyle = MOSA.body; ctx.fill();
    ctx.save(); bodyPath(); ctx.clip();
    ctx.fillStyle = MOSA.belly;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) { const mid = (top[i][1] + bot[i][1]) / 2 + 4; ctx.lineTo(top[i][0], mid); }
    ctx.lineTo(x1 - 10, 80); ctx.lineTo(x0 + 10, 80); ctx.closePath(); ctx.fill();
    ctx.fillStyle = MOSA.dark;
    for (const i of [3, 6, 9, 12]) {
      ctx.beginPath(); ctx.ellipse(top[i][0], top[i][1] + 9, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    bodyPath(); ctx.stroke();

    // 머리
    const a = mouth * 0.5;
    if (mouth > 0.05) {
      ctx.fillStyle = MOSA.mouth;
      ctx.beginPath();
      ctx.moveTo(50, 4); ctx.lineTo(150, 3);
      ctx.lineTo(55 + Math.cos(a) * 95, 5 + Math.sin(a) * 95);
      ctx.closePath(); ctx.fill();
    }
    // 아래턱
    ctx.save();
    ctx.translate(55, 5); ctx.rotate(a);
    ctx.fillStyle = '#fff';
    for (let tx = 8; tx < 86; tx += 11) { ctx.beginPath(); ctx.moveTo(tx, -1); ctx.lineTo(tx + 4, -9); ctx.lineTo(tx + 8, -1); ctx.fill(); }
    ctx.fillStyle = MOSA.belly;
    ctx.beginPath();
    ctx.moveTo(-22, -1); ctx.lineTo(92, -1);
    ctx.quadraticCurveTo(98, 4, 88, 9);
    ctx.bezierCurveTo(60, 17, 10, 19, -22, 13);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    // 윗니
    ctx.fillStyle = '#fff';
    for (let tx = 64; tx < 146; tx += 11) { ctx.beginPath(); ctx.moveTo(tx, 3); ctx.lineTo(tx + 4, 11); ctx.lineTo(tx + 8, 3); ctx.fill(); }
    // 윗턱
    ctx.fillStyle = MOSA.body;
    ctx.beginPath();
    ctx.moveTo(32, -22);
    ctx.bezierCurveTo(75, -30, 122, -17, 152, -4);
    ctx.quadraticCurveTo(158, 1, 150, 4);
    ctx.lineTo(62, 5);
    ctx.quadraticCurveTo(42, 7, 34, 6);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 눈, 콧구멍
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(76, -11, 9, blink ? 1.5 : 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2.5; ctx.stroke();
    if (!blink) {
      ctx.fillStyle = '#1c2a2a'; ctx.beginPath(); ctx.arc(79, -11, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(81, -13.5, 1.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = MOSA.line; ctx.beginPath(); ctx.arc(136, -8, 1.8, 0, Math.PI * 2); ctx.fill();

    // 앞 지느러미
    ctx.lineWidth = 3.5;
    flipper(18, 20, 0.6 + Math.sin(t * 5) * 0.35, 1, MOSA.dark);
    ctx.restore();
  }
  function flipper(x, y, rot, s, color) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-6, -4);
    ctx.quadraticCurveTo(22, 6, 10, 42);
    ctx.quadraticCurveTo(-4, 34, -10, 4);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // ---------- 그리기: 상어 / 메갈로돈 ----------
  const SHARK = { body: '#6d7f8e', dark: '#4b5b68', belly: '#eef2f2', line: '#26323b', mouth: '#5a1520' };
  function drawShark(x, y, face, scale, t, mouth, o) {
    ctx.save();
    ctx.translate(x, y);
    if (o.rot) ctx.rotate(o.rot);
    ctx.scale(face * scale, scale);
    ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = SHARK.line;

    // 꼬리
    ctx.save();
    ctx.translate(-132, 0); ctx.rotate(Math.sin(t * 6) * 0.16);
    ctx.fillStyle = SHARK.dark;
    ctx.beginPath();
    ctx.moveTo(10, -14); ctx.lineTo(-55, -78);
    ctx.quadraticCurveTo(-44, -22, -30, 0);
    ctx.quadraticCurveTo(-44, 26, -56, 56);
    ctx.lineTo(10, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    // 등지느러미
    ctx.fillStyle = SHARK.dark;
    ctx.beginPath();
    ctx.moveTo(18, -56); ctx.quadraticCurveTo(-8, -92, -42, -110);
    ctx.quadraticCurveTo(-36, -76, -54, -48); ctx.closePath(); ctx.fill(); ctx.stroke();

    // 몸통
    const bodyPath = () => {
      ctx.beginPath();
      ctx.moveTo(176, 4);
      ctx.bezierCurveTo(166, -40, 92, -64, 0, -60);
      ctx.bezierCurveTo(-60, -56, -110, -30, -140, -12);
      ctx.lineTo(-140, 12);
      ctx.bezierCurveTo(-100, 36, -40, 56, 20, 56);
      ctx.bezierCurveTo(92, 56, 162, 42, 176, 4);
      ctx.closePath();
    };
    bodyPath(); ctx.fillStyle = SHARK.body; ctx.fill();
    ctx.save(); bodyPath(); ctx.clip();
    ctx.fillStyle = SHARK.belly;
    ctx.beginPath();
    ctx.moveTo(180, 8);
    ctx.bezierCurveTo(130, 20, 60, 22, -20, 20);
    ctx.bezierCurveTo(-70, 18, -110, 12, -145, 4);
    ctx.lineTo(-145, 70); ctx.lineTo(180, 70); ctx.closePath(); ctx.fill();
    ctx.restore();
    if (o.flash > 0) { bodyPath(); ctx.fillStyle = `rgba(255,255,255,${Math.min(0.85, o.flash * 2)})`; ctx.fill(); }
    bodyPath(); ctx.stroke();

    // 아가미
    ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.moveTo(66 + i * 10, -14); ctx.quadraticCurveTo(60 + i * 10, 4, 66 + i * 10, 22); ctx.stroke();
    }
    ctx.lineWidth = 4;
    // 가슴지느러미
    ctx.fillStyle = SHARK.dark;
    ctx.beginPath();
    ctx.moveTo(52, 36); ctx.quadraticCurveTo(30, 78, -4, 98);
    ctx.quadraticCurveTo(8, 62, 6, 42); ctx.closePath(); ctx.fill(); ctx.stroke();

    // 입
    if (mouth > 0.15) {
      const lo = 12 + mouth * 40;
      ctx.fillStyle = SHARK.mouth;
      ctx.beginPath();
      ctx.moveTo(98, 18); ctx.lineTo(170, 10); ctx.lineTo(152, lo); ctx.lineTo(98, 32);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 6; i++) {
        const tx = 104 + i * 11, ty = 18 - i * 1.3;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + 5, ty + 11); ctx.lineTo(tx + 10, ty - 1); ctx.fill();
      }
      for (let i = 0; i < 5; i++) {
        const f = (i + 0.5) / 5, tx = 100 + (150 - 100) * f, ty = 32 + (lo - 32) * f;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + 5, ty - 11); ctx.lineTo(tx + 10, ty); ctx.fill();
      }
    } else {
      ctx.beginPath(); ctx.moveTo(100, 26); ctx.quadraticCurveTo(140, 26, 168, 14); ctx.stroke();
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 4; i++) { const tx = 112 + i * 13; ctx.beginPath(); ctx.moveTo(tx, 25 - i * 2); ctx.lineTo(tx + 4, 32 - i * 2); ctx.lineTo(tx + 8, 24 - i * 2); ctx.fill(); }
    }

    // 눈
    if (o.tired) {
      ctx.strokeStyle = SHARK.line; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 5; a += 0.3) {
        const r = 1 + a * 0.6;
        ctx.lineTo(130 + Math.cos(a + t * 6) * r, -16 + Math.sin(a + t * 6) * r);
      }
      ctx.stroke();
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(130, -16, 10, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(133, -15, 5.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(135, -17, 1.8, 0, Math.PI * 2); ctx.fill();
      if (o.angry) {
        ctx.strokeStyle = SHARK.line; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(116, -32); ctx.lineTo(146, -24); ctx.stroke();
      }
    }
    ctx.restore();

    if (o.tired) {
      for (let i = 0; i < 3; i++) {
        const a = G.t * 3 + i * 2.1;
        const sx = x + face * 130 * scale + Math.cos(a) * 45 * scale;
        const sy = y - 60 * scale + Math.sin(a) * 14 * scale;
        starPath(sx, sy, 12 * scale + 3, a, 5, 0.45);
        ctx.fillStyle = '#ffd23f'; ctx.fill();
        ctx.strokeStyle = '#8a6a00'; ctx.lineWidth = 2; ctx.stroke();
      }
    }
  }

  // ---------- 그리기: 작은 친구들 ----------
  function drawFish(f) {
    ctx.save();
    ctx.translate(f.x, f.y);
    const r = f.r, wag = Math.sin(G.t * 12 + f.ph) * 0.25;
    if (f.gold) {
      ctx.fillStyle = `rgba(255,230,120,${0.3 + 0.2 * Math.sin(G.t * 6)})`;
      ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = f.gold ? '#ffc400' : f.color;
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
    ctx.save(); ctx.translate(r * 1.1, 0); ctx.rotate(wag);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * 0.95, -r * 0.8); ctx.lineTo(r * 0.95, r * 0.8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.3, r * 0.85, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(0, r * 0.35, r * 0.9, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-r * 0.6, -r * 0.2, r * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-r * 0.66, -r * 0.2, r * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawJelly(j) {
    ctx.save();
    ctx.translate(j.x, j.y);
    const pulse = 1 + Math.sin(G.t * 4 + j.ph) * 0.08;
    ctx.scale(pulse, 1 / pulse);
    const r = j.r;
    ctx.strokeStyle = 'rgba(255,190,230,.8)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const x = -r * 0.7 + i * r * 0.35;
      ctx.beginPath(); ctx.moveTo(x, 0);
      for (let s = 1; s <= 6; s++) ctx.lineTo(x + Math.sin(G.t * 4 + s + i) * 5, s * 8);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,150,210,.85)';
    ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0);
    for (let i = 0; i <= 6; i++) ctx.lineTo(r - i * (r * 2 / 6), i % 2 ? 6 : 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.ellipse(-r * 0.4, -r * 0.55, r * 0.25, r * 0.14, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a1c44';
    ctx.beginPath(); ctx.arc(-7, -8, 2.6, 0, Math.PI * 2); ctx.arc(7, -8, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5a1c44'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -4, 5, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.restore();
  }
  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.38);
    ctx.bezierCurveTo(x - s * 0.62, y - s * 0.02, x - s * 0.38, y - s * 0.62, x, y - s * 0.24);
    ctx.bezierCurveTo(x + s * 0.38, y - s * 0.62, x + s * 0.62, y - s * 0.02, x, y + s * 0.38);
    ctx.closePath();
  }
  function drawPickup(h) {
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(h.x, h.y, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    heartPath(h.x, h.y + 2, 26 + Math.sin(G.t * 5) * 2);
    ctx.fillStyle = '#ff5d73'; ctx.fill();
  }

  function drawLane(m) {
    const S = STAGES[G.stage];
    const k = Math.min(1, m.t / S.warn);
    const blink = 0.5 + 0.5 * Math.sin(G.t * 16);
    ctx.fillStyle = `rgba(255,70,70,${0.12 + 0.14 * blink})`;
    ctx.fillRect(-30, m.lane - 72, W + 60, 144);
    ctx.strokeStyle = `rgba(255,120,120,${0.6 + 0.3 * blink})`; ctx.lineWidth = 3;
    ctx.setLineDash([18, 12]);
    ctx.beginPath(); ctx.moveTo(-30, m.lane - 72); ctx.lineTo(W + 30, m.lane - 72);
    ctx.moveTo(-30, m.lane + 72); ctx.lineTo(W + 30, m.lane + 72); ctx.stroke();
    ctx.setLineDash([]);
    // 방향 화살표
    ctx.fillStyle = `rgba(255,255,255,${0.5 + 0.4 * blink})`;
    for (let i = 0; i < 5; i++) {
      const cx = m.face < 0 ? W - 200 - i * 150 - k * 60 : 200 + i * 150 + k * 60;
      ctx.beginPath();
      ctx.moveTo(cx + m.face * 24, m.lane);
      ctx.lineTo(cx - m.face * 8, m.lane - 22);
      ctx.lineTo(cx - m.face * 8, m.lane + 22);
      ctx.closePath(); ctx.fill();
    }
    // 가장자리 느낌표
    const ex = m.face < 0 ? W - 46 : 46;
    ctx.fillStyle = '#ff4a4a';
    ctx.beginPath(); ctx.arc(ex, m.lane, 30 + blink * 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `44px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('!', ex, m.lane + 2);
    outlinedText('피해요!', W / 2, m.lane - 96, 40, '#ffffff', '#b31d1d');
  }

  function outlinedText(text, x, y, size, fill, stroke) {
    ctx.font = `${size}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, size * 0.18);
    ctx.strokeStyle = stroke; ctx.strokeText(text, x, y);
    ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }

  function drawParts(front) {
    for (const p of parts) {
      const a = Math.min(1, p.life / Math.min(p.max, 0.5));
      if (p.type === 'bubble' && !front) {
        ctx.strokeStyle = `rgba(255,255,255,${0.55 * a})`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = `rgba(255,255,255,${0.35 * a})`;
        ctx.beginPath(); ctx.arc(p.x - p.size * 0.35, p.y - p.size * 0.35, p.size * 0.3, 0, Math.PI * 2); ctx.fill();
      } else if (p.type === 'spark' && front) {
        ctx.globalAlpha = a;
        starPath(p.x, p.y, p.size, p.rot, 5, 0.5); ctx.fillStyle = p.color; ctx.fill();
        ctx.globalAlpha = 1;
      } else if (p.type === 'text' && front) {
        ctx.globalAlpha = a;
        outlinedText(p.text, p.x, p.y, 30, p.color, '#0b2438');
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---------- HUD ----------
  function drawHUD() {
    const S = STAGES[G.stage];
    if (G.mode === 'title') return;
    for (let i = 0; i < 3; i++) {
      heartPath(38 + i * 46, 36, 44);
      ctx.fillStyle = i < P.hearts ? '#ff5d73' : 'rgba(10,30,45,.45)'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    }
    // 점수
    drawFish({ x: 36, y: 84, r: 12, ph: 0, color: '#ffd23f' });
    ctx.textAlign = 'left';
    ctx.font = `32px ${FONT}`; ctx.lineWidth = 6; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#0b2438'; ctx.strokeText(`${G.score}점`, 66, 86);
    ctx.fillStyle = '#fff'; ctx.fillText(`${G.score}점`, 66, 86);

    // 가운데 진행 표시
    const bx = W / 2 - 180, by = 22, bw = 360, bh = 20;
    if (G.phase === 'travel') {
      const k = clamp(G.travelT / S.travel, 0, 1);
      roundRect(bx, by, bw, bh, 10); ctx.fillStyle = 'rgba(10,30,45,.5)'; ctx.fill();
      roundRect(bx, by, Math.max(20, bw * k), bh, 10); ctx.fillStyle = '#7fe0b0'; ctx.fill();
      roundRect(bx, by, bw, bh, 10); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      // 메갈로돈 지느러미 표시
      ctx.fillStyle = SHARK.body; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(bx + bw + 8, by + bh + 4); ctx.lineTo(bx + bw + 24, by - 12); ctx.lineTo(bx + bw + 40, by + bh + 4); ctx.closePath(); ctx.fill(); ctx.stroke();
      // 모사사우루스 머리 표시
      const mx = bx + bw * k;
      ctx.fillStyle = MOSA.body; ctx.beginPath(); ctx.ellipse(mx, by + bh / 2, 16, 11, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(mx + 5, by + bh / 2 - 3, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(mx + 6, by + bh / 2 - 3, 2, 0, Math.PI * 2); ctx.fill();
      outlinedText(`${G.stage + 1}단계 · ${S.name}`, W / 2, by + bh + 26, 24, '#fff', '#0b2438');
    } else if (M) {
      outlinedText('메갈로돈', W / 2, by + 6, 26, '#fff', '#0b2438');
      const n = M.max, pw = 40, gap = 10, tw = n * pw + (n - 1) * gap;
      for (let i = 0; i < n; i++) {
        const x = W / 2 - tw / 2 + i * (pw + gap);
        roundRect(x, by + 24, pw, 18, 9);
        ctx.fillStyle = i < M.hp ? '#ff6a4a' : 'rgba(10,30,45,.5)'; ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
      }
    }
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawBanner() {
    const b = G.banner;
    if (!b) return;
    const inT = Math.min(1, b.t / 0.25), outT = Math.min(1, (b.dur - b.t) / 0.4);
    const s = reduceMotion ? 1 : 0.6 + 0.4 * (1 - Math.pow(1 - inT, 3));
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(inT, outT));
    ctx.translate(W / 2, 170); ctx.scale(s, s);
    outlinedText(b.text, 0, 0, 58, '#ffd23f', '#0b2438');
    if (b.sub) outlinedText(b.sub, 0, 56, 28, '#ffffff', '#0b2438');
    ctx.restore();
  }

  // ---------- 그리기 ----------
  function draw() {
    const S = STAGES[G.stage];
    ctx.setTransform(pxScale, 0, 0, pxScale, 0, 0);
    ctx.save();
    if (G.shake > 0 && !reduceMotion) ctx.translate(rand(-1, 1) * 30 * G.shake, rand(-1, 1) * 30 * G.shake);
    drawBackground(S);
    drawParts(false);

    if (G.mode === 'title') {
      const sx = W + 320 - (G.t * 70) % (W + 640);
      ctx.globalAlpha = 0.35;
      drawShark(sx, 150, -1, 0.55, G.t, 0.1, { angry: true });
      ctx.globalAlpha = 1;
    }

    if (M && M.state === 'warn') drawLane(M);
    for (const h of pickups) drawPickup(h);
    for (const f of fish) drawFish(f);
    for (const j of jellies) drawJelly(j);
    for (const s of sharks) drawShark(s.x, s.y, -1, 0.3, G.t + s.ph, s.hit ? 0.8 : 0.1, { rot: s.hit ? s.rot : 0 });

    if (M) {
      const shakeX = M.state === 'warn' && !M.off && !reduceMotion ? Math.sin(G.t * 60) * 4 : 0;
      drawShark(M.x + shakeX, M.y + Math.sin(G.t * 2) * 5, M.face, 1, G.t * (M.state === 'charge' ? 2 : 1), M.mouth,
                { angry: M.state !== 'tired', tired: M.state === 'tired', flash: M.flash });
    }

    const blink = (G.t % 3.3) < 0.13;
    const bob = G.mode === 'play' ? 0 : Math.sin(G.t * 2) * 8;
    let px = P.x, py = P.y + bob;
    if (G.mode === 'title') { px = W * 0.42; py = H * 0.55 + bob; }
    const mouth = P.bite > 0 ? Math.sin(Math.min(1, P.bite / 0.3) * Math.PI) : (P.near ? 0.55 : 0.12 + 0.06 * Math.sin(G.t * 2));
    const alpha = P.inv > 0 && Math.floor(G.t * 12) % 2 ? 0.45 : 1;
    const tilt = clamp(P.vy / 1200, -0.35, 0.35);
    drawMosa(px, py, G.t, mouth, tilt, blink, alpha);
    if (P.dizzy > 0) {
      for (let i = 0; i < 3; i++) {
        const a = G.t * 5 + i * 2.1;
        starPath(px + 40 + Math.cos(a) * 30, py - 38 + Math.sin(a) * 9, 9, a, 5, 0.45);
        ctx.fillStyle = '#ffd23f'; ctx.fill();
      }
    }

    drawParts(true);
    ctx.restore();
    drawHUD();
    drawBanner();
  }

  // ---------- 루프 ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  if (document.fonts && document.fonts.load) document.fonts.load(`40px "Jua"`).catch(() => {});
  requestAnimationFrame(frame);
})();
</script>
