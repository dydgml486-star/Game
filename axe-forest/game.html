<title>빙글도끼 숲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Silkscreen&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #20352f;
    --ink: #f6ecd2;
    --muted: #c9b99a;
    --panel: #2a2119;
    --panel2: #362b21;
    --edge: #110d09;
    --gold: #f2c14e;
    --danger: #d9573b;
    --leaf: #8fd06a;
    --gem: #b48cff;
    --rare: #5aa0ff;
    --unique: #b36bff;
    --legend: #ff9a2e;
    --ancient: #ff4fd8;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Silkscreen", "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; }
  #game canvas { width: 100%; height: 100%; display: block; }

  .box { background: var(--panel); border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); border-radius: 4px; }
  .hud {
    position: fixed; left: 16px; right: 16px; top: calc(10px + env(safe-area-inset-top, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none;
  }
  .left { display: flex; flex-direction: column; gap: 6px; }
  .gold { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 8px; font-size: 20px; color: var(--gold); font-variant-numeric: tabular-nums; transition: transform .12s; transform-origin: left center; }
  .gold.bump { transform: scale(1.12); }
  .gold .gemc { color: var(--gem); margin-left: 6px; display: flex; align-items: center; gap: 6px; }
  .coin { display: inline-block; width: 14px; height: 14px; background: var(--gold); box-shadow: inset -3px -3px 0 #b8862a, inset 2px 2px 0 #fff0b0; flex: none; }
  .gemi { display: inline-block; width: 12px; height: 12px; background: var(--gem); transform: rotate(45deg); box-shadow: inset -2px -2px 0 #7b4fd0; flex: none; }
  .bag { padding: 5px 10px; font-size: 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center; min-width: 150px; font-family: "Do Hyeon", sans-serif; }
  .bag .rank { grid-column: 1 / -1; font-size: 14px; color: var(--gold); }
  .bag .num { font-family: "Silkscreen", sans-serif; font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; }
  .bar { height: 6px; background: var(--edge); min-width: 50px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--leaf); }
  .bar.m > i { background: #e57b6f; }
  .bar.s > i { background: #a9abb0; }
  .bar.hp > i { background: var(--danger); }
  .goal { font-family: "Do Hyeon", sans-serif; font-size: 16px; padding: 6px 12px; max-width: min(36vw, 400px); text-align: center; line-height: 1.3; }
  .goal small { display: block; font-family: "Silkscreen", "Do Hyeon", sans-serif; font-size: 10px; color: var(--muted); letter-spacing: .08em; }
  .right { pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .btns { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; max-width: 330px; }
  .btn { font: inherit; font-family: "Do Hyeon", sans-serif; font-size: 15px; color: var(--ink); padding: 5px 10px; cursor: pointer; }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn.warn { background: var(--danger); }
  .btn.primary { background: var(--gold); color: #1d1a16; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .status { font-family: "Do Hyeon", sans-serif; font-size: 12px; color: var(--muted); text-shadow: 0 1px 0 var(--edge); }
  .zoom { position: fixed; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; }
  .zoom .btn { width: 40px; height: 40px; padding: 0; font-family: "Silkscreen", sans-serif; font-size: 20px; }

  .bossbar { position: fixed; left: 50%; transform: translateX(-50%); top: calc(84px + env(safe-area-inset-top, 0px)); width: min(520px, calc(100vw - 32px)); padding: 6px 10px; font-family: "Do Hyeon", sans-serif; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
  .bossbar .top { display: flex; justify-content: space-between; font-size: 16px; }
  .bossbar b { font-weight: 400; color: #ff8ac4; letter-spacing: .04em; }
  .bossbar .bar { height: 10px; }
  .bossbar .bar > i { background: linear-gradient(90deg, #ff4f8a, #ffb0d0); }

  .hint {
    position: fixed; left: 16px; right: 72px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    text-align: center; font-family: "Do Hyeon", sans-serif; font-size: 15px; color: var(--ink);
    text-shadow: 0 2px 0 var(--edge); pointer-events: none; opacity: .9;
  }

  #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag {
    position: absolute; left: 0; top: 0;
    font-family: "Do Hyeon", sans-serif; font-size: 12px; line-height: 1.15; text-align: center; white-space: nowrap;
    padding: 1px 5px; background: rgba(42,33,25,.88); border: 2px solid var(--edge); border-radius: 3px;
  }
  .tag small { font-size: 11px; color: var(--muted); }
  .tag .c { font-family: "Silkscreen", sans-serif; font-size: 11px; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 4px; }
  .tag .c .coin { width: 8px; height: 8px; box-shadow: inset -2px -2px 0 #b8862a; }
  .tag.max .c { color: var(--leaf); }
  .tag.poor .c { color: var(--muted); }
  .tag.info { background: rgba(17,13,9,.72); }
  .tag.shop { background: rgba(60,30,80,.9); color: #f1dcff; }
  .float {
    position: absolute; left: 0; top: 0;
    font-family: "Silkscreen", "Do Hyeon", sans-serif; font-size: 15px; color: var(--gold);
    text-shadow: 0 2px 0 var(--edge), 2px 0 0 var(--edge), -2px 0 0 var(--edge), 0 -2px 0 var(--edge); white-space: nowrap;
  }
  .float.bad { color: #ff9b85; }
  .float.note { color: var(--ink); font-family: "Do Hyeon", sans-serif; font-size: 17px; }
  .float.gem { color: var(--gem); }
  .float.big { font-size: 22px; }

  #joy { position: fixed; width: 96px; height: 96px; margin: -48px 0 0 -48px; border: 3px solid rgba(246,236,210,.45); border-radius: 50%; pointer-events: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; background: rgba(246,236,210,.55); border-radius: 50%; }
  #hurt { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px 30px rgba(217,87,59,.7); opacity: 0; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 50%, #fff 0%, #ff4fd8 30%, #5aa0ff 60%, transparent 80%); mix-blend-mode: screen; }
  .buy {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(66px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 14px; padding: 8px 10px 8px 14px; font-family: "Do Hyeon", sans-serif;
    width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box;
  }
  .buy .bt { display: flex; gap: 8px; align-items: baseline; font-size: 17px; }
  .buy .bt span { font-size: 13px; color: var(--muted); }
  .buy .bd { font-size: 13px; color: var(--muted); }
  .buy .bc { display: flex; align-items: center; gap: 5px; font-family: "Silkscreen", sans-serif; font-size: 14px; color: var(--gold); }
  .buy .bc small { font-family: "Do Hyeon", sans-serif; color: #ff9b85; font-size: 13px; }
  .buy .btn.primary { font-size: 18px; padding: 8px 18px; }

  .modal { position: fixed; inset: 0; background: rgba(17,13,9,.62); display: flex; align-items: center; justify-content: center; padding-inline: 16px; }
  .sheet { width: 100%; max-width: 760px; max-height: min(86vh, 760px); display: flex; flex-direction: column; font-family: "Do Hyeon", sans-serif; box-sizing: border-box; }
  .sheet h2 { margin: 0; font-weight: 400; font-size: 22px; color: var(--gold); }
  .tabs { display: flex; gap: 4px; padding: 8px 8px 0; flex-wrap: wrap; border-bottom: 2px solid var(--edge); }
  .tabs button { font: inherit; font-size: 16px; color: var(--muted); background: transparent; border: 2px solid transparent; border-bottom: 0; padding: 6px 12px; cursor: pointer; border-radius: 4px 4px 0 0; }
  .tabs button.on { color: var(--ink); background: var(--panel2); border-color: var(--edge); }
  .tabs .sp { flex: 1; }
  .sheet-body { padding: 12px; overflow-y: auto; touch-action: pan-y; display: flex; flex-direction: column; gap: 10px; user-select: text; -webkit-user-select: text; }
  .note { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.4; }
  .note.warn { color: #ffb4a0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .card { background: var(--panel2); border: 2px solid var(--edge); border-left: 5px solid var(--muted); border-radius: 4px; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
  .card.rare { border-left-color: var(--rare); }
  .card.unique { border-left-color: var(--unique); }
  .card.legend { border-left-color: var(--legend); }
  .card.ancient { border-left-color: var(--ancient); background: linear-gradient(135deg, #3b2140, #1f2a45 60%, #3b2a14); animation: glowc 1.6s linear infinite; }
  @keyframes glowc { 0% { box-shadow: 0 0 0 2px #ff4fd8; } 33% { box-shadow: 0 0 0 2px #5aa0ff; } 66% { box-shadow: 0 0 0 2px #f2c14e; } 100% { box-shadow: 0 0 0 2px #ff4fd8; } }
  .card .nm { font-size: 17px; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .grade { font-size: 12px; padding: 0 5px; border-radius: 3px; color: #1d1a16; background: var(--muted); white-space: nowrap; }
  .grade.rare { background: var(--rare); } .grade.unique { background: var(--unique); color: #fff; } .grade.legend { background: var(--legend); }
  .grade.ancient { background: linear-gradient(90deg, #ff4fd8, #5aa0ff, #f2c14e); color: #fff; }
  .card .st { font-size: 13px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 12px; padding: 1px 6px; border-radius: 10px; background: #4a3b2c; color: var(--ink); }
  .chip.off { opacity: .45; }
  .card .acts { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
  .card .acts .btn { font-size: 14px; padding: 4px 9px; }
  .odds { display: flex; gap: 6px; flex-wrap: wrap; }
  .odds span { font-size: 14px; }
  .pulls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pulls .btn { font-size: 17px; padding: 8px 16px; }
  .reveal { animation: pop .45s ease-out both; }
  @keyframes pop { 0% { transform: scale(.4) rotateY(90deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .sw { display: inline-flex; gap: 3px; } .sw i { width: 14px; height: 14px; border: 1px solid var(--edge); display: inline-block; }
  table.tbl { border-collapse: collapse; font-size: 14px; }
  table.tbl td { padding: 2px 10px 2px 0; }

  .backup { position: fixed; inset: 0; background: rgba(17,13,9,.6); display: flex; align-items: center; justify-content: center; padding-inline: 16px; }
  .backup .panel { width: 100%; max-width: 440px; padding: 16px; display: flex; flex-direction: column; gap: 8px; font-family: "Do Hyeon", sans-serif; box-sizing: border-box; }
  .backup h2 { margin: 0; font-weight: 400; font-size: 22px; color: var(--gold); }
  .backup p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.4; }
  .backup label { font-size: 14px; margin-top: 4px; }
  .backup textarea { width: 100%; box-sizing: border-box; font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; background: #17120d; color: var(--ink); border: 2px solid var(--edge); border-radius: 3px; padding: 6px; resize: vertical; user-select: text; -webkit-user-select: text; }
  .backup .row { display: flex; gap: 8px; justify-content: flex-end; }
  .backup .msg { color: var(--ink); min-height: 1.4em; }
  #toast {
    position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%);
    font-family: "Do Hyeon", sans-serif; font-size: 24px; color: var(--gold); padding: 8px 18px; text-align: center; pointer-events: none;
    max-width: calc(100vw - 32px); box-sizing: border-box;
  }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Do Hyeon", sans-serif; font-size: 20px; padding-inline: 16px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .reveal, .card.ancient { animation: none; } }
  @media (max-width: 640px) {
    .goal { font-size: 13px; max-width: 34vw; padding: 5px 8px; }
    .gold { font-size: 16px; }
    .bag { min-width: 118px; }
    .btn { font-size: 13px; padding: 4px 7px; }
    .btns { max-width: 190px; }
    .bossbar { top: calc(236px + env(safe-area-inset-top, 0px)); }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
(async () => {
  if (!window.THREE) { document.getElementById('loading').textContent = '3D 엔진을 불러오지 못했습니다. 새로고침해 주세요.'; return; }

  // ================= 색 관리 =================
  // 코드 안의 '#rrggbb' 색은 화면(sRGB) 기준 값이다. 렌더러가 sRGB로 출력하므로 입력할 때 선형 값으로 바꿔 둔다.
  {
    const P = THREE.Color.prototype, sh = P.setHex, ss = P.setStyle;
    let depth = 0;
    P.setHex = function (h) { depth++; sh.call(this, h); depth--; return depth ? this : this.convertSRGBToLinear(); };
    P.setStyle = function (s) { depth++; ss.call(this, s); depth--; return depth ? this : this.convertSRGBToLinear(); };
  }

  // ================= 3D 모델 (KayKit·Kenney, CC0) =================
  // 모델은 glTF를 JSON 한 파일로 묶어 둔 것. claude.ai 보안 정책은 data:/blob: 주소 fetch를 막으므로
  // 버퍼를 직접 풀어 GLB로 조립해 parse 한다. 내장 이미지는 <img> 경로로 읽도록 createImageBitmap을 끈다.
  const MODELS = {}, CLIPS = {}, MODEL_H = {};
  const NATURE_PAL = {
    leafsGreen: '#4f9a45', leafsDark: '#2f6b3f', leafsFall: '#dd8a34', grass: '#5a9e46',
    woodBark: '#7a5230', woodBarkDark: '#5e4028', woodBirch: '#e6ddcb', woodInner: '#d9b27c', wood: '#9a6a3c', woodDark: '#6b4a2b',
    stone: '#9fa3a8', dirt: '#8a8d92', colorRed: '#de4a4c', colorYellow: '#f2c14e', colorPurple: '#a67cf0', colorTan: '#d9a86c',
  };
  if (THREE.GLTFLoader && THREE.SkeletonUtils) {
    try { window.createImageBitmap = undefined; } catch (e) {}
    const loader = new THREE.GLTFLoader();
    const toGLB = j => {
      let bin = new Uint8Array(0);
      const b = j.buffers && j.buffers[0];
      if (b && b.uri && b.uri.startsWith('data:')) {
        const s = atob(b.uri.slice(b.uri.indexOf(',') + 1));
        bin = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) bin[i] = s.charCodeAt(i);
        delete b.uri;
      }
      const js = new TextEncoder().encode(JSON.stringify(j));
      const jl = Math.ceil(js.length / 4) * 4, bl = Math.ceil(bin.length / 4) * 4;
      const total = 12 + 8 + jl + (bin.length ? 8 + bl : 0);
      const out = new ArrayBuffer(total), dv = new DataView(out), u8 = new Uint8Array(out);
      dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, total, true);
      dv.setUint32(12, jl, true); dv.setUint32(16, 0x4E4F534A, true); u8.fill(0x20, 20, 20 + jl); u8.set(js, 20);
      if (bin.length) { const o = 20 + jl; dv.setUint32(o, bl, true); dv.setUint32(o + 4, 0x004E4942, true); u8.set(bin, o + 8); }
      return out;
    };
    const fetchJSON = async url => {
      for (let i = 0; ; i++) {
        try { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return await r.json(); }
        catch (e) { if (i >= 2) throw e; await new Promise(z => setTimeout(z, 400 * (i + 1))); }
      }
    };
    const LIST = [
      ...['Barbarian', 'Knight', 'Mage', 'Ranger', 'Rogue', 'Rogue_Hooded'].map(n => 'chars/' + n),
      'anims/Rig_Medium_General', 'anims/Rig_Medium_MovementBasic',

  function updateBears(dt) {
    for (const b of bears) {
      const def = b.def;
      for (let i = 0; i < 12; i++) if (b.hitCd[i] > 0) b.hitCd[i] -= dt;
      if (!b.alive) {
        b.respawnT -= dt;
        if (b.respawnT <= 0) { [b.x, b.z] = def.zone(); b.hp = b.maxHp; b.alive = true; b.g.visible = true; b.claimed = null; b.angry = false; }
        continue;
      }
      // 지속 피해
      if (b.dots.length) {
        let dps = 0;
        for (let i = b.dots.length - 1; i >= 0; i--) { const d = b.dots[i]; d.t -= dt; dps += d.dps; if (d.t <= 0) b.dots.splice(i, 1); }
        b.dotAcc += dps * dt; b.dotT += dt;
        if (b.dotT > 0.5) {
          b.dotT = 0;
          const col = b.dots.some(d => d.type === 'f') ? '#ff7a2a' : '#6fd04a';
          emit(col, b.x + rand(-0.5, 0.5), 1 + rand(0, 1), b.z + rand(-0.5, 0.5), 0, 2, 0, 0.5, 0.2);
          const v = b.dotAcc; b.dotAcc = 0;
          dealDirect(b, v, activeSkills(), b.x, b.z, true);
          if (!b.alive) continue;
        }
      }
      if (b.slowT > 0) b.slowT -= dt;
      const slow = b.slowT > 0 ? 0.5 : 1;
      const dx = player.x - b.x, dz = player.z - b.z, d = Math.hypot(dx, dz);
      const chase = !player.dead && def.inZone(player.z) && d < def.aggro;
      const enraged = b.kind === 'boss' && b.hp < b.maxHp * 0.35;
      let mx = 0, mz = 0, sp = 0;
      if (chase) {
        if (!b.angry) {
          if (b.kind === 'dino') { SFX.trex(); floatText('크아앙!', b.x, 4.5, b.z, 'bad big'); }
          if (b.kind === 'boss') { SFX.puing(); floatText('뿌잉뿌잉!!', b.x, 12, b.z, 'bad big'); }
        }
        b.angry = true;
        if (d > def.reach - 0.3 && b.jump <= 0) { mx = dx / d; mz = dz / d; sp = def.chase * (enraged ? 1.3 : 1) * slow; }
        b.atkCd -= dt;
        if (d < def.reach && b.atkCd <= 0) {
          b.atkCd = def.cd * (enraged ? 0.75 : 1); b.bite = 0.3;
          const k = d > 0.01 ? 1 / d : 0;
          damagePlayer(def.dmg, dx * k * def.knock, dz * k * def.knock, b.kind === 'boss' ? '뿌잉!' : b.kind === 'dino' ? '콱!' : '쿵!');
          if (b.kind === 'dino') SFX.trex(); else if (b.kind === 'bear') SFX.roar();
        }
        // 보스: 점프 후 충격파
        if (b.kind === 'boss') {
          b.waveT -= dt;
          if (b.waveT <= 0 && b.jump <= 0 && !b.wave) { b.jump = 0.7; }
          if (enraged && !b.enrageShown) { b.enrageShown = true; toast('뿌잉뿌잉이 분노했습니다!'); SFX.puing(); }
        }
      } else {
        b.angry = false;
        b.t += dt;
        const tx = b.tx - b.x, tz = b.tz - b.z, td = Math.hypot(tx, tz);
        if (td < 0.5 || b.t > 8) { [b.tx, b.tz] = def.zone(); b.t = 0; }
        else if (b.t > 1.5) { mx = tx / td; mz = tz / td; sp = def.wander * slow; }
        if (b.kind === 'boss' && b.hp < b.maxHp) b.hp = Math.min(b.maxHp, b.hp + b.maxHp * 0.02 * dt); // 싸움을 멈추면 조금씩 회복
      }
      if (b.kind === 'boss') {
        if (b.jump > 0) {
          b.jump -= dt;
          b.body.position.y = Math.sin((0.7 - Math.max(0, b.jump)) / 0.7 * Math.PI) * 1.2;
          if (b.jump <= 0) {
            b.body.position.y = 0; b.waveT = enraged ? 4.2 : 6.5;
            b.wave = { r: 1, hit: false, m: ringMesh('#ff4f8a') };
            boomFx(b.x, b.z, 4, '#ff4f8a'); puff(b.x, 0.3, b.z, '#5a4050', 16, 2.5, 0.6);

        }
        if (b.wave) {
          const w = b.wave; w.r += 9 * dt;
          w.m.position.set(b.x, 0.1, b.z); w.m.scale.setScalar(w.r); w.m.material.opacity = Math.max(0, 0.9 - w.r / 14);
          const pd = dist(player.x, player.z, b.x, b.z);
          if (!w.hit && Math.abs(pd - w.r) < 0.9 && !player.dead) { w.hit = true; const k = pd > 0.01 ? 1 / pd : 0; damagePlayer(24, (player.x - b.x) * k * 14, (player.z - b.z) * k * 14, '충격파!'); }
          if (Math.random() < 0.6) { const a = rand(0, 6.28); dust.spawn('#6a5060', b.x + Math.cos(a) * w.r, 0.2, b.z + Math.sin(a) * w.r, 0, 0.8, 0, 0.6, 1, 2, 0, 1, 0.5); }
          if (w.r > 13) { scene.remove(w.m); ringPool.push(w.m); b.wave = null; }

      b.x += mx * sp * dt; b.z += mz * sp * dt;
      b.x = Math.max(-def.xMax, Math.min(def.xMax, b.x)); b.z = Math.max(def.zMin, Math.min(def.zMax, b.z));
      if (sp > 0) b.face = lerpAngle(b.face, Math.atan2(mx, mz), dt * 8);
      else if (chase) b.face = lerpAngle(b.face, Math.atan2(dx, dz), dt * 6);
      b.walk += sp * dt;
      if (b.bump > 0) b.bump -= dt;
      if (b.bite > 0) b.bite -= dt;
      b.g.position.set(b.x, 0, b.z); b.g.rotation.y = b.face;

  applyState(localState);
  showOffline(localState);
  if (location.hash === '#debug') window.__dbg = { player, stats, L, stock, trees, bears, rocks, custs, npcs, beltItems, applyState, snapshot, derived, boss, shots, openShop, pull, makeGachaWeapon, equip, rollGrade,
    get weapons() { return weapons; }, get eq() { return eq; }, get gold() { return gold; }, set gold(v) { gold = v; }, get gems() { return gems; }, set gems(v) { gems = v; },
    MODELS, MODEL_H, get pg() { return pg; }, scene, renderer,
    get cashPile() { return cashPile; }, merge, offlineCalc, showOffline, get skin() { return skin; }, set skin(v) { skin = v; buildPlayer(); }, get skinsOwned() { return skinsOwned; }, damagePlayer, buildPlayer, syncTools };

  let spinA = 0, last = performance.now(), saveT = 0, cloudT = 0, walkT = 0, bankT = 0, stepT = 0, noteT = 0;
  const camGoal = new THREE.Vector3(), camPos = new THREE.Vector3(player.x, 30 * zoom, player.z + 22 * zoom), camLook = new THREE.Vector3(player.x, 0, player.z);

  function tryMove(nx, nz) {
    const x = player.x, z = player.z;
    if ((z >= BEAR_Z) !== (nz >= BEAR_Z) && Math.min(x, nx) < QX) { if (!(L.gateBear && Math.abs(nx) < GAP - 0.3)) nz = z; }
    if ((x >= QX) !== (nx >= QX) && nz > BEAR_Z) { if (!(L.gateQuarry && Math.abs(nz - QZ) < GAP - 0.3)) nx = x; }
    if ((z >= DINO_Z) !== (nz >= DINO_Z) && Math.min(x, nx) < QX) { if (!(L.gateDino && Math.abs(nx) < GAP - 0.3)) nz = z; }
    if ((z >= BOSS_Z) !== (nz >= BOSS_Z) && Math.min(x, nx) < QX) { if (!(L.gateBoss && Math.abs(nx) < GAP - 0.3)) nz = z; }
    nx = Math.max(-34, Math.min(59, nx)); nz = Math.max(-107, Math.min(18, nz));
    if (nz < BEAR_Z) nx = Math.max(-34, Math.min(nx, 34));
    if (nx > QX) nz = Math.max(nz, BEAR_Z + 0.5);
    if (Math.abs(nx - STALL.x) < 1.9 && Math.abs(nz - STALL.z) < 0.95) {
      const ox = 1.9 - Math.abs(nx - STALL.x), oz = 0.95 - Math.abs(nz - STALL.z);
      if (ox < oz) nx += Math.sign(nx - STALL.x || 1) * ox; else nz += Math.sign(nz - STALL.z || 1) * oz;
    }
    player.x = nx; player.z = nz;
  }

  // 저사양 기기: 2초 평균 프레임이 40fps 아래면 해상도를 한 단계 낮추고, 여유가 생기면 되돌린다
  const PR_MAX = Math.min(1.5, devicePixelRatio || 1);
  let prAcc = 0, prN = 0;
  function adaptRes(raw) {
    if (!(raw > 0 && raw < 0.5)) return;
    prAcc += raw; prN++;
    if (prAcc < 2) return;
    const avg = prAcc / prN, pr = renderer.getPixelRatio(); prAcc = 0; prN = 0;
    const np = avg > 1 / 40 && pr > 0.75 ? pr - 0.25 : avg < 1 / 57 && pr < PR_MAX ? Math.min(PR_MAX, pr + 0.25) : pr;
    if (np !== pr) { renderer.setPixelRatio(np); resize(); }
  }
  function frame(now) {
    adaptRes((now - last) / 1000);
    const dt = Math.min(0.05, (now - last) / 1000); last = now; frameDt = dt;
    if (shopOpen) {                 // 상점이 열려 있으면 게임은 멈춘다
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
      return;
    }
    clock += dt;
    const D = derived();

    // ---- 이동: 가속·감속으로 부드럽게 ----
    let mx = 0, mz = 0;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    if (keys['w'] || keys['arrowup']) mz -= 1;
    if (keys['s'] || keys['arrowdown']) mz += 1;
    let mag = Math.hypot(mx, mz);
    if (mag > 0) { mx /= mag; mz /= mag; mag = 1; }
    if (joy) {
      const jl = Math.hypot(joy.dx, joy.dy);
      if (jl > 0.12) { mx = joy.dx / jl; mz = joy.dy / jl; mag = Math.min(1, (jl - 0.12) / 0.7); }
    }
    if (player.stun > 0) { player.stun -= dt; mag = 0; }
    if (player.dead > 0) {
      mag = 0; player.dead -= dt;
      if (!pg.userData.rig) pg.rotation.x = -Math.min(1, (2.2 - player.dead) * 4) * Math.PI / 2;
      if (player.dead <= 0) revivePlayer();
    } else {
      if (player.inv > 0) player.inv -= dt;
      player.calm += dt;
      if (player.calm > 4) player.hp = Math.min(D.maxHp, player.hp + dt * (2 + D.maxHp * 0.02));
      player.hp = Math.min(player.hp, D.maxHp);
    }
    const tvx = mx * D.speed * mag, tvz = mz * D.speed * mag;
    const acc = 1 - Math.exp(-(mag > 0 ? 12 : 16) * dt);
    player.vx += (tvx - player.vx) * acc; player.vz += (tvz - player.vz) * acc;
    const spd = Math.hypot(player.vx, player.vz);
    if (spd > 0.02) tryMove(player.x + player.vx * dt, player.z + player.vz * dt);
    if (Math.abs(player.kx) + Math.abs(player.kz) > 0.05) {
      tryMove(player.x + player.kx * dt, player.z + player.kz * dt);
      const f = Math.exp(-7 * dt); player.kx *= f; player.kz *= f;
    }
    const moving = spd > 0.4;
    if (player.aimT > 0) { player.aimT -= dt; }
    if (moving) player.face = lerpAngle(player.face, Math.atan2(player.vx, player.vz), dt * 12);
    else if (player.aimT > 0) player.face = lerpAngle(player.face, player.aimFace, dt * 10);
    if (moving) { walkT += dt * Math.min(1.3, spd / 4.6); stepT += dt; if (stepT > 0.32) { stepT = 0; SFX.step(); puff(player.x, 0.1, player.z, '#d8ccb0', 2, 0.45, 0.4); } }
    pg.position.set(player.x, 0, player.z); if (!player.dead) pg.rotation.y = player.face;
    pg.userData.aim = player.aimT > 0 && !!eqW('ranged');
    pg.userData.dead = player.dead > 0;
    if (pg.userData.aim) pg.userData.armL.rotation.x = -1.4;
    animPerson(pg, moving, walkT, Math.min(1, spd / 4));

    // ---- 도끼 / 곡괭이 회전 + 타격 ----
    spinA += D.spin * dt;
    const sk = D.sk, hitR = D.axeHitR;
    axes.forEach((ax, i) => {
      const a = spinA + i * Math.PI * 2 / axes.length;
      const x = player.x + Math.cos(a) * D.radius, z = player.z + Math.sin(a) * D.radius;
      ax.position.set(x, 0.9, z); ax.rotation.set(0, -a, 0.25);
      if (player.dead) return;
      { const hr = D.radius + 0.45, awp = eqW('axe'), tc = awp ? (awp.grade === 'ancient' ? '#' + new THREE.Color().setHSL((clock * 0.5 + i / axes.length) % 1, 1, 0.6).getHexString() : GRADES[awp.grade].col) : '#cfe0ff';
        glow.spawn(tc, player.x + Math.cos(a) * hr, 1.05, player.z + Math.sin(a) * hr, 0, 0, 0, 0.2, awp ? 0.7 : 0.45, 0.08, 0, 0, awp ? 1 : 0.6); }
      const ci = i % 12;
      for (const tr of trees) {
        if (!tr.alive || tr.hitCd[ci] > 0 || Math.abs(tr.x - x) > 1.6 || Math.abs(tr.z - z) > 1.6) continue;
        if (dist(tr.x, tr.z, x, z) < (tr.big ? 1.1 : 0.85) + hitR) { tr.hitCd[ci] = 0.25; applyHit(tr, D.dmg, sk); }
      }
      if (player.z < BEAR_Z + 3) for (const b of bears) {
        if (!b.alive || b.hitCd[ci] > 0 || Math.abs(b.x - x) > 6 || Math.abs(b.z - z) > 6) continue;
        if (dist(b.x, b.z, x, z) < b.def.hitR + hitR) { b.hitCd[ci] = 0.3; applyHit(b, D.dmg, sk); }
      }
    });
    picks.forEach((pk, i) => {
      const a = -spinA * 0.85 + i * Math.PI * 2 / picks.length;
      const R = D.radius + 0.9;
      const x = player.x + Math.cos(a) * R, z = player.z + Math.sin(a) * R;
      pk.position.set(x, 1.1, z); pk.rotation.set(0, -a, -0.3);
      if (player.x < QX - 3 || player.dead) return;
      for (const rk of rocks) {
        if (!rk.alive || rk.hitCd[i] > 0 || Math.abs(rk.x - x) > 1.5 || Math.abs(rk.z - z) > 1.5) continue;
        if (dist(rk.x, rk.z, x, z) < 1.05) { rk.hitCd[i] = 0.25; applyHit(rk, D.pickDmg, sk.filter(s => s === 'loot' || s === 'crit')); }
      }
    });

    updateRanged(dt, D);
    updateWorld(dt, clock);
    updateBears(dt);

    // ---- 아이템 줍기 (컨베이어가 있는 구역이면 벨트로 바로) ----
    const beltOn = false;   // 컨베이어는 투입구에 넣어야 동작 (자동 흡수 없음)
    for (let i = drops.length - 1; i >= 0; i--) {
      const o = drops[i]; o.t += dt;
      if (o.state === 'pop' || o.state === 'ground') {
        if (o.state === 'pop') {
          o.vy -= 18 * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.z += o.vz * dt;
          if (o.y <= 0.02) { o.y = 0.02; o.state = 'ground'; }
        }
        if (o.t > 0.3 && !player.dead && dist(o.x, o.z, player.x, player.z) < D.magnet) {
          const cat = CAT[o.type];
          if (o.type === 'g' || beltOn || catCount(cat) + player.reserved < D.caps[cat]) { o.state = 'fly'; if (o.type !== 'g' && !beltOn) player.reserved++; o.res = o.type !== 'g' && !beltOn; }
          else if (player.fullMsgT <= 0) { floatText(`가방(${cat === 'w' ? '나무' : cat === 'm' ? '고기' : '광물'}) 가득!`, player.x, 2.6, player.z, 'bad'); player.fullMsgT = 2.5; }
        }
        if (o.state === 'ground' && o.t > 60) { scene.remove(o.m); drops.splice(i, 1); continue; }
      }
      if (o.state === 'fly') {
        const tx = player.x, ty = 1.2 + player.carry.length * 0.26, tz = player.z;
        const k = Math.min(1, dt * 14);
        o.x += (tx - o.x) * k; o.y += (ty - o.y) * k; o.z += (tz - o.z) * k;
        if (dist(tx, tz, o.x, o.z) < 0.35) {
          if (o.res) player.reserved--;
          if (o.type === 'g') { gems++; stats.gem++; SFX.gem(); floatText('+1', player.x, 2.4, player.z, 'gem'); }
          else {
            if (o.type === 'm' || o.type === 'd') stats.meat++;
            if (catCount(CAT[o.type]) < D.caps[CAT[o.type]]) player.carry.push(o.type);
            else { o.state = 'ground'; o.t = 0; continue; }
            SFX.pick();
          }
          scene.remove(o.m); drops.splice(i, 1); continue;
        }
      }
      o.m.position.set(o.x, o.y, o.z); o.m.rotation.y += dt * 3;
    }
    if (player.fullMsgT > 0) player.fullMsgT -= dt;
    if (noteT > 0) noteT -= dt;

    // ---- 판매대 / 투입구 / 컨베이어 구역 자동 투입 ----
    player.depT -= dt;
    if (player.carry.length && player.depT <= 0 && !player.dead) {
      if (onPad(DEPOSIT.x, DEPOSIT.z, player.x, player.z)) {
        stock.push(player.carry.pop()); stats.deposited++; stockDirty = true; player.depT = 0.05; SFX.drop();
      } else {
        for (const b of BELTS) if (L[b.k] && dist(b.hop.x, b.hop.z, player.x, player.z) < 3) { beltPush(b, player.carry.pop()); stats.deposited++; player.depT = 0.05; SFX.drop(); sparks(b.hop.x, 1, b.hop.z, '#f2c14e', 2, 2); break; }
      }
    }
    if (shownCarry !== player.carry.length) { shownCarry = player.carry.length; rebuildStack(stackG, player.carry, 60); }

    // ---- 돈 더미 ----
    if (cashPile > 0 && dist(player.x, player.z, CASH.x, CASH.z) < 1.8) collectCash(false);
    if (L.bank) { bankT += dt; if (bankT > 2.5) { bankT = 0; if (cashPile > 0) collectCash(true); } }
    rebuildCash();
    if (stockDirty) rebuildStock();

    updatePads(clock);
    updateBelts(dt, D);
    updateCustomers(dt, clock, D);
    updateNpcs(dt, clock);
    for (const c of cashiers) if (c) animPerson(c, false, clock);
    updateFx(dt);

    // ---- 파편 / 코인 / 이펙트 ----
    for (let i = chips.length - 1; i >= 0; i--) {
      const c = chips[i]; c.t += dt; c.vy -= 16 * dt;
      c.x += c.vx * dt; c.y += c.vy * dt; c.z += c.vz * dt;
      if (c.y < 0.05) { c.y = 0.05; c.vx *= 0.6; c.vz *= 0.6; }
      c.m.position.set(c.x, c.y, c.z);
      if (c.t > 0.7) { scene.remove(c.m); chips.splice(i, 1); }
    }
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i]; c.t += dt;
      if (c.t < 0) continue;
      const k = Math.min(1, c.t / c.dur);
      c.m.visible = true;
      c.m.position.set(c.ax + (c.bx - c.ax) * k, c.ay + (c.by - c.ay) * k + Math.sin(k * Math.PI) * 1.6, c.az + (c.bz - c.az) * k);
      c.m.rotation.y += dt * 12;
      if (k >= 1) { scene.remove(c.m); coins.splice(i, 1); }
    }
    glow.update(dt); dust.update(dt);
    fxLight.intensity *= Math.exp(-9 * dt);
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i]; b.t += dt; b.ln.material.opacity = Math.max(0, 1 - b.t / 0.14);
      if (b.t > 0.14) { scene.remove(b.ln); boltPool.push(b.ln); bolts.splice(i, 1); }
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i]; r.t += dt;
      if (!r.m) r.m = ringMesh(r.c);
      const k = r.t / r.life;
      r.m.position.set(r.x, 0.12, r.z); r.m.scale.setScalar(r.r0 + (r.r1 - r.r0) * k); r.m.material.opacity = Math.max(0, 0.8 * (1 - k));
      if (k >= 1) { scene.remove(r.m); ringPool.push(r.m); rings.splice(i, 1); }
    }

    // ---- 카메라 (살짝 앞을 내다보며 부드럽게 따라간다) ----
    const lx = player.x + player.vx * 0.3, lz = player.z + player.vz * 0.3;
    const ck = 1 - Math.exp(-6 * dt);
    camGoal.set(lx, 30 * zoom, lz + 22 * zoom);
    camPos.lerp(camGoal, ck);
    camLook.x += (lx - camLook.x) * ck; camLook.z += (lz - 1 - camLook.z) * ck;
    camera.position.copy(camPos);
    if (shake > 0) { shake -= dt; camera.position.x += rand(-1, 1) * shake * 0.6; camera.position.y += rand(-1, 1) * shake * 0.6; }
    camera.lookAt(camLook.x, 0, camLook.z);
    sun.position.set(player.x + 12, 30, player.z + 10);
    sun.target.position.set(player.x, 0, player.z - 4); sun.target.updateMatrixWorld();

    updateGoal(clock);
    renderer.render(scene, camera);

    // ---- HTML 라벨 ----
    for (const p of PADS) if (!p.tag.hidden) project(p.x, 0, p.z + 1.0, p.tag);
    project(DEPOSIT.x - 2.1, 0, DEPOSIT.z - 0.2, depTag, -12);
    chkTag.hidden = L.cashier > 0;
    if (!chkTag.hidden) project(CHECK[0].x + 0.4, 0, CHECK[0].z - 1.0, chkTag, -24);
    stockTag.textContent = '재고 ' + stock.length + ' · 손님 ' + custs.filter(c => c.state !== 'leave').length;
    project(STALL.x, 3.1, STALL.z, stockTag, -26);
    cashTag.hidden = cashPile <= 0;
    if (!cashTag.hidden) { cashTag.innerHTML = `<div class="c"><i class="coin"></i>${fmt(cashPile)}</div>`; project(CASH.x + 1.9, 0, CASH.z, cashTag, -12); }
    BELTS.forEach((b, i) => { hopTags[i].hidden = !L[b.k]; if (L[b.k]) project(b.hop.x, 1, b.hop.z + 1, hopTags[i]); });
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i]; f.t += dt;
      project(f.x, f.y + f.t * 1.4, f.z, f.d, -12);
      f.d.style.opacity = Math.max(0, 1 - f.t / 1.1);
      if (f.t > 1.1) { f.d.remove(); floats.splice(i, 1); }
    }

    // ---- HUD ----
    $('hGold').textContent = fmt(gold);
    $('hGem').textContent = gems;
    for (const [c, id] of [['w', 'W'], ['m', 'M'], ['s', 'S']]) {
      const n = catCount(c), cap = D.caps[c];
      $('n' + id).textContent = n + '/' + cap;
      $('b' + id).style.width = Math.min(100, n / cap * 100) + '%';
    }
    $('hRank').textContent = RANKS[curTier] + ' · ' + (SKINS[skin] || SKINS[0]).name;
    $('hHp').textContent = Math.ceil(Math.max(0, player.hp)) + '/' + D.maxHp;
    $('hHpBar').style.width = Math.max(0, Math.min(100, player.hp / D.maxHp * 100)) + '%';
    const showBoss = L.gateBoss && player.z < BOSS_Z + 8 && boss.alive;
    $('bossBar').hidden = !showBoss;
    if (showBoss) { $('bossFill').style.width = (boss.hp / boss.maxHp * 100) + '%'; $('bossHp').textContent = fmt(Math.max(0, boss.hp)) + ' / ' + fmt(boss.maxHp); }
    if (goldBumpT > 0) { goldBumpT -= dt; if (goldBumpT <= 0) $('goldBox').classList.remove('bump'); }
    if (player.hurtT > 0) player.hurtT -= dt;
    $('hurt').style.opacity = Math.max(0, player.hurtT / 0.35);
    if (flashT > 0) { flashT -= dt; $('flash').style.opacity = Math.max(0, Math.min(1, flashT)); } else $('flash').style.opacity = 0;
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
    if (resetArm > 0) { resetArm -= dt; if (resetArm <= 0) { $('btnReset').textContent = '처음부터'; $('btnReset').classList.remove('warn'); } }
    if (clock > 8) $('hint').hidden = true;

    saveT += dt; if (saveT > 4) { saveT = 0; saveLocal(); }
    cloudT += dt; if (cloudT > 30) { cloudT = 0; saveCloud(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
