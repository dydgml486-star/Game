<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {
  const loadEl = document.getElementById('load');
  if (!window.THREE) { loadEl.textContent = '3D 엔진을 불러오지 못했습니다.'; return; }
  loadEl.hidden = true;
  const hasPost = !!(THREE.EffectComposer && THREE.UnrealBloomPass && THREE.ShaderPass);

  // ---------- 렌더러 ----------
  const host = document.getElementById('v');
  const renderer = new THREE.WebGLRenderer({ antialias: !hasPost });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  host.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1, 0.3, 300);

  // 하늘: 위는 파랗게, 지평선은 따뜻하게

    side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vP; void main(){ vP = (modelMatrix * vec4(position,1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 top = vec3(0.36,0.62,0.9); vec3 hor = vec3(0.98,0.9,0.78); gl_FragColor = vec4(mix(hor, top, smoothstep(-0.05, 0.45, h)), 1.0); }',
  }));

  // ---------- 조명 ----------
  scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x5a4a30, 0.9));
  const sun = new THREE.DirectionalLight(0xfff0d8, 2.4);

  sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 4; sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
  Object.assign(sun.shadow.camera, { left: -28, right: 28, top: 28, bottom: -28, near: 1, far: 80 });

  // ---------- 재질 도구 ----------
  const grad = (() => { const d = new Uint8Array([90, 90, 90, 175, 175, 175, 255, 255, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RGBFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();

  const OUT = new THREE.MeshBasicMaterial({ color: lin('#2a1d18'), side: THREE.BackSide });

    const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); m.castShadow = true; m.receiveShadow = true;
    if (outline) { const o = new THREE.Mesh(geo, OUT); o.scale.setScalar(1 + outline); m.add(o); }
    return m;
  }
  const hash = (x, y) => { let h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967295; };
  function vnoise(x, y) { const X = Math.floor(x), Y = Math.floor(y), fx = x - X, fy = y - Y, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = hash(X, Y), b = hash(X + 1, Y), c = hash(X, Y + 1), d = hash(X + 1, Y + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }

    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
    if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
    return t;
  }
  let sd = 3; const rnd = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };

  // ---------- 지형 (정점 색 + 부드러운 기복) ----------

  const baseEdge = (x, z) => Math.max(Math.abs(x) - 13, z < 5 ? -6 - z : z - 16);
  {
    const g = new THREE.PlaneGeometry(100, 100, 160, 160); g.rotateX(-Math.PI / 2); g.translate(0, 0, 4);
    const p = g.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
    const G1 = new THREE.Color('#5c9a3c'), G2 = new THREE.Color('#7cb84a'), G3 = new THREE.Color('#4a8634'), S1 = new THREE.Color('#e3c792'), S2 = new THREE.Color('#d2b27a');
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i), e = baseEdge(x, z), road = Math.abs(x) - 2.2 + vnoise(x * .5, z * .5) * .6;
      const n = vnoise(x * 0.18, z * 0.18), n2 = vnoise(x * 0.9, z * 0.9);
      const sandK = Math.min(1, Math.max(Math.max(0, (0.8 - e) / 1.6), z > 15 ? Math.max(0, (0.6 - road) / 1.2) : 0));
      c.copy(G3).lerp(G1, n).lerp(G2, n2 * 0.5);

      c.convertSRGBToLinear(); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
      const h = e > 2 ? (vnoise(x * 0.12, z * 0.12) - 0.4) * Math.min(1, (e - 2) / 6) * 2.2 : 0;
      p.setY(i, Math.max(-0.2, h));
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
    const ground = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true }));
    ground.receiveShadow = true; scene.add(ground);
  }
  const heightAt = (x, z) => { const e = baseEdge(x, z); return e > 2 ? Math.max(-0.2, (vnoise(x * 0.12, z * 0.12) - 0.4) * Math.min(1, (e - 2) / 6) * 2.2) : 0; };

  // ---------- 풀 (흔들리는 인스턴스) ----------
  const grassU = { time: { value: 0 } };
  {
    const blade = new THREE.PlaneGeometry(0.11, 0.34, 1, 3); blade.translate(0, 0.17, 0);
    const mat = new THREE.MeshLambertMaterial({ side: THREE.DoubleSide });
    mat.onBeforeCompile = sh => {
      sh.uniforms.time = grassU.time;
      sh.vertexShader = 'uniform float time;\n' + sh.vertexShader.replace('#include <begin_vertex>',
        `#include <begin_vertex>
         vec4 wp = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
         float k = position.y * position.y * 5.0;
         transformed.x += sin(time * 1.7 + wp.x * 0.5 + wp.z * 0.35) * k * 0.35;
         transformed.z += cos(time * 1.3 + wp.x * 0.3) * k * 0.15;`);
    };
    const N = 22000, im = new THREE.InstancedMesh(blade, mat, N), o = new THREE.Object3D(), c = new THREE.Color();
    let n = 0;
    for (let i = 0; i < N * 3 && n < N; i++) {
      const x = rnd() * 80 - 40, z = rnd() * 70 - 26;
      if (baseEdge(x, z) < 0.6 || (z > 15 && Math.abs(x) < 3)) continue;
      o.position.set(x, heightAt(x, z), z); o.rotation.set(0, rnd() * 3.14, 0); const s = 0.6 + rnd() * 0.9; o.scale.set(s, s * (0.7 + rnd() * 0.6), s); o.updateMatrix();
      im.setMatrixAt(n, o.matrix); im.setColorAt(n, c.setHSL(0.25 + rnd() * 0.05, 0.5, 0.3 + rnd() * 0.12).convertSRGBToLinear()); n++;
    }
    im.count = n; im.receiveShadow = true; scene.add(im);
  }

  // ---------- 나무·바위 ----------
  const trunkG = new THREE.CylinderGeometry(0.16, 0.26, 1.6, 7); trunkG.translate(0, 0.8, 0);
  const trunkM = toon('#7a5234');
  const leafCols = ['#5aa33e', '#6fb84a', '#4a9036', '#e89a3a'];
  const trees = [];
  function oak(x, z, s) {
    const g = new THREE.Group(); g.position.set(x, heightAt(x, z), z); g.scale.setScalar(s);
    g.add(mesh(trunkG, trunkM, 0, 0, 0, 0.04));
    const col = leafCols[rnd() < 0.12 ? 3 : Math.floor(rnd() * 3)];
    const top = new THREE.Group(); top.position.y = 1.5; g.add(top);
    for (const [ox, oy, oz, r] of [[0, 0.7, 0, 1.05], [-0.6, 0.35, 0.2, 0.75], [0.6, 0.4, -0.1, 0.8], [0.1, 1.25, -0.2, 0.7], [0.2, 0.3, 0.6, 0.7]]) {
      const geo = new THREE.IcosahedronGeometry(r, 1);
      top.add(mesh(geo, toon('#' + new THREE.Color(col).offsetHSL(0, 0, (oy - 0.6) * 0.08).getHexString()), ox, oy, oz, 0.03));
    }
    scene.add(g); trees.push({ top, ph: rnd() * 6 });
  }
  function pine(x, z, s) {
    const g = new THREE.Group(); g.position.set(x, heightAt(x, z), z); g.scale.setScalar(s);
    g.add(mesh(trunkG, trunkM, 0, 0, 0, 0.04));
    const top = new THREE.Group(); top.position.y = 1.0; g.add(top);
    for (let i = 0; i < 3; i++) top.add(mesh(new THREE.ConeGeometry(1.25 - i * 0.3, 1.5, 8), toon(['#2f6e44', '#3a8050', '#46905a'][i]), 0, 0.75 + i * 0.85, 0, 0.035));
    scene.add(g); trees.push({ top, ph: rnd() * 6 });
  }
  for (let i = 0; i < 70; i++) {
    const x = rnd() * 76 - 38, z = rnd() * 64 - 28;
    if (baseEdge(x, z) < 2.5 || (z > 14 && Math.abs(x) < 4)) continue;
    (rnd() < 0.45 ? pine : oak)(x, z, 0.9 + rnd() * 0.5);
  }
  const rockM = new THREE.MeshStandardMaterial({ color: lin('#9aa0a8'), roughness: 0.9, flatShading: true });
  for (const [x, z, s] of [[15, -4, 1], [-16, 4, 0.8], [16.5, 9, 1.2], [-15.5, 15, 0.9], [9, -9, 0.7], [-10, -8, 0.8]]) {
    const r = mesh(new THREE.DodecahedronGeometry(0.9, 0), rockM, x, heightAt(x, z) + 0.4 * s, z, 0.03); r.scale.set(s * 1.3, s * 0.8, s); r.rotation.y = s * 3; scene.add(r);
  }
  // 꽃
  { const fl = new THREE.InstancedMesh(new THREE.SphereGeometry(0.07, 6, 4), new THREE.MeshLambertMaterial(), 500), o = new THREE.Object3D(), c = new THREE.Color(); let n = 0;
    for (let i = 0; i < 2000 && n < 500; i++) { const x = rnd() * 70 - 35, z = rnd() * 60 - 24; if (baseEdge(x, z) < 1) continue; o.position.set(x, heightAt(x, z) + 0.28, z); o.updateMatrix(); fl.setMatrixAt(n, o.matrix); fl.setColorAt(n, c.set(['#fff4d6', '#ffd24a', '#ff8fb0', '#b9a8ff'][Math.floor(rnd() * 4)]).convertSRGBToLinear()); n++; }
    fl.count = n; scene.add(fl); }

  // ---------- 기지 소품 ----------
  const woodTex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#a0703f'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 32) { g.fillStyle = '#7a5230'; g.fillRect(0, y, w, 3); for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(90,56,30,${0.15 + Math.random() * 0.2})`; g.fillRect(Math.random() * w, y + 4 + Math.random() * 26, 20 + Math.random() * 50, 1.5); } }
  }, [1, 1]);
  const woodM = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.8 });
  const stripeTex = canvasTex(256, 64, (g) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#fff3dc' : '#e2574c'; g.fillRect(i * 32, 0, 32, 64); } g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(0, 56, 256, 8); });
  function crate(x, z, r) { const b = mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), woodM, x, 0.35, z, 0.03); b.rotation.y = r || 0; scene.add(b); }
  function barrel(x, z) { const b = mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.8, 14), woodM, x, 0.4, z, 0.03); scene.add(b); const ring = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.03, 6, 20), std('#555a60', { metalness: 0.6, roughness: 0.4 })); ring.rotation.x = Math.PI / 2; ring.position.y = 0.2; b.add(ring); const r2 = ring.clone(); r2.position.y = -0.2; b.add(r2); }
  // 판매대
  scene.add(mesh(new THREE.BoxGeometry(3.4, 1.0, 1.3), woodM, 0, 0.5, 6, 0.02));
  scene.add(mesh(new THREE.BoxGeometry(3.7, 0.12, 1.55), woodM, 0, 1.06, 6, 0.02));
  for (const [x, z] of [[-1.65, 5.4], [1.65, 5.4], [-1.65, 6.6], [1.65, 6.6]]) scene.add(mesh(new THREE.CylinderGeometry(0.07, 0.07, 2.2, 8), woodM, x, 1.9, z, 0.04));
  { const g = new THREE.PlaneGeometry(4.1, 2.1, 16, 8), p = g.attributes.position;
    for (let i = 0; i < p.count; i++) { const y = p.getY(i); p.setZ(i, Math.cos(y / 2.1 * Math.PI) * 0.35); if (Math.abs(y) > 0.99) p.setZ(i, p.getZ(i) + Math.sin(p.getX(i) * 6) * 0.04); }
    g.computeVertexNormals();
    const aw = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: stripeTex, side: THREE.DoubleSide, roughness: 0.9 })); aw.rotation.x = -Math.PI / 2 + 0.25; aw.position.set(0, 3.05, 6); aw.castShadow = true; scene.add(aw); }
  // 판매대 위 상품
  const logM = toon('#9a6536'), logEndM = toon('#e0b47a');
  for (let i = 0; i < 5; i++) { const l = mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.7, 10), logM, -1.2 + (i % 3) * 0.28, 1.25 + Math.floor(i / 3) * 0.24, 6 - 0.2 + (i % 2) * 0.1, 0.04); l.rotation.z = Math.PI / 2; scene.add(l); }
  for (let i = 0; i < 3; i++) { const m = mesh(new THREE.SphereGeometry(0.2, 12, 8), toon('#d45a4a'), 0.5 + i * 0.35, 1.3, 6, 0.05); m.scale.set(1.3, 0.8, 1); scene.add(m); }
  crate(2.6, 7.4, 0.3); crate(2.9, 6.6, -0.2); barrel(-2.5, 7.3); barrel(-12.8, 3.5); crate(-12.7, 8.5, 0.5);
  // 컨베이어
  const beltTex = canvasTex(128, 32, (g) => { g.fillStyle = '#34383f'; g.fillRect(0, 0, 128, 32); g.strokeStyle = '#4c525c'; g.lineWidth = 3; for (let x = 0; x < 128; x += 16) { g.beginPath(); g.moveTo(x, 2); g.lineTo(x + 8, 16); g.lineTo(x, 30); g.stroke(); } }, [12, 1]);
  scene.add(mesh(new THREE.BoxGeometry(9.6, 0.35, 1.0), std('#5d646e', { metalness: 0.4, roughness: 0.5 }), -6.4, 0.45, 6));
  const beltTop = new THREE.Mesh(new THREE.PlaneGeometry(9.5, 0.8), new THREE.MeshStandardMaterial({ map: beltTex, roughness: 0.6 })); beltTop.rotation.x = -Math.PI / 2; beltTop.position.set(-6.4, 0.635, 6); beltTop.receiveShadow = true; scene.add(beltTop);
  for (const s of [-1, 1]) scene.add(mesh(new THREE.BoxGeometry(9.6, 0.08, 0.08), std('#ffc93a', { metalness: 0.3, roughness: 0.4 }), -6.4, 0.68, 6 + s * 0.46));
  for (let x = -10.8; x < -2; x += 1.6) for (const s of [-1, 1]) scene.add(mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.45, 6), std('#4a4f57'), x, 0.22, 6 + s * 0.4));
  { const hop = mesh(new THREE.CylinderGeometry(0.85, 0.55, 0.9, 12), std('#6b737e', { metalness: 0.5, roughness: 0.45 }), -11.8, 0.9, 6, 0.03); scene.add(hop);
    scene.add(mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), std('#4d545e'), -11.8, 0.45, 6)); }
  const beltLogs = [0, 0.25, 0.5, 0.75].map(p => { const l = mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.7, 10), logM, 0, 0.8, 6, 0.04); l.rotation.x = Math.PI / 2; scene.add(l); return { l, p }; });
  // 강화 발판 + 떠 있는 아이콘
  const padM = std('#d9b67a', { roughness: 0.6 }), rimM = std('#e8b440', { metalness: 0.7, roughness: 0.3, emissive: '#3a2400' });
  const icons = [];
  function iconAxe(c) { const g = new THREE.Group(); g.add(mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.9, 6), woodM, 0, 0, 0, 0.08)); const h = mesh(new THREE.BoxGeometry(0.34, 0.26, 0.07), std(c, { metalness: 0.8, roughness: 0.25 }), 0.17, 0.3, 0, 0.08); g.add(h); return g; }
  function iconBag() { const g = new THREE.Group(); const b = mesh(new THREE.SphereGeometry(0.28, 14, 10), toon('#b07a44'), 0, 0, 0, 0.06); b.scale.set(1, 0.9, 0.8); g.add(b); g.add(mesh(new THREE.TorusGeometry(0.12, 0.03, 6, 12), toon('#7a4e2a'), 0, 0.26, 0)); return g; }
