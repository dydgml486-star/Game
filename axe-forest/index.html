<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>빙글도끼 숲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Silkscreen&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #20352f;
    --ink: #f6ecd2;
    --muted: #c9b99a;
    --panel: #2a2119;
    --edge: #110d09;
    --gold: #f2c14e;
    --danger: #d9573b;
    --leaf: #8fd06a;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Silkscreen", "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; }
  #game canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

  .box { background: var(--panel); border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); border-radius: 4px; }
  .hud {
    position: fixed; left: 16px; right: 16px; top: calc(10px + env(safe-area-inset-top, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none;
  }
  .left { display: flex; flex-direction: column; gap: 6px; }
  .gold { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 8px; font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .coin { display: inline-block; width: 14px; height: 14px; background: var(--gold); box-shadow: inset -3px -3px 0 #b8862a, inset 2px 2px 0 #fff0b0; flex: none; }
  .bag { padding: 5px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; min-width: 128px; }
  .bag .row { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--edge); }
  .bar > i { display: block; height: 100%; width: 0; background: var(--leaf); }
  .bar.hp > i { background: var(--danger); }
  .goal { font-family: "Do Hyeon", sans-serif; font-size: 17px; padding: 6px 12px; max-width: min(46vw, 420px); text-align: center; line-height: 1.3; }
  .goal small { display: block; font-family: "Silkscreen", "Do Hyeon", sans-serif; font-size: 10px; color: var(--muted); letter-spacing: .08em; }
  .right { pointer-events: auto; }
  .btn { font: inherit; font-family: "Do Hyeon", sans-serif; font-size: 15px; color: var(--ink); padding: 5px 10px; cursor: pointer; }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn.warn { background: var(--danger); }

  .hint {
    position: fixed; left: 16px; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    text-align: center; font-family: "Do Hyeon", sans-serif; font-size: 15px; color: var(--ink);
    text-shadow: 0 2px 0 var(--edge); pointer-events: none; opacity: .9;
  }

  #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag {
    position: absolute; left: 0; top: 0; transform: translate(-50%, 0);
    font-family: "Do Hyeon", sans-serif; font-size: 14px; line-height: 1.15; text-align: center; white-space: nowrap;
    padding: 2px 7px; background: rgba(42,33,25,.88); border: 2px solid var(--edge); border-radius: 3px;
  }
  .tag .c { font-family: "Silkscreen", sans-serif; font-size: 12px; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 4px; }
  .tag .c .coin { width: 9px; height: 9px; box-shadow: inset -2px -2px 0 #b8862a; }
  .tag.max .c { color: var(--leaf); }
  .tag.poor .c { color: var(--muted); }
  .tag.info { background: rgba(17,13,9,.7); }
  .float {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
    font-family: "Silkscreen", "Do Hyeon", sans-serif; font-size: 16px; color: var(--gold);
    text-shadow: 0 2px 0 var(--edge), 2px 0 0 var(--edge), -2px 0 0 var(--edge), 0 -2px 0 var(--edge); white-space: nowrap;
  }
  .float.bad { color: #ff9b85; }
  .float.note { color: var(--ink); font-family: "Do Hyeon", sans-serif; font-size: 18px; }

  #joy { position: fixed; width: 96px; height: 96px; margin: -48px 0 0 -48px; border: 3px solid rgba(246,236,210,.45); border-radius: 50%; pointer-events: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; background: rgba(246,236,210,.55); border-radius: 50%; }
  #hurt { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px 30px rgba(217,87,59,.75); opacity: 0; }
  #toast {
    position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%);
    font-family: "Do Hyeon", sans-serif; font-size: 26px; color: var(--gold); padding: 8px 18px; text-align: center; pointer-events: none;
  }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Do Hyeon", sans-serif; font-size: 20px; padding-inline: 16px; text-align: center; }
  @media (max-width: 560px) {
    .goal { font-size: 14px; max-width: 44vw; }
    .gold { font-size: 18px; }
    .bag { min-width: 104px; font-size: 11px; }
  }
</style>
</head><body>

<div id="game"></div>
<div id="tags"></div>
<div id="hurt"></div>

<div class="hud">
  <div class="left">
    <div class="box gold"><i class="coin"></i><span id="hGold">0</span></div>
    <div class="box bag">
      <div class="row"><span>BAG</span><span id="hBag">0/10</span></div>
      <div class="bar"><i id="hBagBar"></i></div>
      <div class="row" id="hHpRow" hidden><span>HP</span><span id="hHp">10</span></div>
      <div class="bar hp" id="hHpBarWrap" hidden><i id="hHpBar"></i></div>
    </div>
  </div>
  <div class="box goal" id="goal"><small id="goalNo">GOAL 1</small><span id="goalTxt"></span></div>
  <div class="right"><button class="box btn" id="btnReset">처음부터</button></div>
</div>

<div class="hint" id="hint">화면을 드래그하거나 WASD·방향키로 이동</div>
<div id="joy" hidden><i></i></div>
<div class="box" id="toast" hidden></div>
<div id="loading">숲을 불러오는 중…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  if (!window.THREE) { document.getElementById('loading').textContent = '3D 엔진을 불러오지 못했습니다. 새로고침해 주세요.'; return; }
  document.getElementById('loading').hidden = true;

  // ================= 기본 설정 =================
  const V = 0.2;                       // 복셀 한 칸 크기(월드 단위)
  const FENCE_Z = -22;                 // 곰 숲 울타리
  const GATE_HALF = 2.2;
  const PRICE = { w: 2, m: 8 };        // 나무 2G, 고기 8G
  const STALL = { x: 0, z: 6 };
  const DEPOSIT = { x: 0, z: 4.1 };
  const CHECKOUT = { x: 2.9, z: 4.1 };

  const $ = id => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ================= 렌더러 =================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#20352f');
  scene.fog = new THREE.Fog('#20352f', 36, 70);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  const renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.BasicShadowMap;
  $('game').appendChild(renderer.domElement);

  function resize() {
    const w = innerWidth, h = innerHeight;
    const px = Math.max(2, Math.min(4, Math.round(Math.min(w, h) / 230)));
    renderer.setSize(Math.ceil(w / px), Math.ceil(h / px), false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  scene.add(new THREE.HemisphereLight(0xe8f4ff, 0x4d5b36, 0.5));
  const sun = new THREE.DirectionalLight(0xfff0d0, 0.72);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 70 });
  scene.add(sun, sun.target);

  // ================= 복셀 도우미 =================
  const BOX = new THREE.BoxGeometry(1, 1, 1);
  const MC = {};
  const M = c => MC[c] || (MC[c] = new THREE.MeshLambertMaterial({ color: c }));
  function vx(g, x, y, z, w, h, d, c, shadow = true) {
    const m = new THREE.Mesh(BOX, M(c));
    m.scale.set(w * V, h * V, d * V);
    m.position.set((x + w / 2) * V, (y + h / 2) * V, (z + d / 2) * V);
    m.castShadow = shadow; m.receiveShadow = true;
    g.add(m); return m;
  }
  function noiseTex(cols, n, rep) {
    const c = document.createElement('canvas'); c.width = c.height = n;
    const g = c.getContext('2d');
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { g.fillStyle = cols[(Math.random() * cols.length) | 0]; g.fillRect(x, y, 1, 1); }
    const t = new THREE.CanvasTexture(c);
    t.magFilter = t.minFilter = THREE.NearestFilter;
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]);
    return t;
  }
  function flat(w, d, x, z, y, tex) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshLambertMaterial({ map: tex }));
    m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m;
  }

  // ================= 지형 =================
  const G = ['#5f9e4a', '#5a9746', '#64a54e', '#578f43', '#6aab52'];
  flat(90, 90, 0, -12, 0, noiseTex(G, 32, [8, 8]));
  flat(60, 23, 0, -33.5, 0.01, noiseTex(['#3f7040', '#3a683c', '#447744', '#36613a'], 32, [8, 3]));
  const SAND = ['#c9ad74', '#c2a56c', '#cfb47d', '#bb9f66'];
  flat(24, 21, 0, 5.5, 0.02, noiseTex(SAND, 32, [4, 3.5]));
  flat(4, 16, 0, 24, 0.02, noiseTex(SAND, 16, [1, 4]));

  // 꽃·풀 장식 (인스턴스)
  {
    const r = mulberry32(3);
    const deco = new THREE.InstancedMesh(BOX, M('#ffffff'), 260);
    const cols = ['#f4e36b', '#f3f0e6', '#e86a6a', '#7dc35b', '#4f8a3c'];
    const d = new THREE.Object3D(), col = new THREE.Color();
    for (let i = 0; i < 260; i++) {
      let x, z;
      do { x = r() * 66 - 33; z = r() * 60 - 42; } while (Math.abs(x) < 12.5 && z > -5 && z < 17);
      const grass = r() < 0.6;
      d.position.set(x, grass ? 0.1 : 0.08, z);
      d.scale.set(grass ? 0.12 : 0.16, grass ? 0.2 : 0.16, grass ? 0.12 : 0.16);
      d.updateMatrix(); deco.setMatrixAt(i, d.matrix);
      deco.setColorAt(i, col.set(grass ? cols[3 + (r() < .5 ? 0 : 1)] : cols[(r() * 3) | 0]));
    }
    scene.add(deco);
  }

  // 울타리
  const fenceGate = new THREE.Group();
  {
    const posts = [];
    for (let x = -33; x <= 33; x += 1.1) if (Math.abs(x) > GATE_HALF) posts.push(x);
    const pm = new THREE.InstancedMesh(BOX, M('#7a4b28'), posts.length);
    const d = new THREE.Object3D();
    posts.forEach((x, i) => { d.position.set(x, 0.45, FENCE_Z); d.scale.set(0.22, 0.9, 0.22); d.updateMatrix(); pm.setMatrixAt(i, d.matrix); });
    pm.castShadow = true; scene.add(pm);
    for (const s of [-1, 1]) for (const y of [0.35, 0.7]) {
      const rail = new THREE.Mesh(BOX, M('#9a6a3c'));
      rail.scale.set(33 - GATE_HALF, 0.12, 0.1); rail.position.set(s * (GATE_HALF + (33 - GATE_HALF) / 2), y, FENCE_Z);
      rail.castShadow = true; scene.add(rail);
    }
    for (const x of [-GATE_HALF, GATE_HALF]) { const p = new THREE.Mesh(BOX, M('#5b3a1e')); p.scale.set(0.35, 1.5, 0.35); p.position.set(x, 0.75, FENCE_Z); p.castShadow = true; scene.add(p); }
    for (let i = 0; i < 4; i++) { const b = new THREE.Mesh(BOX, M(i % 2 ? '#8a5a32' : '#9a6a3c')); b.scale.set(GATE_HALF * 2 - 0.4, 0.28, 0.14); b.position.set(0, 0.25 + i * 0.3, FENCE_Z); b.castShadow = true; fenceGate.add(b); }
    scene.add(fenceGate);
  }

  // ================= 모델 =================
  function makePerson(shirt, pants, hair, hat) {
    const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
    const legL = vx(body, -2, 0, -1, 2, 3, 2, pants), legR = vx(body, 0, 0, -1, 2, 3, 2, pants);
    vx(body, -2.5, 3, -1.5, 5, 4, 3, shirt);
    const armL = vx(body, -3.5, 3.5, -1, 1, 3, 2, shirt), armR = vx(body, 2.5, 3.5, -1, 1, 3, 2, shirt);
    vx(body, -2, 7, -2, 4, 4, 4, '#f1c27d');
    vx(body, -2.2, 10, -2.2, 4.4, 1.2, 4.4, hair);
    vx(body, -2.2, 8, -2.2, 4.4, 2, 1, hair);
    vx(body, -1.3, 8.4, 2, 0.8, 0.9, 0.2, '#1d1a16'); vx(body, 0.5, 8.4, 2, 0.8, 0.9, 0.2, '#1d1a16');
    if (hat) { vx(body, -2.6, 10.8, -2.6, 5.2, 0.8, 5.2, hat); vx(body, -1.9, 11.6, -1.9, 3.8, 1, 3.8, hat); }
    g.userData = { body, legL, legR, armL, armR };
    scene.add(g); return g;
  }
  function animPerson(p, moving, t) {
    const u = p.userData, s = moving ? Math.sin(t * 14) : 0;
    u.legL.rotation.x = s * 0.6; u.legR.rotation.x = -s * 0.6;
    u.armL.rotation.x = -s * 0.5; u.armR.rotation.x = s * 0.5;
    u.body.position.y = moving ? Math.abs(Math.cos(t * 14)) * 0.05 : 0;
  }
  function makeAxe(small) {
    const g = new THREE.Group();
    vx(g, -0.5, -3, -0.5, 1, 6, 1, '#7a4b28');
    vx(g, 0.5, 0.5, -0.5, 2.5, 2.5, 1, '#9aa5ad');
    vx(g, 3, 0, -0.5, 0.7, 3.5, 1, '#e8eef2');
    if (!small) g.scale.setScalar(1.35);
    scene.add(g); return g;
  }
  function makeItem(type) {
    const g = new THREE.Group();
    if (type === 'w') { vx(g, -1.4, 0, -0.6, 2.8, 1.1, 1.2, '#8a5a32'); vx(g, 1.4, 0, -0.6, 0.25, 1.1, 1.2, '#dcb57f'); vx(g, -1.65, 0, -0.6, 0.25, 1.1, 1.2, '#dcb57f'); }
    else { vx(g, -0.9, 0, -0.8, 1.8, 1.2, 1.6, '#c94c4c'); vx(g, -0.5, 1.2, -0.6, 1, 0.3, 1.2, '#e57b6f'); vx(g, 0.9, 0.3, -0.3, 1.1, 0.6, 0.6, '#f2eadb'); }
    return g;
  }
  function makeTree(big) {
    const g = new THREE.Group(), top = new THREE.Group(); g.add(top);
    vx(g, -1.1, 0, -1.1, 2.2, 1.4, 2.2, '#6b4a2b');
    vx(g, -0.9, 1.4, -0.9, 1.8, 0.1, 1.8, '#c9a066', false);
    vx(top, -1, 1.4, -1, 2, 4, 2, '#6b4a2b');
    if (!big) {
      vx(top, -3.5, 5, -3.5, 7, 3, 7, '#3f7d3a'); vx(top, -2.5, 8, -2.5, 5, 2, 5, '#4f9a45'); vx(top, -1.5, 10, -1.5, 3, 1.5, 3, '#62b04f');
      vx(top, 1.5, 6, 3.4, 1, 1, 0.3, '#e86a6a', false);
    } else {
      vx(top, -4, 5, -4, 8, 2.5, 8, '#2e5b3c'); vx(top, -3, 7.5, -3, 6, 2.5, 6, '#356b45');
      vx(top, -2, 10, -2, 4, 2.5, 4, '#3f7a4f'); vx(top, -1, 12.5, -1, 2, 2, 2, '#4a8a5a');
      g.scale.setScalar(1.25);
    }
    scene.add(g); return { g, top };
  }
  function makeBear() {
    const g = new THREE.Group(), b = new THREE.Group(); g.add(b);
    const C = '#6e4526';
    for (const [x, z] of [[-3, -4], [1, -4], [-3, 2], [1, 2]]) vx(b, x, 0, z, 2, 2.5, 2, '#5a371d');
    vx(b, -3.5, 2, -5, 7, 5, 9, C);
    vx(b, -2.5, 3.5, 4, 5, 4.5, 4, C);
    vx(b, -1.2, 4, 8, 2.4, 2, 1.6, '#c9a07a'); vx(b, -0.5, 5.4, 9.5, 1, 0.7, 0.3, '#1d1a16');
    vx(b, -1.8, 6.2, 8, 0.7, 0.7, 0.2, '#1d1a16'); vx(b, 1.1, 6.2, 8, 0.7, 0.7, 0.2, '#1d1a16');
    vx(b, -2.5, 8, 5, 1.5, 1.5, 1, C); vx(b, 1, 8, 5, 1.5, 1.5, 1, C);
    g.scale.setScalar(1.25);
    const bar = new THREE.Group();
    const bg = new THREE.Mesh(BOX, M('#1d1a16')); bg.scale.set(1.1, 0.12, 0.12); bar.add(bg);
    const fill = new THREE.Mesh(BOX, M('#d9573b')); fill.scale.set(1, 0.14, 0.14); bar.add(fill);
    bar.visible = false; scene.add(bar);
    g.userData = { body: b, bar, fill };
    scene.add(g); return g;
  }
  function makePad(color) {
    const g = new THREE.Group();
    vx(g, -4.5, 0, -4.5, 9, 0.3, 9, '#1d1a16', false);
    vx(g, -4, 0.05, -4, 8, 0.35, 8, color, false);
    const fill = vx(g, -4, 0.1, -4, 8, 0.35, 8, '#f2c14e', false);
    fill.visible = false;
    scene.add(g); return { g, fill };
  }
  function setPadFill(pad, p) {
    pad.fill.visible = p > 0.001;
    pad.fill.scale.x = 8 * V * p;
    pad.fill.position.x = (-4 + 8 * p / 2) * V;
  }

  // 판매대
  const stall = new THREE.Group();
  vx(stall, -7.5, 0, -3, 15, 4.5, 6, '#9a6a3c');
  vx(stall, -8, 4.5, -3.5, 16, 0.6, 7, '#c8925a');
  for (const [x, z] of [[-7.5, -3], [6.5, -3], [-7.5, 2], [6.5, 2]]) vx(stall, x, 5.1, z, 1, 7.5, 1, '#7a4b28');
  for (let i = 0; i < 8; i++) vx(stall, -8 + i * 2, 12.6, -4, 2, 0.8, 8, i % 2 ? '#f4efe2' : '#d0483a');
  stall.position.set(STALL.x, 0, STALL.z);
  scene.add(stall);
  const register = new THREE.Group();
  vx(register, -1.5, 0, -1.2, 3, 2, 2.4, '#3d4650'); vx(register, -1.2, 2, -0.6, 2.4, 1.2, 0.4, '#8fd06a');
  register.position.set(2.1, 1.02, 5.3); scene.add(register);
  const stockG = new THREE.Group(); scene.add(stockG);

  // 목표 화살표
  const arrow = new THREE.Group();
  vx(arrow, -0.5, 2, -0.5, 1, 2.5, 1, '#f2c14e'); vx(arrow, -1.5, 1, -0.5, 3, 1, 1, '#f2c14e'); vx(arrow, -0.5, 0, -0.5, 1, 1, 1, '#f2c14e');
  arrow.scale.setScalar(1.6); scene.add(arrow);

  // ================= 상태 =================
  const L = { axeCount: 0, axeDmg: 0, spin: 0, bag: 0, speed: 0, price: 0, worker: 0, cashier: 0, gate: 0 };
  const stats = { chopped: 0, deposited: 0, sales: 0, meat: 0 };
  let gold = 0, goal = 0, stock = [];
  const padPaid = {};
  const player = { x: 0, z: 1.5, face: 0, hp: 10, maxHp: 10, carry: [], reserved: 0, hurtT: 0, fullMsgT: 0, depT: 0 };

  function derived() {
    return {
      axes: 1 + L.axeCount, dmg: 1 + L.axeDmg,
      spin: 4.4 * (1 + 0.15 * L.spin), radius: 1.7 + 0.25 * L.spin,
      cap: 10 + 5 * L.bag, speed: 4.4 * (1 + 0.1 * L.speed),
      price: 1 + 0.2 * L.price, custEvery: 3.4 / (1 + 0.2 * L.price),
    };
  }

  // ================= 나무 =================
  const trees = [];
  function placeTrees(n, x0, x1, z0, z1, gap, big, avoid, seed) {
    const r = mulberry32(seed); let tries = 0;
    while (trees.filter(t => t.big === big).length < n && tries++ < 4000) {
      const x = x0 + r() * (x1 - x0), z = z0 + r() * (z1 - z0);
      if (avoid(x, z)) continue;
      if (trees.some(t => Math.hypot(t.x - x, t.z - z) < gap)) continue;
      const { g, top } = makeTree(big);
      g.position.set(x, 0, z); g.rotation.y = ((r() * 4) | 0) * Math.PI / 2;
      const hp = big ? 6 : 3;
      trees.push({ g, top, x, z, big, hp, maxHp: hp, alive: true, state: 'idle', t: 0, hitCd: [0, 0, 0, 0, 0, 0], shake: 0, dir: 1, claimed: null });
    }
  }
  placeTrees(58, -32, 32, -20.3, 17, 2.3, false, (x, z) => (Math.abs(x) < 13 && z > -5.5) || (Math.abs(x) < 3.5 && z < -15), 11);
  placeTrees(30, -32, 32, -43, -24.5, 3.3, true, (x, z) => Math.abs(x) < 3 && z > -28, 29);

  const drops = [], chips = [];

  function hitTree(tree, dmg) {

  function updateTrees(dt, t) {

      if (tr.state === 'fall') {

  // ================= 곰 =================
  const bears = [];

  }
  function hitBear(b, dmg) {
    b.hp -= dmg; b.bump = 0.15;

  function updateBears(dt, t) {
    for (const b of bears) {
      for (let i = 0; i < 6; i++) if (b.hitCd[i] > 0) b.hitCd[i] -= dt;
      if (!b.alive) {
        b.respawnT -= dt;
        if (b.respawnT <= 0) { [b.x, b.z] = randForest(); b.hp = b.maxHp; b.alive = true; b.g.visible = true; }
        continue;
      }
      const dx = player.x - b.x, dz = player.z - b.z, dist = Math.hypot(dx, dz);
      const chase = L.gate && player.z < FENCE_Z && dist < 7.5;

        if (dist > 1.3) { mx = dx / dist; mz = dz / dist; sp = 2.6; }

      } else {
        b.t += dt;

        else if (b.t > 1.5) { mx = tx / td; mz = tz / td; sp = 1.1; }
      }
      b.x += mx * sp * dt; b.z += mz * sp * dt;
      b.z = Math.min(b.z, FENCE_Z - 1); b.x = Math.max(-32, Math.min(32, b.x)); b.z = Math.max(-44, b.z);
      if (sp > 0) b.face = lerpAngle(b.face, Math.atan2(mx, mz), dt * 8);
      b.walk += sp * dt;
      if (b.bump > 0) b.bump -= dt;
      const u = b.g.userData;
      b.g.position.set(b.x, 0, b.z); b.g.rotation.y = b.face;
      u.body.position.y = sp > 0 ? Math.abs(Math.sin(b.walk * 4)) * 0.06 : 0;

  // ================= 플레이어 =================
  const pg = makePerson('#c8553d', '#3b4a6b', '#4a2f1b', null);
  const stackG = new THREE.Group(); stackG.position.set(0, 0.8, -0.62); pg.add(stackG);
  function rebuildStack(g, list, maxShow) {

  // ================= 발판 =================
  const PADS = [
    { k: 'axeCount', name: '도끼 추가', x: -9, z: -1.5, base: 40, mul: 2.2, max: 5 },
    { k: 'axeDmg', name: '도끼 강화', x: -6, z: -1.5, base: 30, mul: 1.75, max: 12 },

  for (const p of PADS) { p.pad = makePad('#d9c48e'); p.pad.g.position.set(p.x, 0, p.z); p.tag = mkTag(); p.html = ''; p.cool = 0; }
  const depPad = makePad('#f2c14e'); depPad.g.position.set(DEPOSIT.x, 0, DEPOSIT.z);

  const cost = p => Math.round(p.base * Math.pow(p.mul, L[p.k]));
  const onPad = (x, z, px, pz) => Math.abs(px - x) < 0.95 && Math.abs(pz - z) < 0.95;

  function applyUpgrade(k) {
    if (k === 'axeCount' || k === 'spin') syncAxes();

    if (k === 'cashier') addCashier();
    if (k === 'gate') openGate();
    if (k === 'bag') floatText('가방 +5', player.x, 2.4, player.z, 'note');
  }
  function updatePads(dt) {
    for (const p of PADS) {
      const maxed = L[p.k] >= p.max;
      const hide = p.once && maxed;
      p.pad.g.visible = !hide; p.tag.hidden = hide;
      if (hide) continue;
      const c = cost(p);
      let paid = padPaid[p.k] || 0;
      if (p.cool > 0) p.cool -= dt;
      if (!maxed && p.cool <= 0 && onPad(p.x, p.z, player.x, player.z) && gold > 0) {
        p.acc = (p.acc || 0) + Math.max(c * 1.1, 40) * dt;   // 약 1초에 채워짐
        const step = Math.min(gold, Math.floor(p.acc), c - paid);
        p.acc -= Math.floor(p.acc);
        gold -= step; paid += step;
        if (paid >= c) {
          paid = 0; L[p.k]++; p.cool = 0.5;
          applyUpgrade(p.k);
          spawnChips(p.x, 0.5, p.z, '#f2c14e', 10);
          if (!p.once) floatText(p.name + ' Lv.' + (L[p.k] + 1), p.x, 1.4, p.z, 'note');
        }

      }
      setPadFill(p.pad, maxed ? 0 : paid / c);
      const html = maxed
        ? `${p.name}<div class="c">MAX</div>`
        : `${p.name}${p.once ? '' : ' <small>Lv.' + (L[p.k] + 1) + '</small>'}<div class="c"><i class="coin"></i>${c - paid}</div>`;
      if (html !== p.html) { p.tag.innerHTML = html; p.html = html; }
      p.tag.classList.toggle('max', maxed);
      p.tag.classList.toggle('poor', !maxed && gold + paid < c);
    }
  }

  // ================= 문 =================
  function openGate() { fenceGate.visible = false; toast('곰 숲이 열렸습니다! 곰을 조심하세요'); }

  // ================= 손님 =================
  const custs = [];
  let custTimer = 1.5;
  const SHIRTS = ['#3f7cc0', '#d98c3a', '#8a5bb0', '#e0e0d6', '#3aa08a', '#c2476e'];
  const HAIRS = ['#2b1d12', '#6b4424', '#1d1a16', '#b9853e'];
  function spawnCustomer() {
    const p = makePerson(SHIRTS[(Math.random() * SHIRTS.length) | 0], '#44464f', HAIRS[(Math.random() * HAIRS.length) | 0], Math.random() < 0.3 ? '#d9c68f' : null);
    const c = { p, x: rand(-1.5, 1.5), z: 24, face: Math.PI, state: 'walk', want: 2 + ((Math.random() * 4) | 0), wait: 0, serveT: 0, qi: 0, tx: 0, tz: 0 };
    p.position.set(c.x, 0, c.z);
    custs.push(c);
  }
  function updateCustomers(dt, t, D) {
    custTimer -= dt;
    const inLine = custs.filter(c => c.state !== 'leave').length;
    if (custTimer <= 0) { custTimer = D.custEvery; if (inLine < 6) spawnCustomer(); }
    let qi = 0;
    const manned = L.cashier > 0 || onPad(CHECKOUT.x, CHECKOUT.z, player.x, player.z);
    for (const c of custs) {
      if (c.state !== 'leave') { c.qi = qi++; c.tx = 0; c.tz = 7.6 + c.qi * 1.15; }
      const dx = c.tx - c.x, dz = c.tz - c.z, d = Math.hypot(dx, dz);
      let moving = false;
      if (d > 0.05) {
        const sp = Math.min(d, 2.8 * dt);
        c.x += dx / d * sp; c.z += dz / d * sp; moving = true;
        c.face = lerpAngle(c.face, Math.atan2(dx, dz), dt * 10);
      } else if (c.state !== 'leave') { c.state = 'wait'; c.face = lerpAngle(c.face, Math.PI, dt * 10); }
      if (c.state === 'wait') {
        c.wait += dt;
        if (c.qi === 0 && manned && stock.length > 0) {
          c.serveT += dt;
          if (c.serveT > 0.45) {
            const n = Math.min(c.want, stock.length);
            const items = stock.splice(stock.length - n, n);
            const pay = Math.round(items.reduce((s, it) => s + PRICE[it], 0) * D.price);
            gold += pay; stats.sales++; stockDirty = true;
            floatText('+' + pay, CHECKOUT.x, 1.8, CHECKOUT.z);
            spawnChips(CHECKOUT.x, 1.2, CHECKOUT.z, '#f2c14e', 5);
            vx(c.p.userData.body, -1.5, 3, 1.6, 3, 3, 2, '#d9b27c');
            leave(c);
          }
        } else if (c.wait > 35) { floatText('...', c.x, 2.3, c.z, 'note'); leave(c); }
      }
      if (c.state === 'leave' && d < 0.3) c.gone = true;
      c.p.position.set(c.x, 0, c.z); c.p.rotation.y = c.face;
      animPerson(c.p, moving, t + c.want);
    }
    for (let i = custs.length - 1; i >= 0; i--) if (custs[i].gone) { scene.remove(custs[i].p); custs.splice(i, 1); }
  }
  function leave(c) { c.state = 'leave'; c.tx = Math.random() < 0.5 ? -1.2 : 1.2; c.tz = 26; }

  // ================= 계산원 / 일꾼 =================
  let cashier = null;
  function addCashier() {
    if (cashier) return;
    cashier = makePerson('#2f6f8f', '#2b2f36', '#2b1d12', null);
    vx(cashier.userData.body, -2.6, 3, 1.5, 5.2, 4, 0.3, '#f4efe2');
    cashier.position.set(CHECKOUT.x + 0.4, 0, CHECKOUT.z + 0.2);

  }
  const workers = [];
  function addWorker(x, z) {
    const p = makePerson('#4c7a3a', '#3b3b46', '#3a2716', '#e0b33a');
    const axe = new THREE.Group();
    vx(axe, -0.5, -1, -0.5, 1, 4, 1, '#7a4b28'); vx(axe, 0.5, 1.5, -0.5, 1.8, 1.6, 1, '#b9c2c9');
    axe.position.set(0.7, 0.9, 0.3); p.userData.body.add(axe);
    const sg = new THREE.Group(); sg.position.set(0, 0.8, -0.62); p.add(sg);
    const w = { p, axe, sg, x, z, face: 0, state: 'seek', carry: 0, cap: 6, tree: null, chopT: 0, shown: -1 };
    p.position.set(x, 0, z);
    workers.push(w);
  }
  function updateWorkers(dt, t) {
    for (const w of workers) {
      let tx = w.x, tz = w.z;
      if (w.state === 'seek') {
        if (w.carry >= w.cap) w.state = 'return';
        else {
          let best = null, bd = 1e9;
          for (const tr of trees) {
            if (!tr.alive || tr.big || tr.claimed) continue;
            const d = Math.hypot(tr.x - w.x, tr.z - w.z);
            if (d < bd) { bd = d; best = tr; }
          }
          if (best) { best.claimed = w; w.tree = best; w.state = 'go'; }
          else if (w.carry > 0) w.state = 'return';
        }
      }
      if (w.state === 'go') {
        if (!w.tree.alive) { w.tree.claimed = null; w.tree = null; w.state = 'seek'; }
        else {
          const d = Math.hypot(w.tree.x - w.x, w.tree.z - w.z);
          if (d < 1.2) { w.state = 'chop'; w.chopT = 0; }
          else { tx = w.tree.x; tz = w.tree.z; }
        }
      }
      if (w.state === 'chop') {
        w.chopT += dt;
        w.face = lerpAngle(w.face, Math.atan2(w.tree.x - w.x, w.tree.z - w.z), dt * 10);
        w.axe.rotation.x = -Math.abs(Math.sin(w.chopT * Math.PI / 0.8)) * 1.6;
        if (w.chopT >= 0.8) {
          w.chopT = 0;
          if (!w.tree.alive) { w.tree.claimed = null; w.state = 'seek'; }
          else {
            const got = hitTree(w.tree, 1 + Math.floor(L.axeDmg / 3));
            if (got) { w.carry = Math.min(w.cap, w.carry + got); w.tree.claimed = null; w.tree = null; w.state = 'seek'; }
          }
        }
      } else w.axe.rotation.x = 0;
      if (w.state === 'return') {
        const d = Math.hypot(DEPOSIT.x - 1 - w.x, DEPOSIT.z - w.z);
        if (d < 0.5) {
          for (let i = 0; i < w.carry; i++) stock.push('w');
          stats.deposited += w.carry; w.carry = 0; stockDirty = true; w.state = 'seek';
        } else { tx = DEPOSIT.x - 1; tz = DEPOSIT.z; }
      }
      const dx = tx - w.x, dz = tz - w.z, d = Math.hypot(dx, dz);
      const moving = d > 0.05;
      if (moving) {
        const sp = Math.min(d, 3 * dt);
        w.x += dx / d * sp; w.z += dz / d * sp;
        w.face = lerpAngle(w.face, Math.atan2(dx, dz), dt * 10);
      }
      w.p.position.set(w.x, 0, w.z); w.p.rotation.y = w.face;
      animPerson(w.p, moving, t + w.cap * workers.indexOf(w));
      if (w.shown !== w.carry) { w.shown = w.carry; rebuildStack(w.sg, Array(w.carry).fill('w'), 12); }
    }
  }

  // ================= 재고 표시 =================

      m.position.set(STALL.x - 1.1 + col * 0.55, 1.02 + layer * 0.25, STALL.z - 0.3 + row * 0.5);

  // ================= 떠오르는 글자 / 알림 =================

  }

  // ================= 목표 =================
  function nearest(list, ok) {
    let b = null, bd = 1e9;
    for (const o of list) if (ok(o)) { const d = Math.hypot(o.x - player.x, o.z - player.z); if (d < bd) { bd = d; b = o; } }

  const padOf = k => PADS.find(p => p.k === k);
  const GOALS = [
    { txt: '나무 옆으로 가면 도는 도끼가 나무를 벱니다', done: () => stats.chopped >= 3, target: () => nearest(trees, t => t.alive && !t.big) },
    { txt: '노란 판매대 발판에 올라가 나무를 내려놓으세요', done: () => stats.deposited > 0, target: () => DEPOSIT },
    { txt: '초록 계산대 발판에 서서 손님에게 파세요', done: () => stats.sales >= 2, target: () => CHECKOUT },
    { txt: '돈을 모아 도끼 추가 발판에 서 보세요', done: () => L.axeCount >= 1, target: () => padOf('axeCount') },
    { txt: '계산원을 고용하면 자리를 비워도 팔립니다', done: () => L.cashier >= 1, target: () => padOf('cashier') },
    { txt: '일꾼을 고용해 벌목을 맡기세요', done: () => L.worker >= 1, target: () => padOf('worker') },
    { txt: '곰 숲을 여세요. 곰 고기는 한 개 8G', done: () => L.gate >= 1, target: () => padOf('gate') },
    { txt: '곰을 사냥해 고기 5개를 모으세요', done: () => stats.meat >= 5, target: () => nearest(bears, b => b.alive) },
    { txt: '모든 강화를 MAX로 만들어 보세요', done: () => PADS.every(p => L[p.k] >= p.max), target: () => null },
    { txt: '숲의 주인이 되었습니다!', done: () => false, target: () => null },
  ];
  let goalShown = -1;
  function updateGoal(t) {
    if (goal < GOALS.length - 1 && GOALS[goal].done()) {
      goal++;
      toast(goal === GOALS.length - 1 ? '클리어! 숲의 주인이 되었습니다' : '목표 달성!');
    }
    if (goalShown !== goal) { goalShown = goal; $('goalNo').textContent = 'GOAL ' + (goal + 1) + '/' + GOALS.length; $('goalTxt').textContent = GOALS[goal].txt; }
    const tg = GOALS[goal].target();
    arrow.visible = !!tg;
    if (tg) { arrow.position.set(tg.x, 2.6 + Math.sin(t * 5) * 0.25 + ((tg.g && tg.big !== undefined) ? 1.6 : 0), tg.z); arrow.rotation.y = t * 2; }
  }

  // ================= 입력 =================
  const keys = {};
  addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault(); });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; joy = null; $('joy').hidden = true; });
  let joy = null;
  const joyEl = $('joy'), knob = joyEl.firstElementChild;
  const gameEl = $('game');
  gameEl.addEventListener('pointerdown', e => {
    joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };
    joyEl.style.left = e.clientX + 'px'; joyEl.style.top = e.clientY + 'px'; joyEl.hidden = false;
    knob.style.transform = '';
    try { gameEl.setPointerCapture(e.pointerId); } catch (err) {}
  });
  gameEl.addEventListener('pointermove', e => {
    if (!joy || e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
    const d = Math.hypot(dx, dy), R = 48;
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    joy.dx = dx / R; joy.dy = dy / R;
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
  });
  const endJoy = e => { if (joy && e.pointerId === joy.id) { joy = null; joyEl.hidden = true; } };
  gameEl.addEventListener('pointerup', endJoy);
  gameEl.addEventListener('pointercancel', endJoy);

  function lerpAngle(a, b, k) { const d = Math.atan2(Math.sin(b - a), Math.cos(b - a)); return a + d * Math.min(1, k); }

  // ================= 저장 =================
  const SAVE_KEY = 'axeForestSave1';
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ gold, L, stock, carry: player.carry, goal, stats, padPaid })); } catch (e) {}
  }
  function load() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) {}
    if (!s) return;
    gold = s.gold | 0; goal = s.goal | 0;
    Object.assign(L, s.L || {}); Object.assign(stats, s.stats || {}); Object.assign(padPaid, s.padPaid || {});
    stock = Array.isArray(s.stock) ? s.stock : [];
    player.carry = Array.isArray(s.carry) ? s.carry : [];
    for (let i = 0; i < L.worker; i++) addWorker(-6 + i * 0.6, 4.5);
    if (L.cashier) addCashier();
    if (L.gate) fenceGate.visible = false;
  }
  addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  let resetArm = 0;
  $('btnReset').addEventListener('click', () => {
    const b = $('btnReset');
    if (resetArm > 0) {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      addEventListener('pagehide', () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} });
      location.reload();
      return;
    }
    resetArm = 3; b.textContent = '한 번 더 누르면 초기화'; b.classList.add('warn');
  });

  // ================= 메인 루프 =================
  load();
  if (location.hash === '#debug') window.__dbg = { player, stats, L, stock, trees, bears, custs, workers, get gold() { return gold; }, set gold(v) { gold = v; } };
  syncAxes();
  rebuildStack(stackG, player.carry, 60);
  let shownCarry = player.carry.length;
  let spinA = 0, clock = 0, last = performance.now(), saveT = 0, walkT = 0;
  const camGoal = new THREE.Vector3();
  const camPos = new THREE.Vector3(player.x, 21, player.z + 15);

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
    const D = derived();

    // 이동
    let mx = 0, mz = 0;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    if (keys['w'] || keys['arrowup']) mz -= 1;
    if (keys['s'] || keys['arrowdown']) mz += 1;
    if (joy && Math.hypot(joy.dx, joy.dy) > 0.15) { mx = joy.dx; mz = joy.dy; }
    const ml = Math.hypot(mx, mz);
    const moving = ml > 0.01;
    if (moving) {
      if (ml > 1) { mx /= ml; mz /= ml; }
      const nx = player.x + mx * D.speed * dt, nz = player.z + mz * D.speed * dt;
      const crossing = (player.z >= FENCE_Z) !== (nz >= FENCE_Z);
      if (crossing && (!L.gate || Math.abs(nx) > GATE_HALF - 0.3)) player.x = nx;
      else { player.x = nx; player.z = nz; }
      player.face = lerpAngle(player.face, Math.atan2(mx, mz), dt * 14);
      walkT += dt;
    }
    player.x = Math.max(-33, Math.min(33, player.x));
    player.z = Math.max(-44, Math.min(18, player.z));
    // 판매대 충돌
    if (Math.abs(player.x - STALL.x) < 1.9 && Math.abs(player.z - STALL.z) < 0.95) {
      const ox = 1.9 - Math.abs(player.x - STALL.x), oz = 0.95 - Math.abs(player.z - STALL.z);
      if (ox < oz) player.x += Math.sign(player.x - STALL.x || 1) * ox; else player.z += Math.sign(player.z - STALL.z || 1) * oz;
    }
    if (player.z > FENCE_Z) player.hp = Math.min(player.maxHp, player.hp + dt * 1.5);
    pg.position.set(player.x, 0, player.z); pg.rotation.y = player.face;
    animPerson(pg, moving, walkT);

    // 도끼 회전 + 타격
    spinA += D.spin * dt;
    axes.forEach((ax, i) => {
      const a = spinA + i * Math.PI * 2 / axes.length;
      const x = player.x + Math.cos(a) * D.radius, z = player.z + Math.sin(a) * D.radius;
      ax.position.set(x, 0.85, z); ax.rotation.set(0, -a, 0.25);
      for (const tr of trees) {
        if (!tr.alive || tr.hitCd[i] > 0 || Math.abs(tr.x - x) > 1.2 || Math.abs(tr.z - z) > 1.2) continue;
        if (Math.hypot(tr.x - x, tr.z - z) < (tr.big ? 1.1 : 0.85)) {
          tr.hitCd[i] = 0.25;
          const got = hitTree(tr, D.dmg);
          if (got) { stats.chopped++; for (let k = 0; k < got; k++) spawnDrop('w', tr.x, tr.z); }
        }
      }
      for (const b of bears) {
        if (!b.alive || b.hitCd[i] > 0) continue;
        if (Math.hypot(b.x - x, b.z - z) < 1.2) { b.hitCd[i] = 0.3; hitBear(b, D.dmg); }
      }
    });

    updateTrees(dt, clock);
    updateBears(dt, clock);

    // 아이템 줍기
    const cap = D.cap;
    for (let i = drops.length - 1; i >= 0; i--) {
      const o = drops[i]; o.t += dt;
      if (o.state === 'pop' || o.state === 'ground') {
        if (o.state === 'pop') {
          o.vy -= 18 * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.z += o.vz * dt;
          if (o.y <= 0.02) { o.y = 0.02; o.state = 'ground'; }
        }
        if (o.t > 0.35 && Math.hypot(o.x - player.x, o.z - player.z) < 2.6) {
          if (player.carry.length + player.reserved < cap) { o.state = 'fly'; player.reserved++; }
          else if (player.fullMsgT <= 0) { floatText('가방 가득!', player.x, 2.6, player.z, 'bad'); player.fullMsgT = 2.5; }
        }
        if (o.state === 'ground' && o.t > 45) { scene.remove(o.m); drops.splice(i, 1); continue; }
      }
      if (o.state === 'fly') {
        const tx = player.x, ty = 1.2 + player.carry.length * 0.25, tz = player.z;
        const k = Math.min(1, dt * 14);
        o.x += (tx - o.x) * k; o.y += (ty - o.y) * k; o.z += (tz - o.z) * k;
        if (Math.hypot(tx - o.x, tz - o.z) < 0.35) {
          player.carry.push(o.type); player.reserved--;
          if (o.type === 'm') stats.meat++;
          scene.remove(o.m); drops.splice(i, 1); continue;
        }
      }
      o.m.position.set(o.x, o.y, o.z); o.m.rotation.y += dt * 3;
    }
    if (player.fullMsgT > 0) player.fullMsgT -= dt;

    // 판매대에 내려놓기
    if (onPad(DEPOSIT.x, DEPOSIT.z, player.x, player.z) && player.carry.length) {
      player.depT -= dt;
      if (player.depT <= 0) { stock.push(player.carry.pop()); stats.deposited++; stockDirty = true; player.depT = 0.06; }
    }
    if (shownCarry !== player.carry.length) { shownCarry = player.carry.length; rebuildStack(stackG, player.carry, 60); }
    if (stockDirty) rebuildStock();

    updatePads(dt);
    updateCustomers(dt, clock, D);
    updateWorkers(dt, clock);
    if (cashier) animPerson(cashier, false, clock);

    // 파편
    for (let i = chips.length - 1; i >= 0; i--) {
      const c = chips[i]; c.t += dt; c.vy -= 16 * dt;
      c.x += c.vx * dt; c.y += c.vy * dt; c.z += c.vz * dt;
      if (c.y < 0.05) { c.y = 0.05; c.vx *= 0.6; c.vz *= 0.6; }
      c.m.position.set(c.x, c.y, c.z);
      if (c.t > 0.7) { scene.remove(c.m); chips.splice(i, 1); }
    }

    // 카메라 / 조명
    camPos.lerp(camGoal.set(player.x, 21, player.z + 15), Math.min(1, dt * 6));
    camera.position.copy(camPos);
    camera.lookAt(camPos.x, 0, camPos.z - 16);
    sun.position.set(player.x + 9, 22, player.z + 7);
    sun.target.position.set(player.x, 0, player.z); sun.target.updateMatrixWorld();

    updateGoal(clock);
    renderer.render(scene, camera);

    // HTML 라벨
    for (const p of PADS) if (!p.tag.hidden) project(p.x, 0, p.z + 1.0, p.tag);
    depTag.innerHTML = '판매대<div class="c">내려놓기</div>'; project(DEPOSIT.x - 2.1, 0, DEPOSIT.z, depTag, -14);
    chkTag.hidden = !!cashier;
    if (!cashier) { chkTag.innerHTML = '계산대'; project(CHECKOUT.x, 0, CHECKOUT.z + 1.0, chkTag); }
    stockTag.textContent = '재고 ' + stock.length + ' · 손님 ' + custs.filter(c => c.state !== 'leave').length;
    project(STALL.x, 3.1, STALL.z, stockTag, -26);
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i]; f.t += dt;
      project(f.x, f.y + f.t * 1.2, f.z, f.d, -12);
      f.d.style.opacity = Math.max(0, 1 - f.t / 1.1);
      if (f.t > 1.1) { f.d.remove(); floats.splice(i, 1); }
    }

    // HUD
    $('hGold').textContent = gold;
    $('hBag').textContent = player.carry.length + '/' + cap;
    $('hBagBar').style.width = Math.min(100, player.carry.length / cap * 100) + '%';
    const showHp = player.hp < player.maxHp || player.z < FENCE_Z;
    $('hHpRow').hidden = $('hHpBarWrap').hidden = !showHp;
    if (showHp) { $('hHp').textContent = Math.ceil(player.hp); $('hHpBar').style.width = player.hp / player.maxHp * 100 + '%'; }
    if (player.hurtT > 0) player.hurtT -= dt;
    $('hurt').style.opacity = Math.max(0, player.hurtT / 0.35);
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
    if (resetArm > 0) { resetArm -= dt; if (resetArm <= 0) { $('btnReset').textContent = '처음부터'; $('btnReset').classList.remove('warn'); } }
    if (clock > 6) $('hint').hidden = true;

    saveT += dt; if (saveT > 3) { saveT = 0; save(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body></html>
