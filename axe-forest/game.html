<title>빙글도끼 숲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Silkscreen&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #20352f;
    --ink: #f6ecd2;
    --muted: #c9b99a;
    --panel: #2a2119;
    --edge: #110d09;
    --gold: #f2c14e;
    --danger: #d9573b;
    --leaf: #8fd06a;
    --gem: #b48cff;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Silkscreen", "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; }
  #game canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

  .box { background: var(--panel); border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); border-radius: 4px; }
  .hud {
    position: fixed; left: 16px; right: 16px; top: calc(10px + env(safe-area-inset-top, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none;
  }
  .left { display: flex; flex-direction: column; gap: 6px; }
  .gold { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 8px; font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; transition: transform .12s; }
  .gold.bump { transform: scale(1.15); }
  .coin { display: inline-block; width: 14px; height: 14px; background: var(--gold); box-shadow: inset -3px -3px 0 #b8862a, inset 2px 2px 0 #fff0b0; flex: none; }
  .bag { padding: 5px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; min-width: 136px; }
  .bag .row { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
  .bag .rank { font-family: "Do Hyeon", sans-serif; font-size: 14px; color: var(--gold); }
  .bar { height: 6px; background: var(--edge); }
  .bar > i { display: block; height: 100%; width: 0; background: var(--leaf); }
  .bar.hp > i { background: var(--danger); }
  .goal { font-family: "Do Hyeon", sans-serif; font-size: 17px; padding: 6px 12px; max-width: min(40vw, 420px); text-align: center; line-height: 1.3; }
  .goal small { display: block; font-family: "Silkscreen", "Do Hyeon", sans-serif; font-size: 10px; color: var(--muted); letter-spacing: .08em; }
  .right { pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .btn { font: inherit; font-family: "Do Hyeon", sans-serif; font-size: 15px; color: var(--ink); padding: 5px 10px; cursor: pointer; }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn.warn { background: var(--danger); }
  .status { font-family: "Do Hyeon", sans-serif; font-size: 12px; color: var(--muted); text-shadow: 0 1px 0 var(--edge); }
  .zoom { position: fixed; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; }
  .zoom .btn { width: 40px; height: 40px; padding: 0; font-family: "Silkscreen", sans-serif; font-size: 20px; }

  .hint {
    position: fixed; left: 16px; right: 72px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    text-align: center; font-family: "Do Hyeon", sans-serif; font-size: 15px; color: var(--ink);
    text-shadow: 0 2px 0 var(--edge); pointer-events: none; opacity: .9;
  }

  #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag {
    position: absolute; left: 0; top: 0;
    font-family: "Do Hyeon", sans-serif; font-size: 12px; line-height: 1.15; text-align: center; white-space: nowrap;
    padding: 1px 5px; background: rgba(42,33,25,.88); border: 2px solid var(--edge); border-radius: 3px;
  }
  .tag small { font-size: 11px; color: var(--muted); }
  .tag .c { font-family: "Silkscreen", sans-serif; font-size: 11px; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 4px; }
  .tag .c .coin { width: 8px; height: 8px; box-shadow: inset -2px -2px 0 #b8862a; }
  .tag.max .c { color: var(--leaf); }
  .tag.poor .c { color: var(--muted); }
  .tag.info { background: rgba(17,13,9,.72); }
  .float {
    position: absolute; left: 0; top: 0;
    font-family: "Silkscreen", "Do Hyeon", sans-serif; font-size: 15px; color: var(--gold);
    text-shadow: 0 2px 0 var(--edge), 2px 0 0 var(--edge), -2px 0 0 var(--edge), 0 -2px 0 var(--edge); white-space: nowrap;
  }
  .float.bad { color: #ff9b85; }
  .float.note { color: var(--ink); font-family: "Do Hyeon", sans-serif; font-size: 17px; }
  .float.big { font-size: 22px; }

  #joy { position: fixed; width: 96px; height: 96px; margin: -48px 0 0 -48px; border: 3px solid rgba(246,236,210,.45); border-radius: 50%; pointer-events: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; background: rgba(246,236,210,.55); border-radius: 50%; }
  #hurt { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px 30px rgba(217,87,59,.7); opacity: 0; }
  .buy {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(66px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 14px; padding: 8px 10px 8px 14px; font-family: "Do Hyeon", sans-serif;
    width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box;
  }
  .buy .bt { display: flex; gap: 8px; align-items: baseline; font-size: 17px; }
  .buy .bt span { font-size: 13px; color: var(--muted); }
  .buy .bd { font-size: 13px; color: var(--muted); }
  .buy .bc { display: flex; align-items: center; gap: 5px; font-family: "Silkscreen", sans-serif; font-size: 14px; color: var(--gold); }
  .buy .bc small { font-family: "Do Hyeon", sans-serif; color: #ff9b85; font-size: 13px; }
  .btn.primary { background: var(--gold); color: #1d1a16; font-size: 18px; padding: 8px 18px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .backup { position: fixed; inset: 0; background: rgba(17,13,9,.6); display: flex; align-items: center; justify-content: center; padding-inline: 16px; }
  .backup .panel { width: 100%; max-width: 440px; padding: 16px; display: flex; flex-direction: column; gap: 8px; font-family: "Do Hyeon", sans-serif; box-sizing: border-box; }
  .backup h2 { margin: 0; font-weight: 400; font-size: 22px; color: var(--gold); }
  .backup p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.4; }
  .backup label { font-size: 14px; margin-top: 4px; }
  .backup textarea { width: 100%; box-sizing: border-box; font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; background: #17120d; color: var(--ink); border: 2px solid var(--edge); border-radius: 3px; padding: 6px; resize: vertical; user-select: text; -webkit-user-select: text; }
  .backup .row { display: flex; gap: 8px; justify-content: flex-end; }
  .backup .msg { color: var(--ink); min-height: 1.4em; }
  #toast {
    position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%);
    font-family: "Do Hyeon", sans-serif; font-size: 24px; color: var(--gold); padding: 8px 18px; text-align: center; pointer-events: none;
    max-width: calc(100vw - 32px); box-sizing: border-box;
  }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Do Hyeon", sans-serif; font-size: 20px; padding-inline: 16px; text-align: center; }
  @media (max-width: 600px) {
    .goal { font-size: 13px; max-width: 38vw; padding: 5px 8px; }
    .gold { font-size: 17px; }
    .bag { min-width: 104px; font-size: 11px; }
    .btn { font-size: 13px; padding: 4px 7px; }
  }
</style>

<div id="game"></div>
<div id="tags"></div>
<div id="hurt"></div>

<div class="hud">
  <div class="left">
    <div class="box gold" id="goldBox"><i class="coin"></i><span id="hGold">0</span></div>
    <div class="box bag">
      <div class="rank" id="hRank">견습 나무꾼</div>
      <div class="row"><span>BAG</span><span id="hBag">0/10</span></div>
      <div class="bar"><i id="hBagBar"></i></div>
      <div class="row"><span>HP</span><span id="hHp">10/10</span></div>
      <div class="bar hp"><i id="hHpBar"></i></div>
    </div>
  </div>
  <div class="box goal" id="goal"><small id="goalNo">GOAL 1</small><span id="goalTxt"></span></div>
  <div class="right">
    <div class="btns">
      <button class="box btn" id="btnSound">소리 켬</button>
      <button class="box btn" id="btnSave">저장</button>
      <button class="box btn" id="btnBackup">백업</button>
      <button class="box btn" id="btnReset">처음부터</button>
    </div>
    <div class="status" id="saveStatus">자동 저장 · 이 기기</div>
  </div>
</div>

<div class="zoom">
  <button class="box btn" id="zoomIn" aria-label="가까이">+</button>
  <button class="box btn" id="zoomOut" aria-label="멀리">-</button>
</div>
<div class="box buy" id="buyPanel" hidden><div id="buyInfo"></div><button class="box btn primary" id="btnBuy">구매</button></div>
<div class="hint" id="hint">드래그·WASD로 이동 · 발판에 올라가 구매 버튼(E) · 휠이나 +/- 로 시야 조절</div>
<div id="joy" hidden><i></i></div>
<div class="box" id="toast" hidden></div>
<div class="backup" id="backup" hidden>
  <div class="box panel">
    <h2>진행 백업</h2>
    <p>아래 코드를 복사해 두면 기기를 바꾸거나 저장이 지워져도 그대로 이어서 할 수 있습니다.</p>
    <label for="codeOut">내 백업 코드</label>
    <textarea id="codeOut" readonly rows="3"></textarea>
    <div class="row"><button class="box btn primary" id="btnCopy">코드 복사</button></div>
    <label for="codeIn">백업 코드로 불러오기</label>
    <textarea id="codeIn" rows="3" placeholder="AXF1. 로 시작하는 코드를 붙여 넣으세요"></textarea>
    <div class="row"><button class="box btn" id="btnImport">불러오기</button><button class="box btn" id="btnCloseBackup">닫기</button></div>
    <p class="msg" id="codeMsg" aria-live="polite"></p>
  </div>
</div>
<div id="loading">숲을 불러오는 중…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  if (!window.THREE) { document.getElementById('loading').textContent = '3D 엔진을 불러오지 못했습니다. 새로고침해 주세요.'; return; }
  document.getElementById('loading').hidden = true;

  // ================= 상수 =================
  const V = 0.2;                                  // 복셀 한 칸(월드 단위)
  const BEAR_Z = -22, DINO_Z = -47, QX = 36, QZ = 4, GAP = 2.2; // 곰 숲·공룡 계곡 울타리(z), 채석장 울타리(x)와 문 위치
  const PRICE = { w: 2, m: 8, s: 3, g: 15, d: 40 };
  const NAMES = { w: '나무', m: '고기', s: '돌', g: '보석', d: '공룡 고기' };
  const STALL = { x: 0, z: 6 };
  const DEPOSIT = { x: 0, z: 4.1 };
  const CASH = { x: 0, z: 2.0 };
  const CHECK = [{ x: 2.9, z: 3.9 }, { x: -2.9, z: 3.9 }];
  const LANE_X = [0.6, -0.6];
  const RANKS = ['견습 나무꾼', '숙련 나무꾼', '철갑 벌목꾼', '숲의 기사', '황금 영웅', '전설의 도끼왕'];
  const TIER_AT = [0, 5, 11, 18, 26, 36];

  const $ = id => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function lerpAngle(a, b, k) { const d = Math.atan2(Math.sin(b - a), Math.cos(b - a)); return a + d * Math.min(1, k); }

  // ================= 효과음 (WebAudio 합성) =================
  const SFX = (() => {
    let ctx = null, master = null, noise = null, muted = false;
    const last = {};
    function init() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
        noise = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
        const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ctx = null; }
    }
    function tone(f, dur, type, vol, slide, delay) {
      const t = ctx.currentTime + (delay || 0);
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
      g.gain.setValueAtTime(vol || 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
    }
    function nz(dur, vol, freq, q, delay) {
      const t = ctx.currentTime + (delay || 0);
      const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noise; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.2, dur + 0.02);
    }
    function play(name, gap, fn) {
      if (!ctx || muted) return;
      const now = ctx.currentTime;
      if (last[name] && now - last[name] < gap) return;
      last[name] = now; try { fn(); } catch (e) {}
    }
    return {
      init, toggle() { muted = !muted; return muted; }, get muted() { return muted; },
      chop: () => play('chop', 0.05, () => { nz(0.07, 0.35, 1600, 1.4); tone(150, 0.07, 'triangle', 0.14, 0.5); }),
      fell: () => play('fell', 0.1, () => { nz(0.35, 0.3, 380, 0.8); tone(95, 0.3, 'triangle', 0.18, 0.5); }),
      clink: () => play('clink', 0.05, () => { tone(2100 + Math.random() * 300, 0.05, 'square', 0.03); nz(0.05, 0.25, 4200, 3); }),
      crack: () => play('crack', 0.1, () => { nz(0.25, 0.35, 900, 0.9); tone(180, 0.2, 'square', 0.06, 0.4); }),
      pick: () => play('pick', 0.035, () => tone(640 + Math.random() * 120, 0.05, 'square', 0.035, 1.6)),
      drop: () => play('drop', 0.05, () => tone(320, 0.05, 'triangle', 0.08, 0.7)),
      sell: () => play('sell', 0.08, () => { tone(1568, 0.05, 'square', 0.035); tone(2093, 0.16, 'square', 0.035, 1, 0.06); nz(0.04, 0.12, 3200, 2); }),
      cash: () => play('cash', 0.25, () => { for (let i = 0; i < 6; i++) tone(1200 + i * 160, 0.07, 'square', 0.03, 1, i * 0.045); }),
      pay: () => play('pay', 0.07, () => tone(880, 0.04, 'square', 0.025, 1.2)),
      buy: () => play('buy', 0.2, () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.12, 'square', 0.045, 1, i * 0.07)); }),
      level: () => play('level', 0.5, () => { [392, 523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.16, 'square', 0.05, 1, i * 0.08)); }),
      bear: () => play('bear', 0.06, () => { nz(0.09, 0.3, 300, 1); tone(120, 0.1, 'sawtooth', 0.06, 0.6); }),
      roar: () => play('roar', 0.9, () => { tone(95, 0.45, 'sawtooth', 0.09, 0.6); nz(0.4, 0.15, 260, 0.7); }),
      bump: () => play('bump', 0.3, () => { tone(160, 0.18, 'sawtooth', 0.08, 0.4); nz(0.12, 0.25, 500, 1); }),
      step: () => play('step', 0.2, () => nz(0.03, 0.05, 700, 1.5)),
      shoot: () => play('shoot', 0.08, () => { tone(520, 0.08, 'triangle', 0.08, 2.2); nz(0.05, 0.12, 2500, 2); }),
      whoosh: () => play('whoosh', 0.3, () => { nz(0.3, 0.35, 900, 0.6); tone(300, 0.25, 'sawtooth', 0.04, 2.5); }),
      trex: () => play('trex', 1.2, () => { tone(70, 0.9, 'sawtooth', 0.14, 0.55); tone(105, 0.7, 'square', 0.05, 0.6, 0.05); nz(0.8, 0.25, 180, 0.6); }),
      stomp: () => play('stomp', 0.35, () => { tone(55, 0.2, 'sine', 0.2, 0.6); nz(0.12, 0.15, 120, 0.8); }),
      hurt: () => play('hurt', 0.2, () => { tone(260, 0.16, 'sawtooth', 0.07, 0.45); }),
      die: () => play('die', 1, () => { [440, 370, 311, 247, 196].forEach((f, i) => tone(f, 0.22, 'square', 0.05, 0.9, i * 0.13)); }),
    };
  })();
  const unlockAudio = () => SFX.init();
  addEventListener('pointerdown', unlockAudio, true);
  addEventListener('keydown', unlockAudio, true);

  // ================= 렌더러 =================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#20352f');
  scene.fog = new THREE.Fog('#20352f', 55, 110);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 300);
  const renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.BasicShadowMap;
  $('game').appendChild(renderer.domElement);
  function resize() {
    const w = innerWidth, h = innerHeight;
    const px = Math.max(2, Math.min(4, Math.round(Math.min(w, h) / 250)));
    renderer.setSize(Math.ceil(w / px), Math.ceil(h / px), false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  scene.add(new THREE.HemisphereLight(0xe8f4ff, 0x4d5b36, 0.5));
  const sun = new THREE.DirectionalLight(0xfff0d0, 0.72);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 90 });
  scene.add(sun, sun.target);

  // ================= 복셀 지오메트리 (박스를 하나의 메시로 병합) =================
  const BOX = new THREE.BoxGeometry(1, 1, 1);
  const BOXNI = BOX.toNonIndexed();
  const BP = BOXNI.attributes.position.array, BN = BOXNI.attributes.normal.array, NV = BP.length / 3;
  const _c = new THREE.Color();
  function geo(list) {
    const n = list.length * NV;
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
    let o = 0;
    for (const [x, y, z, w, h, d, c] of list) {
      _c.set(c);
      const cx = (x + w / 2) * V, cy = (y + h / 2) * V, cz = (z + d / 2) * V;
      for (let i = 0; i < NV; i++, o++) {
        pos[o * 3] = BP[i * 3] * w * V + cx; pos[o * 3 + 1] = BP[i * 3 + 1] * h * V + cy; pos[o * 3 + 2] = BP[i * 3 + 2] * d * V + cz;
        nor[o * 3] = BN[i * 3]; nor[o * 3 + 1] = BN[i * 3 + 1]; nor[o * 3 + 2] = BN[i * 3 + 2];
        col[o * 3] = _c.r; col[o * 3 + 1] = _c.g; col[o * 3 + 2] = _c.b;
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.computeBoundingSphere();
    return g;
  }
  const VCM = new THREE.MeshLambertMaterial({ vertexColors: true });
  const GC = {};
  const cgeo = (key, fn) => GC[key] || (GC[key] = geo(fn()));
  function vmesh(g, shadow = true) { const m = new THREE.Mesh(g, VCM); m.castShadow = shadow; m.receiveShadow = true; return m; }
  const MC = {};
  const M = c => MC[c] || (MC[c] = new THREE.MeshLambertMaterial({ color: c }));

  function noiseTex(cols, n, rep) {
    const c = document.createElement('canvas'); c.width = c.height = n;
    const g = c.getContext('2d');
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { g.fillStyle = cols[(Math.random() * cols.length) | 0]; g.fillRect(x, y, 1, 1); }
    const t = new THREE.CanvasTexture(c);
    t.magFilter = t.minFilter = THREE.NearestFilter;
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]);

    }
    nx = Math.max(-34, Math.min(59, nx)); nz = Math.max(-78, Math.min(18, nz));
    if (nz < BEAR_Z) nx = Math.min(nx, 34);
    if (nx > QX) nz = Math.max(nz, BEAR_Z + 0.5);
    if (Math.abs(nx - STALL.x) < 1.9 && Math.abs(nz - STALL.z) < 0.95) {
      const ox = 1.9 - Math.abs(nx - STALL.x), oz = 0.95 - Math.abs(nz - STALL.z);
      if (ox < oz) nx += Math.sign(nx - STALL.x || 1) * ox; else nz += Math.sign(nz - STALL.z || 1) * oz;
    }
    player.x = nx; player.z = nz;
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
    const D = derived();

    // 이동
    let mx = 0, mz = 0;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    if (keys['w'] || keys['arrowup']) mz -= 1;
    if (keys['s'] || keys['arrowdown']) mz += 1;
    if (joy && Math.hypot(joy.dx, joy.dy) > 0.15) { mx = joy.dx; mz = joy.dy; }
    let ml = Math.hypot(mx, mz);
    if (player.stun > 0) { player.stun -= dt; ml = 0; }
    if (player.dead > 0) {
      ml = 0; player.dead -= dt;
      pg.rotation.x = -Math.min(1, (2.2 - player.dead) * 4) * Math.PI / 2;
      if (player.dead <= 0) revivePlayer();
    } else {
      if (player.inv > 0) player.inv -= dt;
      player.calm += dt;
      if (player.calm > 4) player.hp = Math.min(D.maxHp, player.hp + dt * 2);
      player.hp = Math.min(player.hp, D.maxHp);
    }
    const moving = ml > 0.01;
    if (moving) {
      if (ml > 1) { mx /= ml; mz /= ml; }
      tryMove(player.x + mx * D.speed * dt, player.z + mz * D.speed * dt);
      player.face = lerpAngle(player.face, Math.atan2(mx, mz), dt * 14);
      walkT += dt; stepT += dt; if (stepT > 0.3) { stepT = 0; SFX.step(); }
    }
    if (Math.abs(player.kx) + Math.abs(player.kz) > 0.05) {
      tryMove(player.x + player.kx * dt, player.z + player.kz * dt);
      const f = Math.exp(-7 * dt); player.kx *= f; player.kz *= f;
    }
    pg.position.set(player.x, 0, player.z); pg.rotation.y = player.face;
    animPerson(pg, moving, walkT);
    if (aura) { aura.position.set(player.x, 0.02, player.z); aura.rotation.y += dt * 1.5; }

    // 도끼 / 곡괭이 회전 + 타격
    spinA += D.spin * dt;
    axes.forEach((ax, i) => {
      const a = spinA + i * Math.PI * 2 / axes.length;
      const x = player.x + Math.cos(a) * D.radius, z = player.z + Math.sin(a) * D.radius;
      ax.position.set(x, 0.9, z); ax.rotation.set(0, -a, 0.25);
      for (const tr of trees) {
        if (!tr.alive || tr.hitCd[i] > 0 || Math.abs(tr.x - x) > 1.4 || Math.abs(tr.z - z) > 1.4) continue;
        if (dist(tr.x, tr.z, x, z) < (tr.big ? 1.1 : 0.85)) {
          tr.hitCd[i] = 0.25;
          const got = hitTree(tr, D.dmg);
          if (got) { SFX.fell(); for (let k = 0; k < got; k++) spawnDrop('w', tr.x, tr.z); } else SFX.chop();
        }
      }
      if (player.z < BEAR_Z + 3 && !player.dead) for (const b of bears) {
        if (!b.alive || b.hitCd[i] > 0 || Math.abs(b.x - x) > 3 || Math.abs(b.z - z) > 3) continue;
        if (dist(b.x, b.z, x, z) < b.def.hitR) {
          b.hitCd[i] = 0.3;
          const got = hitBear(b, D.dmg, player.x, player.z);
          for (const it of b.def.drops.slice(0, got)) spawnDrop(it, b.x, b.z);
        }
      }
    });
    picks.forEach((pk, i) => {
      const a = -spinA * 0.85 + i * Math.PI * 2 / picks.length;
      const R = D.radius + 0.9;
      const x = player.x + Math.cos(a) * R, z = player.z + Math.sin(a) * R;
      pk.position.set(x, 1.1, z); pk.rotation.set(0, -a, -0.3);
      if (player.x < QX - 3) return;
      for (const rk of rocks) {
        if (!rk.alive || rk.hitCd[i] > 0 || Math.abs(rk.x - x) > 1.5 || Math.abs(rk.z - z) > 1.5) continue;
        if (dist(rk.x, rk.z, x, z) < 1.05) {
          rk.hitCd[i] = 0.25;
          const got = hitRock(rk, D.pickDmg);
          if (got) { SFX.crack(); for (const it of got) spawnDrop(it, rk.x, rk.z); } else SFX.clink();
        }
      }
    });

    // 활: 가까운 짐승 자동 조준
    if (L.bow && !player.dead) {
      bowT -= dt;
      if (bowT <= 0) {
        const tg = nearest(bears, b => b.alive && dist(b.x, b.z, player.x, player.z) < 10);
        if (tg) {
          bowT = D.bowEvery;
          const m = vmesh(arrowGeo, false); m.scale.setScalar(1.3); scene.add(m);
          shots.push({ m, x: player.x, y: 1.3, z: player.z, tg, dmg: D.bowDmg, t: 0 });
          SFX.shoot();
        } else bowT = 0.2;
      }
    }
    for (let i = shots.length - 1; i >= 0; i--) {
      const a = shots[i]; a.t += dt;
      const ty = a.tg.kind === 'dino' ? 2.2 : 0.9;
      const dx = a.tg.x - a.x, dy = ty - a.y, dz = a.tg.z - a.z, d = Math.hypot(dx, dy, dz), st = 22 * dt;
      if (!a.tg.alive || a.t > 1.5) { scene.remove(a.m); shots.splice(i, 1); continue; }
      if (d <= st + 0.3) {
        const got = hitBear(a.tg, a.dmg, player.x, player.z);
        for (const it of a.tg.def.drops.slice(0, got)) spawnDrop(it, a.tg.x, a.tg.z);
        scene.remove(a.m); shots.splice(i, 1); continue;
      }
      a.x += dx / d * st; a.y += dy / d * st; a.z += dz / d * st;
      a.m.position.set(a.x, a.y, a.z); a.m.rotation.y = Math.atan2(dx, dz);
    }
    // 대검: 주기적으로 360도 베기
    if (L.sword && !player.dead) {
      swordT -= dt;
      if (swordT <= 0) {
        const near = bears.some(b => b.alive && dist(b.x, b.z, player.x, player.z) < D.swordR + 1.5) ||
                     trees.some(t => t.alive && dist(t.x, t.z, player.x, player.z) < D.swordR);
        if (near) {
          swordT = D.swordEvery; slashT = 0.32; SFX.whoosh();
          for (const b of bears) if (b.alive && dist(b.x, b.z, player.x, player.z) < D.swordR + (b.kind === 'dino' ? 1.2 : 0)) {
            const got = hitBear(b, D.swordDmg, player.x, player.z);
            for (const it of b.def.drops.slice(0, got)) spawnDrop(it, b.x, b.z);
          }
          for (const tr of trees) if (tr.alive && dist(tr.x, tr.z, player.x, player.z) < D.swordR) {
            const got = hitTree(tr, 2);
            if (got) for (let k = 0; k < got; k++) spawnDrop('w', tr.x, tr.z);
          }
        } else swordT = 0.3;
      }
    }
    if (slashT > 0) {
      slashT -= dt;
      const st = Math.min(3, Math.floor((L.sword - 1) / 2));
      if (!slashM || slashM.userData.t !== st) {
        if (slashM) scene.remove(slashM);
        slashM = vmesh(swordGeo(st), false); slashM.userData.t = st; scene.add(slashM);
      }
      const k = 1 - slashT / 0.32, a = player.face + k * Math.PI * 2;
      slashM.visible = true; slashM.scale.setScalar(D.swordR / 2.5);
      slashM.position.set(player.x, 1.1, player.z); slashM.rotation.set(0, a, 0);
      ring.visible = true; ring.position.set(player.x, 0.08, player.z);
      ring.scale.setScalar(D.swordR * (0.4 + k * 0.6)); ring.material.opacity = 0.6 * (1 - k);
    } else { if (slashM) slashM.visible = false; ring.visible = false; }

    updateWorld(dt, clock);
    updateBears(dt);

    // 아이템 줍기
    for (let i = drops.length - 1; i >= 0; i--) {
      const o = drops[i]; o.t += dt;
      if (o.state === 'pop' || o.state === 'ground') {
        if (o.state === 'pop') {
          o.vy -= 18 * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.z += o.vz * dt;
          if (o.y <= 0.02) { o.y = 0.02; o.state = 'ground'; }
        }
        if (o.t > 0.3 && !player.dead && dist(o.x, o.z, player.x, player.z) < D.magnet) {
          if (player.carry.length + player.reserved < D.cap) { o.state = 'fly'; player.reserved++; }
          else if (player.fullMsgT <= 0) { floatText('가방 가득!', player.x, 2.6, player.z, 'bad'); player.fullMsgT = 2.5; }
        }
        if (o.state === 'ground' && o.t > 60) { scene.remove(o.m); drops.splice(i, 1); continue; }
      }
      if (o.state === 'fly') {
        const tx = player.x, ty = 1.2 + player.carry.length * 0.26, tz = player.z;
        const k = Math.min(1, dt * 14);
        o.x += (tx - o.x) * k; o.y += (ty - o.y) * k; o.z += (tz - o.z) * k;
        if (dist(tx, tz, o.x, o.z) < 0.35) {
          player.carry.push(o.type); player.reserved--;
          if (o.type === 'm') stats.meat++;
          if (o.type === 'g') stats.gem++;
          SFX.pick();
          scene.remove(o.m); drops.splice(i, 1); continue;
        }
      }
      o.m.position.set(o.x, o.y, o.z); o.m.rotation.y += dt * 3;
    }
    if (player.fullMsgT > 0) player.fullMsgT -= dt;

    // 판매대 / 투입구에 내려놓기
    player.depT -= dt;
    if (player.carry.length && player.depT <= 0) {
      if (onPad(DEPOSIT.x, DEPOSIT.z, player.x, player.z)) {
        stock.push(player.carry.pop()); stats.deposited++; stockDirty = true; player.depT = 0.05; SFX.drop();
      } else {
        for (const b of BELTS) if (L[b.k] && onPad(b.hop.x, b.hop.z, player.x, player.z)) {
          beltPush(b, player.carry.pop()); stats.deposited++; player.depT = 0.05; SFX.drop(); break;
        }
      }
    }
    if (shownCarry !== player.carry.length) { shownCarry = player.carry.length; rebuildStack(stackG, player.carry, 60); }

    // 돈 더미
    if (cashPile > 0 && dist(player.x, player.z, CASH.x, CASH.z) < 1.6) collectCash(false);
    if (L.bank) { bankT += dt; if (bankT > 2.5) { bankT = 0; if (cashPile > 0) collectCash(true); } }
    rebuildCash();
    if (stockDirty) rebuildStock();

    updatePads(dt);
    updateBelts(dt, D);
    updateCustomers(dt, clock, D);
    updateNpcs(dt, clock);
    for (const c of cashiers) if (c) animPerson(c, false, clock);

    // 파편 / 코인
    for (let i = chips.length - 1; i >= 0; i--) {
      const c = chips[i]; c.t += dt; c.vy -= 16 * dt;
      c.x += c.vx * dt; c.y += c.vy * dt; c.z += c.vz * dt;
      if (c.y < 0.05) { c.y = 0.05; c.vx *= 0.6; c.vz *= 0.6; }
      c.m.position.set(c.x, c.y, c.z);
      if (c.t > 0.7) { scene.remove(c.m); chips.splice(i, 1); }
    }
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i]; c.t += dt;
      if (c.t < 0) continue;
      const k = Math.min(1, c.t / c.dur);
      c.m.visible = true;
      c.m.position.set(c.ax + (c.bx - c.ax) * k, c.ay + (c.by - c.ay) * k + Math.sin(k * Math.PI) * 1.6, c.az + (c.bz - c.az) * k);
      c.m.rotation.y += dt * 12;
      if (k >= 1) { scene.remove(c.m); coins.splice(i, 1); }
    }

    // 카메라 (멀리서 보는 시점, 줌 조절 가능)
    camGoal.set(player.x, 30 * zoom, player.z + 22 * zoom);
    camPos.lerp(camGoal, Math.min(1, dt * 5));
    camera.position.copy(camPos);
    if (shake > 0) { shake -= dt; camera.position.x += rand(-1, 1) * shake * 0.6; camera.position.y += rand(-1, 1) * shake * 0.6; }
    camera.lookAt(camPos.x, 0, camPos.z - 22 * zoom - 1);
    sun.position.set(player.x + 12, 30, player.z + 10);
    sun.target.position.set(player.x, 0, player.z - 4); sun.target.updateMatrixWorld();

    updateGoal(clock);
    renderer.render(scene, camera);

    // HTML 라벨
    for (const p of PADS) if (!p.tag.hidden) project(p.x, 0, p.z + 1.0, p.tag);
    project(DEPOSIT.x - 2.1, 0, DEPOSIT.z - 0.2, depTag, -12);
    chkTag.hidden = L.cashier > 0;
    if (!chkTag.hidden) project(CHECK[0].x + 0.4, 0, CHECK[0].z - 1.0, chkTag, -24);
    stockTag.textContent = '재고 ' + stock.length + ' · 손님 ' + custs.filter(c => c.state !== 'leave').length;
    project(STALL.x, 3.1, STALL.z, stockTag, -26);
    cashTag.hidden = cashPile <= 0;
    if (!cashTag.hidden) { cashTag.innerHTML = `<div class="c"><i class="coin"></i>${cashPile}</div>`; project(CASH.x + 1.9, 0, CASH.z, cashTag, -12); }
    BELTS.forEach((b, i) => { hopTags[i].hidden = !L[b.k]; if (L[b.k]) project(b.hop.x, 1, b.hop.z + 1, hopTags[i]); });
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i]; f.t += dt;
      project(f.x, f.y + f.t * 1.4, f.z, f.d, -12);
      f.d.style.opacity = Math.max(0, 1 - f.t / 1.1);
      if (f.t > 1.1) { f.d.remove(); floats.splice(i, 1); }
    }

    // HUD
    $('hGold').textContent = gold;
    $('hBag').textContent = player.carry.length + '/' + D.cap;
    $('hBagBar').style.width = Math.min(100, player.carry.length / D.cap * 100) + '%';
    $('hRank').textContent = RANKS[curTier] + ' · 힘 ' + power();
    $('hHp').textContent = Math.ceil(player.hp) + '/' + D.maxHp;
    $('hHpBar').style.width = Math.max(0, player.hp / D.maxHp * 100) + '%';
    if (goldBumpT > 0) { goldBumpT -= dt; if (goldBumpT <= 0) $('goldBox').classList.remove('bump'); }
    if (player.hurtT > 0) player.hurtT -= dt;
    $('hurt').style.opacity = Math.max(0, player.hurtT / 0.35);
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
    if (resetArm > 0) { resetArm -= dt; if (resetArm <= 0) { $('btnReset').textContent = '처음부터'; $('btnReset').classList.remove('warn'); } }
    if (clock > 8) $('hint').hidden = true;

    saveT += dt; if (saveT > 4) { saveT = 0; saveLocal(); }
    cloudT += dt; if (cloudT > 30) { cloudT = 0; saveCloud(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
