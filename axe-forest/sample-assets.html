<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  if (!window.THREE || !THREE.GLTFLoader || !THREE.SkeletonUtils) { $('loadTxt').textContent = '3D 엔진을 불러오지 못했습니다. 새로고침해 주세요.'; return; }
  const hasPost = !!(THREE.EffectComposer && THREE.UnrealBloomPass && THREE.ShaderPass);

  // ---------- 렌더러 ----------
  const renderer = new THREE.WebGLRenderer({ antialias: !hasPost });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  $('v').appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog('#d6e6ee', 38, 90);
  const camera = new THREE.PerspectiveCamera(36, 1, 0.3, 300);
  const lin = c => new THREE.Color(c).convertSRGBToLinear();
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vP; void main(){ vP = (modelMatrix * vec4(position,1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vP; void main(){ float h = normalize(vP).y; gl_FragColor = vec4(mix(vec3(0.98,0.9,0.78), vec3(0.36,0.62,0.9), smoothstep(-0.05, 0.45, h)), 1.0); }',
  })));
  scene.add(new THREE.HemisphereLight(0xd6ebff, 0x5a4a30, 0.95));
  const sun = new THREE.DirectionalLight(0xfff0d8, 2.3);
  sun.position.set(-14, 26, 12); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 4; sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
  Object.assign(sun.shadow.camera, { left: -28, right: 28, top: 28, bottom: -28, near: 1, far: 80 });
  scene.add(sun, sun.target); sun.target.position.set(0, 0, 4);

  // ---------- 도구 ----------
  const hash = (x, y) => { let h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967295; };
  function vnoise(x, y) { const X = Math.floor(x), Y = Math.floor(y), fx = x - X, fy = y - Y, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = hash(X, Y), b = hash(X + 1, Y), c = hash(X, Y + 1), d = hash(X + 1, Y + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
  let sd = 9; const rnd = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const baseEdge = (x, z) => Math.max(Math.abs(x) - 13, z < 5 ? -6 - z : z - 16);
  const heightAt = (x, z) => { const e = baseEdge(x, z); return e > 2 ? Math.max(-0.2, (vnoise(x * 0.12, z * 0.12) - 0.4) * Math.min(1, (e - 2) / 6) * 2.0) : 0; };
  function canvasTex(w, h, draw, rep) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
    if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
    return t;
  }
  const std = (c, o) => { const m = new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.85, metalness: 0 }, o || {})); m.color = lin(c); if (o && o.emissive) m.emissive = lin(o.emissive); return m; };
  function box(geo, mat, x, y, z) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m; }

  // ---------- 모델 불러오기 ----------
  const loader = new THREE.GLTFLoader();
  const cache = {};
  let loaded = 0, total = 0;
  function load(url) {
    if (!cache[url]) { total++; cache[url] = new Promise((res, rej) => loader.load(url, g => { loaded++; $('loadBar').style.width = (loaded / total * 100) + '%'; res(g); }, undefined, rej)); }
    return cache[url];
  }
  const normScale = {};
  // Kenney 자연 팩은 금속값 1로 저장돼 있어 반사 환경 없이 어둡게 보인다 → 무광 재질로 보정
  const fixed = new WeakSet();
  function fixMat(mat) {
    for (const m of Array.isArray(mat) ? mat : [mat]) {
      if (!m || fixed.has(m)) continue; fixed.add(m);
      if (m.metalness !== undefined && m.metalness > 0.3) { m.metalness = 0; m.roughness = 0.85; }
      if (m.map) m.map.anisotropy = 4;
    }
  }
  // 모델을 복제하고 높이를 맞춘다 (h: 월드 높이)
  async function place(url, x, z, h, rotY, parent) {
    const g = await load(url);
    const o = g.scene.clone(true);
    if (!normScale[url]) { const b = new THREE.Box3().setFromObject(g.scene); normScale[url] = 1 / Math.max(0.001, b.max.y - b.min.y); }
    o.scale.setScalar(normScale[url] * h);
    o.position.set(x, heightAt(x, z), z); o.rotation.y = rotY || 0;
    o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; fixMat(m.material); } });
    (parent || scene).add(o);
    return o;
  }
  const A = 'assets/';
  const CHARS = ['Barbarian', 'Knight', 'Mage', 'Ranger', 'Rogue', 'Rogue_Hooded'];
  const preload = [
    ...CHARS.map(c => A + 'chars/' + c + '.glb'), A + 'anims/Rig_Medium_General.glb', A + 'anims/Rig_Medium_MovementBasic.glb',
    A + 'items/axe_1handed.gltf', A + 'items/bow_withString.gltf', A + 'items/quiver.gltf',
  ];
  try { await Promise.all(preload.map(load)); }
  catch (e) { $('loadTxt').textContent = '모델 파일을 찾지 못했습니다: ' + (e && e.message ? e.message : e); return; }
  const clips = [...(await load(A + 'anims/Rig_Medium_General.glb')).animations, ...(await load(A + 'anims/Rig_Medium_MovementBasic.glb')).animations];
  const clip = n => THREE.AnimationClip.findByName(clips, n);

  // ---------- 지형 ----------
  {
    const g = new THREE.PlaneGeometry(100, 100, 160, 160); g.rotateX(-Math.PI / 2); g.translate(0, 0, 4);
    const p = g.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
    const G1 = new THREE.Color('#5c9a3c'), G2 = new THREE.Color('#7cb84a'), G3 = new THREE.Color('#4a8634'), S1 = new THREE.Color('#e3c792'), S2 = new THREE.Color('#cfae76');
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i), e = baseEdge(x, z), road = Math.abs(x) - 2.2 + vnoise(x * .5, z * .5) * .6;
      const n = vnoise(x * 0.18, z * 0.18), n2 = vnoise(x * 0.9, z * 0.9);
      const sandK = Math.min(1, Math.max(Math.max(0, (0.8 - e) / 1.6), z > 15 ? Math.max(0, (0.6 - road) / 1.2) : 0));
      c.copy(G3).lerp(G1, n).lerp(G2, n2 * 0.5).lerp(new THREE.Color().copy(S2).lerp(S1, n2), sandK).convertSRGBToLinear();
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
      p.setY(i, heightAt(x, z));
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
    const ground = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true })); ground.receiveShadow = true; scene.add(ground);
  }
  // 흔들리는 풀
  const grassU = { time: { value: 0 } };
  {
    const blade = new THREE.PlaneGeometry(0.11, 0.3, 1, 3); blade.translate(0, 0.15, 0);
    const mat = new THREE.MeshLambertMaterial({ side: THREE.DoubleSide });
    mat.onBeforeCompile = sh => {
      sh.uniforms.time = grassU.time;
      sh.vertexShader = 'uniform float time;\n' + sh.vertexShader.replace('#include <begin_vertex>',
        `#include <begin_vertex>
         vec4 wp = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
         float k = position.y * position.y * 6.0;
         transformed.x += sin(time * 1.7 + wp.x * 0.5 + wp.z * 0.35) * k * 0.35;`);
    };
    const N = 18000, im = new THREE.InstancedMesh(blade, mat, N), o = new THREE.Object3D(), c = new THREE.Color(); let n = 0;
    for (let i = 0; i < N * 3 && n < N; i++) {
      const x = rnd() * 80 - 40, z = rnd() * 70 - 26;
      if (baseEdge(x, z) < 0.6 || (z > 15 && Math.abs(x) < 3)) continue;
      o.position.set(x, heightAt(x, z), z); o.rotation.set(0, rnd() * 3.14, 0); const s = 0.6 + rnd() * 0.9; o.scale.set(s, s, s); o.updateMatrix();
      im.setMatrixAt(n, o.matrix); im.setColorAt(n, c.setHSL(0.25 + rnd() * 0.05, 0.5, 0.3 + rnd() * 0.12).convertSRGBToLinear()); n++;
    }
    im.count = n; im.receiveShadow = true; scene.add(im);
  }

  // ---------- 자연 (Kenney Nature Kit) ----------
  const TREES = ['tree_default', 'tree_oak', 'tree_fat', 'tree_detailed', 'tree_simple', 'tree_tall', 'tree_default', 'tree_oak', 'tree_oak_fall'];
  const PINES = ['tree_pineTallA', 'tree_pineTallB', 'tree_pineRoundA', 'tree_pineRoundC', 'tree_pineDefaultA', 'tree_cone'];
  const treeObjs = [];
  const jobs = [];
  for (let i = 0; i < 80; i++) {
    const x = rnd() * 78 - 39, z = rnd() * 66 - 30;
    if (baseEdge(x, z) < 2.5 || (z > 14 && Math.abs(x) < 4)) continue;
    const isPine = rnd() < 0.4, name = isPine ? pick(PINES) : pick(TREES);
    jobs.push(place(A + 'nature/' + name + '.glb', x, z, (isPine ? 5 : 4.2) * (0.85 + rnd() * 0.4), rnd() * 6.28).then(o => treeObjs.push({ o, ph: rnd() * 6 })));
  }
  for (let i = 0; i < 26; i++) { const x = rnd() * 70 - 35, z = rnd() * 56 - 24; if (baseEdge(x, z) < 1.5) continue; jobs.push(place(A + 'nature/' + pick(['rock_largeA', 'rock_largeB', 'rock_largeC', 'rock_smallA', 'rock_smallC', 'rock_tallA', 'stone_largeA']) + '.glb', x, z, 0.6 + rnd() * 1.2, rnd() * 6.28)); }
  for (let i = 0; i < 90; i++) { const x = rnd() * 60 - 30, z = rnd() * 50 - 20; if (baseEdge(x, z) < 1) continue; jobs.push(place(A + 'nature/' + pick(['flower_redA', 'flower_yellowA', 'flower_purpleA', 'flower_redB', 'flower_yellowB', 'plant_bush', 'plant_bushDetailed', 'mushroom_red', 'grass_large', 'grass_leafs']) + '.glb', x, z, 0.35 + rnd() * 0.35, rnd() * 6.28)); }
  for (const [x, z] of [[-16, 1], [-15, 9], [16, 12], [15.5, -3]]) jobs.push(place(A + 'nature/' + pick(['stump_round', 'stump_old', 'log_large', 'log_stackLarge']) + '.glb', x, z, 0.7, rnd() * 6));
  // 북쪽 울타리 (Kenney 울타리를 이어 붙임)
  for (let x = -12.5; x <= 12.5; x += 1) if (Math.abs(x) > 2) jobs.push(place(A + 'nature/fence_simple.glb', x, -6.4, 0.9, 0));

  // ---------- 기지 (Survival Kit + 직접 만든 판매대·발판·컨베이어) ----------
  const woodTex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#a0703f'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 32) { g.fillStyle = '#7a5230'; g.fillRect(0, y, w, 3); for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(90,56,30,${0.15 + Math.random() * 0.2})`; g.fillRect(Math.random() * w, y + 4 + Math.random() * 26, 20 + Math.random() * 50, 1.5); } }
  });
  const woodM = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.8 });
  const stripeTex = canvasTex(256, 64, g => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#fff3dc' : '#e2574c'; g.fillRect(i * 32, 0, 32, 64); } });
  box(new THREE.BoxGeometry(3.4, 1.0, 1.3), woodM, 0, 0.5, 6);
  box(new THREE.BoxGeometry(3.7, 0.12, 1.55), woodM, 0, 1.06, 6);
  for (const [x, z] of [[-1.65, 5.4], [1.65, 5.4], [-1.65, 6.6], [1.65, 6.6]]) box(new THREE.CylinderGeometry(0.07, 0.07, 2.2, 8), woodM, x, 1.9, z);
  { const g = new THREE.PlaneGeometry(4.1, 2.1, 16, 8), p = g.attributes.position;
    for (let i = 0; i < p.count; i++) p.setZ(i, Math.cos(p.getY(i) / 2.1 * Math.PI) * 0.35);
    g.computeVertexNormals();
    const aw = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: stripeTex, side: THREE.DoubleSide, roughness: 0.9 })); aw.rotation.x = -Math.PI / 2 + 0.25; aw.position.set(0, 3.05, 6); aw.castShadow = true; scene.add(aw); }
  jobs.push(place(A + 'survival/resource-wood.glb', -0.9, 5.9, 0.35, 0.2).then(o => o.position.y = 1.12));
  jobs.push(place(A + 'survival/fish.glb', 0.3, 6, 0.25, 0.4).then(o => o.position.y = 1.12));
  jobs.push(place(A + 'survival/resource-stone.glb', 1.0, 6.1, 0.3, 0).then(o => o.position.y = 1.12));
  for (const [f, x, z, h, r] of [['barrel', -2.5, 7.3, 0.9, 0], ['box-large', 2.7, 7.4, 0.8, 0.3], ['box', 2.6, 6.5, 0.55, -0.2], ['chest', 12.4, 12.4, 0.6, -1.2],
    ['workbench', -9.8, 13, 1, 0.3], ['tent', -12.2, 16.4, 2.2, 0.6], ['resource-planks', -8, 14.5, 0.4, 0.4], ['barrel-open', -12.8, 3.5, 0.9, 0], ['bucket', 3.4, 7.7, 0.4, 0]]) jobs.push(place(A + 'survival/' + f + '.glb', x, z, h, r));
  jobs.push(place(A + 'nature/campfire_logs.glb', -9.5, 16.5, 0.45, 0));
  jobs.push(place(A + 'nature/log_stack.glb', -12.6, 8.4, 0.8, 1.2));
  const fireLight = new THREE.PointLight(0xff8a3a, 1.4, 7, 2); fireLight.position.set(-9.5, 1, 16.5); scene.add(fireLight);
  // 컨베이어
  const beltTex = canvasTex(128, 32, g => { g.fillStyle = '#34383f'; g.fillRect(0, 0, 128, 32); g.strokeStyle = '#4c525c'; g.lineWidth = 3; for (let x = 0; x < 128; x += 16) { g.beginPath(); g.moveTo(x, 2); g.lineTo(x + 8, 16); g.lineTo(x, 30); g.stroke(); } }, [12, 1]);
  box(new THREE.BoxGeometry(9.6, 0.35, 1.0), std('#5d646e', { metalness: 0.4, roughness: 0.5 }), -6.4, 0.45, 6);
  { const top = new THREE.Mesh(new THREE.PlaneGeometry(9.5, 0.8), new THREE.MeshStandardMaterial({ map: beltTex, roughness: 0.6 })); top.rotation.x = -Math.PI / 2; top.position.set(-6.4, 0.635, 6); top.receiveShadow = true; scene.add(top); }
  for (const s of [-1, 1]) box(new THREE.BoxGeometry(9.6, 0.08, 0.08), std('#ffc93a', { metalness: 0.3, roughness: 0.4 }), -6.4, 0.68, 6 + s * 0.46);
  box(new THREE.CylinderGeometry(0.85, 0.55, 0.9, 12), std('#6b737e', { metalness: 0.5, roughness: 0.45 }), -11.8, 0.9, 6);
  box(new THREE.BoxGeometry(0.9, 0.9, 0.9), std('#4d545e'), -11.8, 0.45, 6);
  const beltLogs = [];
  for (let i = 0; i < 4; i++) jobs.push(place(A + 'survival/resource-wood.glb', -11, 6, 0.3, Math.PI / 2).then(o => beltLogs.push({ o, p: i / 4 })));
  // 강화 발판 + 도구 아이콘 (Survival Kit 도구)
  const padM = std('#d9b67a', { roughness: 0.6 }), rimM = std('#e8b440', { metalness: 0.7, roughness: 0.3, emissive: '#3a2400' });
  const icons = [];
  const PADS = [[-10.5, -2, 'tool-axe'], [-7.5, -2, 'tool-axe-upgraded'], [-4.5, -2, 'tool-hammer'], [4.5, -2, 'bedroll'], [7.5, -2, 'bucket'], [10.5, -2, 'signpost'],
    [-10.5, 9.5, 'tool-axe'], [-7.5, 9.5, 'tool-pickaxe'], [4.5, 9.5, 'chest'], [7.5, 9.5, 'box-open'], [0, 4.1, 'resource-wood']];
  for (const [x, z, f] of PADS) {
    box(new THREE.CylinderGeometry(0.85, 0.9, 0.1, 28), padM, x, 0.05, z);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.87, 0.05, 8, 32), rimM); rim.rotation.x = Math.PI / 2; rim.position.set(x, 0.1, z); scene.add(rim);
    jobs.push(place(A + 'survival/' + f + '.glb', x, z, 0.75, 0).then(o => { o.position.y = 1.1; icons.push({ o, x }); }));
  }
  // 등불
  const lampLights = [];
  for (const [x, z] of [[-3.2, 3], [3.4, 8.4], [-13.2, 0], [13.2, 0], [-2.6, 16.5], [2.6, 16.5]]) {
    box(new THREE.CylinderGeometry(0.06, 0.09, 2.4, 8), std('#3d342c'), x, 1.2, z);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 8), new THREE.MeshBasicMaterial({ color: lin('#fff0b8') })); bulb.position.set(x, 2.45, z); scene.add(bulb);
    const L = new THREE.PointLight(0xffb870, 0.8, 7, 2); L.position.set(x, 2.4, z); scene.add(L); lampLights.push(L);
  }

  // ---------- 캐릭터 (KayKit + 애니메이션) ----------
  const mixers = [];
  async function character(name, x, z, h, anim, hand) {
    const g = await load(A + 'chars/' + name + '.glb');
    const o = THREE.SkeletonUtils.clone(g.scene);
    if (!normScale[name]) { const b = new THREE.Box3().setFromObject(g.scene); normScale[name] = 1 / (b.max.y - b.min.y); }
